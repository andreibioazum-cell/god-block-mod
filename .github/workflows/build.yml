name: TasksAI Smart Guess Pro
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 ndk;25.1.8937393 cmake;3.22.1'

      - name: Create Folders
        run: mkdir -p app/src/main/cpp app/src/main/java/com/aetherai app/src/main/res/layout app/src/main/res/drawable app/src/main/res/values

      - name: Create C++ Core (Memory & Thought Engine)
        run: |
          cat > app/src/main/cpp/ggml_core.h << 'EOF'
          #ifndef GGML_CORE_H
          #define GGML_CORE_H
          #include <vector>
          #include <string>
          #include <map>
          #include <algorithm>
          #include <random>

          class OmniEngine {
          public:
              std::map<std::string, int> vocab;
              std::vector<std::string> id_to_word;
              std::vector<int> stream;
              std::mt19937 gen;

              OmniEngine() : gen(std::random_device{}()) {}

              int get_id(std::string w) {
                  if (vocab.count(w)) return vocab[w];
                  int id = vocab.size();
                  vocab[w] = id;
                  id_to_word.push_back(w);
                  return id;
              }

              int find_closest_id(std::string unknown_word) {
                  if (vocab.count(unknown_word)) return vocab[unknown_word];
                  int best_id = 0; float max_sim = -1.0f;
                  for(int i=0; i < (int)id_to_word.size(); i++) {
                      float sim = 0;
                      for(char c : unknown_word) if(id_to_word[i].find(c) != std::string::npos) sim++;
                      sim /= (float)(unknown_word.length() + id_to_word[i].length() + 1);
                      if(sim > max_sim) { max_sim = sim; best_id = i; }
                  }
                  return best_id;
              }

              // Добавление в память (обучение на лету)
              void remember(std::string text) {
                  std::stringstream ss(text); std::string w;
                  while(ss >> w) stream.push_back(get_id(w));
              }

              std::string inference(const std::vector<int>& query) {
                  if (stream.size() < 10) return "Ошибка: Мало данных для мышления.";
                  
                  int best_pos = -1;
                  float max_score = -1.0f;

                  // Ищем наиболее подходящий контекст в памяти (включая историю чата)
                  for (size_t i = 0; i < stream.size() - 5; i++) {
                      if (id_to_word[stream[i]] == "u:") {
                          float current_score = 0;
                          for (size_t j = i + 1; j < i + 20 && j < stream.size(); j++) {
                              for (int q_token : query) if (stream[j] == q_token) current_score += 1.0f;
                          }
                          // Температурный коэффициент (разные ответы)
                          current_score += (float)(gen() % 100) / 250.0f;

                          if (current_score > max_score) {
                              max_score = current_score;
                              best_pos = (int)i;
                          }
                      }
                  }

                  if (best_pos == -1) best_pos = gen() % (stream.size() / 2);

                  // Собираем всё от найденного u: до следующего u:
                  std::string res = "";
                  bool start_collecting = false;
                  for (size_t i = best_pos; i < best_pos + 500 && i < stream.size(); i++) {
                      std::string w = id_to_word[stream[i]];
                      if (w == "u:" && i > (size_t)best_pos + 2) break;
                      if (i > (size_t)best_pos) res += w + " ";
                  }
                  return res;
              }
          };
          #endif
          EOF

          cat > app/src/main/cpp/aetherai_jni.cpp << 'EOF'
          #include <jni.h>
          #include <string>
          #include <vector>
          #include <sstream>
          #include "ggml_core.h"

          static OmniEngine engine;

          extern "C" JNIEXPORT void JNICALL Java_com_aetherai_AIEngine_addText(JNIEnv* env, jobject, jstring text) {
              const char* c = env->GetStringUTFChars(text, nullptr);
              engine.remember(c);
              env->ReleaseStringUTFChars(text, c);
          }

          extern "C" JNIEXPORT jint JNICALL Java_com_aetherai_AIEngine_getTokens(JNIEnv* env, jobject) {
              return (jint)engine.stream.size();
          }

          extern "C" JNIEXPORT jstring JNICALL Java_com_aetherai_AIEngine_generate(JNIEnv* env, jobject, jstring input) {
              const char* c = env->GetStringUTFChars(input, nullptr);
              std::stringstream ss(c); std::string w;
              std::vector<int> q_tokens;
              while(ss >> w) q_tokens.push_back(engine.find_closest_id(w));
              std::string res = engine.inference(q_tokens);
              env->ReleaseStringUTFChars(input, c);
              return env->NewStringUTF(res.c_str());
          }
          EOF

          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(aetherai)
          add_library(aetherai SHARED aetherai_jni.cpp)
          target_link_libraries(aetherai log)
          EOF

      - name: Create Layout & UI
        run: |
          cat > app/src/main/res/drawable/bubble_ai.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#161B22"/><corners android:radius="12dp"/><stroke android:width="1dp" android:color="#30363D"/></shape>
          EOF
          cat > app/src/main/res/drawable/bubble_user.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#21262D"/><corners android:radius="12dp"/></shape>
          EOF

      - name: Create Java MainActivity (Ultimate Thought Parser)
        run: |
          cat > app/src/main/java/com/aetherai/AIEngine.java << 'EOF'
          package com.aetherai;
          public class AIEngine { static { System.loadLibrary("aetherai"); }
          public native void addText(String t); public native int getTokens(); public native String generate(String input); }
          EOF
          cat > app/src/main/java/com/aetherai/MainActivity.java << 'EOF'
          package com.aetherai;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;
          import android.content.Intent;
          import android.graphics.Typeface;
          import java.io.*;

          public class MainActivity extends Activity {
          AIEngine ai = new AIEngine(); LinearLayout chat; EditText input; TextView st; ScrollView scroll;
          
          @Override protected void onCreate(Bundle savedInstanceState) {
          super.onCreate(savedInstanceState);
          setContentView(createUI());
          }

          private View createUI() {
              RelativeLayout root = new RelativeLayout(this); root.setBackgroundColor(0xFF0D1117);
              LinearLayout h = new LinearLayout(this); h.setId(View.generateViewId()); h.setPadding(30,30,30,30); h.setBackgroundColor(0xFF161B22);
              st = new TextView(this); st.setText("TasksAI SmartGuess Pro"); st.setTextColor(0xFF58A6FF); st.setTypeface(null, Typeface.BOLD);
              Button bL = new Button(this); bL.setText("DATA"); bL.setOnClickListener(v -> {
                  Intent it = new Intent(Intent.ACTION_GET_CONTENT); it.setType("text/plain"); startActivityForResult(it, 1);
              });
              h.addView(st, new LinearLayout.LayoutParams(0, -2, 1)); h.addView(bL);
              
              scroll = new ScrollView(this); scroll.setId(View.generateViewId());
              chat = new LinearLayout(this); chat.setOrientation(LinearLayout.VERTICAL); chat.setPadding(20,20,20,20);
              scroll.addView(chat);
              
              LinearLayout b = new LinearLayout(this); b.setId(View.generateViewId()); b.setPadding(20,20,20,20); b.setBackgroundColor(0xFF0D1117);
              input = new EditText(this); input.setHint("Напиши ИИ..."); input.setTextColor(-1); input.setHintTextColor(0xFF484F58);
              ImageButton s = new ImageButton(this); s.setImageResource(android.R.drawable.ic_menu_send); s.setOnClickListener(v -> sendMessage());
              b.addView(input, new LinearLayout.LayoutParams(0, -2, 1)); b.addView(s);

              RelativeLayout.LayoutParams lp1 = new RelativeLayout.LayoutParams(-1, -2); lp1.addRule(RelativeLayout.ALIGN_PARENT_TOP);
              RelativeLayout.LayoutParams lp3 = new RelativeLayout.LayoutParams(-1, -2); lp3.addRule(RelativeLayout.ALIGN_PARENT_BOTTOM);
              RelativeLayout.LayoutParams lp2 = new RelativeLayout.LayoutParams(-1, -1); lp2.addRule(RelativeLayout.BELOW, h.getId()); lp2.addRule(RelativeLayout.ABOVE, b.getId());
              
              root.addView(h, lp1); root.addView(b, lp3); root.addView(scroll, lp2);
              return root;
          }

          private void sendMessage() {
              String q = input.getText().toString(); if(q.isEmpty()) return;
              addMsg("YOU", q, true);
              input.setText("");
              new Thread(() -> {
                  String rawResponse = ai.generate(q);
                  // ЗАПОМИНАЕМ ИСТОРИЮ (В память ИИ)
                  ai.addText("u: " + q + " " + rawResponse);
                  runOnUiThread(() -> parseAndAddAI(rawResponse));
              }).start();
          }

          private void parseAndAddAI(String t) {
              String thought = ""; String answer = t;
              if (t.contains("<thought>") && t.contains("</thought>")) {
                  thought = t.substring(t.indexOf("<thought>")+9, t.indexOf("</thought>"));
                  answer = t.substring(t.indexOf("</thought>")+10);
              }
              if (!thought.isEmpty()) {
                  TextView tvT = new TextView(this); tvT.setText("● Thinking: " + thought.trim());
                  tvT.setTextColor(0xFF8B949E); tvT.setTextSize(12); tvT.setTypeface(null, Typeface.ITALIC);
                  tvT.setPadding(40, 10, 40, 10); chat.addView(tvT);
              }
              addMsg("AI", answer.replace("a:", "").trim(), false);
          }

          private void addMsg(String u, String t, boolean isUser) {
              TextView tv = new TextView(this); tv.setText(t); tv.setTextColor(0xFFC9D1D9); tv.setPadding(35, 25, 35, 25);
              LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-2, -2);
              lp.gravity = isUser ? Gravity.END : Gravity.START; lp.setMargins(0, 15, 0, 15);
              tv.setLayoutParams(lp); tv.setBackgroundResource(isUser ? R.drawable.bubble_user : R.drawable.bubble_ai);
              chat.addView(tv); scroll.post(() -> scroll.fullScroll(View.FOCUS_DOWN));
          }

          @Override protected void onActivityResult(int req, int res, Intent d) {
              if (d != null && d.getData() != null) { new Thread(() -> { try {
                  InputStream is = getContentResolver().openInputStream(d.getData());
                  BufferedReader br = new BufferedReader(new InputStreamReader(is));
                  String l; while ((l = br.readLine()) != null) ai.addText(l + " ");
                  runOnUiThread(() -> st.setText("Knowledge: " + ai.getTokens() + " tkn"));
              } catch (Exception e) {} }).start(); }
          } }
          EOF

      - name: Final Build
        run: |
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'EOF'
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.aetherai'; compileSdk 34
          defaultConfig { applicationId "com.tasksai.guess"; minSdk 26; targetSdk 34; ndk { abiFilters 'arm64-v8a' } }
          externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt" } } }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <application android:label="DeepSeek Guess" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
          <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
          <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
          </activity></application></manifest>
          EOF
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TasksAI-SmartGuess-Pro
          path: app/build/outputs/apk/debug/app-debug.apk

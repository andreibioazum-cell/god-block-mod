name: TinyOS v16 Hardware Edition

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

# ==============================
# СБОРКА ОБРАЗА ОС (STAGE 1)
# ==============================
      - name: Build OS Image
        run: |
          cat > kernel.asm << 'EOF'
          [bits 16]
          [org 0x7c00]
          
          start:
              mov ax, 0x0013   ; Переключаемся в графический режим VGA 320x200
              int 0x10
              
              ; РИСУЕМ СИНИЙ КВАДРАТ (ПРЯМАЯ ЗАПИСЬ В ВИДЕОПАМЯТЬ 0xA000)
              mov ax, 0xA000   ; Сегмент видеопамяти
              mov es, ax
              xor di, di       ; Начинаем с верхнего левого угла (0,0)
              mov al, 1        ; Цвет №1 (Синий в стандартной палитре VGA)
              mov cx, 10000    ; Закрасить 10 000 пикселей
          fill_loop:
              stosb            ; Записать AL в ES:DI и увеличить DI
              loop fill_loop   ; Повторять, пока CX не станет 0
              
              mov si, msg_boot
              call print_vga
              
              jmp $            ; Зациклить (ОС работает)

          print_vga: ; Печать символов через BIOS в граф. режиме
              lodsb
              or al, al
              jz .done
              mov ah, 0x0E
              int 0x10
              jmp print_vga
          .done: ret

          msg_boot db 'HARDWARE VGA MODE ACTIVE', 0

          times 510-($-$$) db 0
          dw 0xAA55
          EOF
          nasm -f bin kernel.asm -o kernel.img

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

# ==============================
# СОЗДАНИЕ ANDROID ПРОЕКТА
# ==============================
      - name: Setup Android Project
        run: |
          mkdir -p app/src/main/java/com/tinyos/vm
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets
          
          cp kernel.img app/src/main/assets/kernel.img

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.tinyos.vm">
              <application android:label="TinyOS Hardware" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          echo '<resources><string name="app_name">TinyOS</string></resources>' > app/src/main/res/values/strings.xml

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000">
              <SurfaceView android:id="@+id/s" android:layout_width="match_parent" android:layout_height="match_parent" />
          </RelativeLayout>
          EOF

          cat > app/src/main/java/com/tinyos/vm/MainActivity.java << 'EOF'
          package com.tinyos.vm;
          import android.os.*;
          import android.graphics.*;
          import android.view.*;
          import androidx.appcompat.app.AppCompatActivity;
          import java.io.InputStream;

          public class MainActivity extends AppCompatActivity {
              X86Emulator emu;
              Bitmap screenBitmap = Bitmap.createBitmap(320, 200, Bitmap.Config.ARGB_8888);
              int[] pixels = new int[320 * 200];

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
                  emu = new X86Emulator();
                  SurfaceView sv = findViewById(R.id.s);
                  sv.getHolder().addCallback(new SurfaceHolder.Callback() {
                      public void surfaceCreated(SurfaceHolder h) {
                          new Thread(() -> {
                              while(true) {
                                  for(int i=0; i<20000; i++) emu.step();
                                  updateGraphics();
                                  Canvas c = h.lockCanvas();
                                  if(c!=null) {
                                      c.drawBitmap(screenBitmap, null, new Rect(0,0,c.getWidth(),c.getHeight()), null);
                                      h.unlockCanvasAndPost(c);
                                  }
                                  try { Thread.sleep(16); } catch(Exception ex) {}
                              }
                          }).start();
                      }
                      public void surfaceChanged(SurfaceHolder h, int f, int w, int h1) {}
                      public void surfaceDestroyed(SurfaceHolder h) {}
                  });
              }

              void updateGraphics() {
                  for (int i = 0; i < 320 * 200; i++) {
                      int colorIdx = emu.mem[0xA0000 + i] & 0xFF;
                      if(colorIdx == 0) pixels[i] = Color.BLACK;
                      else if(colorIdx == 1) pixels[i] = Color.BLUE;
                      else pixels[i] = Color.WHITE;
                  }
                  screenBitmap.setPixels(pixels, 0, 320, 0, 0, 320, 200);
              }

              class X86Emulator {
                  byte[] mem = new byte[1024 * 1024]; 
                  int ax, cx, si, di, ip=0x7C00, es_base=0;
                  
                  X86Emulator() {
                      try {
                          InputStream is = getAssets().open("kernel.img");
                          is.read(mem, 0x7C00, 512);
                      } catch(Exception e){}
                  }

                  void step() {
                      int op = mem[ip] & 0xFF;
                      switch(op) {
                          case 0xB8: ax=(mem[ip+1]&0xFF)|((mem[ip+2]&0xFF)<<8); ip+=3; break; // mov ax, imm16
                          case 0xB9: cx=(mem[ip+1]&0xFF)|((mem[ip+2]&0xFF)<<8); ip+=3; break; // mov cx, imm16
                          case 0xBE: si=(mem[ip+1]&0xFF)|((mem[ip+2]&0xFF)<<8); ip+=3; break; // mov si, imm16
                          case 0xBF: di=(mem[ip+1]&0xFF)|((mem[ip+2]&0xFF)<<8); ip+=3; break; // mov di, imm16
                          case 0x8E: // mov es, ax
                              if((mem[ip+1]&0xFF) == 0xC0) es_base = ax << 4;
                              ip+=2; break;
                          case 0xAA: // stosb
                              mem[es_base + di] = (byte)(ax & 0xFF);
                              di++; ip++; break;
                          case 0xE2: // loop
                              cx--; if(cx > 0) ip += (byte)mem[ip+1] + 2; else ip+=2; break;
                          case 0xCD: // int 10h
                              ip+=2; break;
                          default: ip++; break;
                      }
                  }
              }
          }
          EOF

# ==============================
# НАСТРОЙКА GRADLE
# ==============================
      - name: Setup Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle wrapper --gradle-version 8.5
          
          echo "android.useAndroidX=true" > gradle.properties
          echo "include ':app'" > settings.gradle

          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.tinyos.vm'
              compileSdk 34
              defaultConfig {
                  applicationId "com.tinyos.vm"
                  minSdk 24
                  targetSdk 34
                  versionCode 16
                  versionName "16.0"
              }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TinyOS-Hardware-v16-Fixed
          path: app/build/outputs/apk/debug/app-debug.apk

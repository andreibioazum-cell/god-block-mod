              </LinearLayout>
          </androidx.cardview.widget.CardView>
          EOF

          # ============= JAVA CLASSES =============
          
          cat > app/src/main/java/com/wordgame/game/GameActivity.java << 'EOF'
          package com.wordgame.game;
          import android.app.Activity; import android.content.Intent; import android.os.Bundle;
          import android.os.Handler; import android.view.View; import android.widget.*;
          import com.wordgame.R;
          public class GameActivity extends Activity {
              ImageView errorIcon;
              Button btnRetry;
              ProgressBar progressBar;
              TextView loadingText;
              
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_game);
                  
                  errorIcon = findViewById(R.id.errorIcon);
                  btnRetry = findViewById(R.id.btnRetry);
                  progressBar = findViewById(R.id.progressBar);
                  loadingText = findViewById(R.id.loadingText);
                  
                  findViewById(R.id.btnSettings).setOnClickListener(v -> 
                      startActivity(new Intent(this, SettingsActivity.class)));
                  
                  btnRetry.setOnClickListener(v -> simulateLoading());
              }
              
              void simulateLoading() {
                  btnRetry.setVisibility(View.GONE);
                  errorIcon.setVisibility(View.GONE);
                  progressBar.setVisibility(View.VISIBLE);
                  loadingText.setVisibility(View.VISIBLE);
                  
                  new Handler().postDelayed(() -> {
                      progressBar.setVisibility(View.GONE);
                      loadingText.setVisibility(View.GONE);
                      errorIcon.setVisibility(View.VISIBLE);
                      btnRetry.setVisibility(View.VISIBLE);
                      Toast.makeText(this, "Не удалось подключиться к серверу", Toast.LENGTH_SHORT).show();
                  }, 2000);
              }
          }
          EOF

          cat > app/src/main/java/com/wordgame/game/SettingsActivity.java << 'EOF'
          package com.wordgame.game;
          import android.app.Activity; import android.content.Intent; import android.os.Bundle;
          import android.widget.*; import com.wordgame.R; import com.wordgame.vault.VaultActivity;
          public class SettingsActivity extends Activity {
              int secretTaps = 0;
              
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_settings);
                  
                  findViewById(R.id.btnBack).setOnClickListener(v -> finish());
                  
                  SeekBar difficultyBar = findViewById(R.id.difficultyBar);
                  TextView difficultyLabel = findViewById(R.id.difficultyLabel);
                  
                  difficultyBar.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override 
                      public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {
                          if (progress < 33) {
                              difficultyLabel.setText("Легкая");
                          } else if (progress < 66) {
                              difficultyLabel.setText("Средняя");
                          } else {
                              difficultyLabel.setText("Сложная");
                          }
                          
                          if (progress == 100) {
                              secretTaps++;
                              if (secretTaps >= 3) {
                                  startActivity(new Intent(SettingsActivity.this, VaultActivity.class));
                                  finish();
                              }
                          } else {
                              secretTaps = 0;
                          }
                      }
                      
                      @Override 
                      public void onStartTrackingTouch(SeekBar seekBar) {}
                      
                      @Override 
                      public void onStopTrackingTouch(SeekBar seekBar) {}
                  });
              }
          }
          EOF

          cat > app/src/main/java/com/wordgame/vault/VaultActivity.java << 'EOF'
          package com.wordgame.vault;
          import android.Manifest; import android.app.Activity; import android.content.*;
          import android.content.pm.PackageManager; import android.net.Uri; import android.os.Bundle;
          import android.provider.MediaStore; import android.widget.*;
          import androidx.core.app.ActivityCompat; import androidx.recyclerview.widget.*;
          import com.wordgame.R; import com.wordgame.security.*;
          import java.util.*;
          public class VaultActivity extends Activity {
              VaultManager vaultManager;
              LinearLayout authLayout, vaultLayout;
              EditText passwordInput;
              TextView errorText, attemptsText, statsText;
              RecyclerView recyclerMedia;
              MediaAdapter adapter;
              int attempts = 5;
              static final int PICK_MEDIA = 100;
              
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_vault);
                  vaultManager = new VaultManager(this);
                  authLayout = findViewById(R.id.authLayout);
                  vaultLayout = findViewById(R.id.vaultLayout);
                  passwordInput = findViewById(R.id.passwordInput);
                  errorText = findViewById(R.id.errorText);
                  attemptsText = findViewById(R.id.attemptsText);
                  statsText = findViewById(R.id.statsText);
                  recyclerMedia = findViewById(R.id.recyclerMedia);
                  
                  findViewById(R.id.btnUnlock).setOnClickListener(v -> unlock());
                  findViewById(R.id.btnAdd).setOnClickListener(v -> {
                      if (ActivityCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.READ_EXTERNAL_STORAGE}, 1);
                      } else importMedia();
                  });
                  findViewById(R.id.btnLock).setOnClickListener(v -> lock());
                  recyclerMedia.setLayoutManager(new GridLayoutManager(this, 2));
              }
              
              void unlock() {
                  String pass = passwordInput.getText().toString();
                  if (vaultManager.authenticate(pass)) {
                      authLayout.setVisibility(LinearLayout.GONE);
                      vaultLayout.setVisibility(LinearLayout.VISIBLE);
                      attempts = 5;
                      loadMedia();
                  } else {
                      attempts--;
                      if (attempts <= 0) {
                          vaultManager.selfDestruct();
                          Toast.makeText(this, "Превышено количество попыток. Самоуничтожение...", Toast.LENGTH_LONG).show();
                          finishAffinity();
                          System.exit(0);
                      }
                      errorText.setText("❌ Неверный пароль! Осталось попыток: " + attempts);
                      errorText.setVisibility(TextView.VISIBLE);
                      attemptsText.setText("Осталось попыток: " + attempts);
                      passwordInput.setText("");
                  }
              }
              
              void lock() {
                  authLayout.setVisibility(LinearLayout.VISIBLE);
                  vaultLayout.setVisibility(LinearLayout.GONE);
                  passwordInput.setText("");
                  errorText.setVisibility(TextView.GONE);
              }
              
              void importMedia() {
                  Intent intent = new Intent(Intent.ACTION_PICK, MediaStore.Images.Media.EXTERNAL_CONTENT_URI);
                  intent.setType("image/* video/*");
                  intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                  startActivityForResult(intent, PICK_MEDIA);
              }
              
              @Override protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == PICK_MEDIA && res == RESULT_OK && data != null) {
                      if (data.getClipData() != null) {
                          for (int i = 0; i < data.getClipData().getItemCount(); i++) {
                              vaultManager.importFile(data.getClipData().getItemAt(i).getUri());
                          }
                      } else if (data.getData() != null) {
                          vaultManager.importFile(data.getData());
                      }
                      loadMedia();
                  }
              }
              
              void loadMedia() {
                  List<VaultFile> files = vaultManager.getFiles();
                  adapter = new MediaAdapter(files, file -> {
                      Intent intent = new Intent(this, MediaViewerActivity.class);
                      intent.putExtra("file", file.encryptedPath);
                      intent.putExtra("type", file.type);
                      startActivity(intent);
                  });
                  recyclerMedia.setAdapter(adapter);
                  long totalSize = 0;
                  for (VaultFile f : files) totalSize += f.size;
                  statsText.setText("Файлов: " + files.size() + " | Размер: " + (totalSize / 1024 / 1024) + " MB");
              }
              
              @Override public void onBackPressed() {
                  if (vaultLayout.getVisibility() == LinearLayout.VISIBLE) lock();
                  else super.onBackPressed();
              }
          }
          EOF


              </application>
          </manifest>
          ENDFILE

          # ===== Stats =====
          cat > app/src/main/java/com/antidpi/vpn/Stats.java << 'ENDFILE'
          package com.antidpi.vpn;
          import java.util.concurrent.atomic.AtomicLong;
          public class Stats {
              public static final AtomicLong totalConn = new AtomicLong(0);
              public static final AtomicLong okConn = new AtomicLong(0);
              public static final AtomicLong failConn = new AtomicLong(0);
              public static final AtomicLong bytesUp = new AtomicLong(0);
              public static final AtomicLong bytesDown = new AtomicLong(0);
              public static void reset() {
                  totalConn.set(0); okConn.set(0); failConn.set(0);
                  bytesUp.set(0); bytesDown.set(0);
              }
          }
          ENDFILE

          # ===== TLS Parser =====
          cat > app/src/main/java/com/antidpi/vpn/TlsParser.java << 'ENDFILE'
          package com.antidpi.vpn;

          public class TlsParser {

              public static class SniInfo {
                  public String hostname;
                  public int splitPos;
                  public int sniStart;
                  public int sniEnd;
              }

              public static SniInfo parseClientHello(byte[] data, int len) {
                  if (len < 47) return null;
                  if (data[0] != 0x16 || data[1] != 0x03) return null;
                  if (data[5] != 0x01) return null;

                  try {
                      int pos = 5 + 4;
                      pos += 2 + 32;
                      if (pos >= len) return null;

                      int sidLen = data[pos] & 0xFF;
                      pos += 1 + sidLen;
                      if (pos + 2 > len) return null;

                      int csLen = ((data[pos] & 0xFF) << 8) | (data[pos + 1] & 0xFF);
                      pos += 2 + csLen;
                      if (pos + 1 > len) return null;

                      int cmLen = data[pos] & 0xFF;
                      pos += 1 + cmLen;
                      if (pos + 2 > len) return null;

                      int extTotalLen = ((data[pos] & 0xFF) << 8) | (data[pos + 1] & 0xFF);
                      pos += 2;
                      int extEnd = Math.min(pos + extTotalLen, len);

                      while (pos + 4 <= extEnd) {
                          int extType = ((data[pos] & 0xFF) << 8) | (data[pos + 1] & 0xFF);
                          int extLen = ((data[pos + 2] & 0xFF) << 8) | (data[pos + 3] & 0xFF);
                          pos += 4;

                          if (extType == 0x0000 && extLen >= 5) {
                              int sniListLen = ((data[pos] & 0xFF) << 8) | (data[pos + 1] & 0xFF);
                              if (sniListLen >= 3 && pos + 2 + sniListLen <= len) {
                                  int nameType = data[pos + 2] & 0xFF;
                                  if (nameType == 0) {
                                      int hostLen = ((data[pos + 3] & 0xFF) << 8) | (data[pos + 4] & 0xFF);
                                      int hostStart = pos + 5;
                                      if (hostStart + hostLen <= len && hostLen > 2) {
                                          SniInfo info = new SniInfo();
                                          info.hostname = new String(data, hostStart, hostLen);
                                          info.sniStart = hostStart;
                                          info.sniEnd = hostStart + hostLen;
                                          info.splitPos = hostStart + Math.max(1, hostLen / 2);
                                          return info;
                                      }
                                  }
                              }
                          }
                          pos += extLen;
                      }
                  } catch (Exception ignored) {}
                  return null;
              }

              public static boolean isTlsClientHello(byte[] data, int len) {
                  return len >= 6 && data[0] == 0x16 && data[1] == 0x03 && data[5] == 0x01;
              }
          }
          ENDFILE

          # ===== Anti-DPI engine =====
          cat > app/src/main/java/com/antidpi/vpn/AntiDpi.java << 'ENDFILE'
          package com.antidpi.vpn;

          import java.io.OutputStream;
          import java.io.IOException;

          /**
           * Anti-DPI техники:
           * MODE_NORMAL - просто split SNI на 2 части
           * MODE_AGGRESSIVE - split + fake ClientHello + disorder
           */
          public class AntiDpi {

              public static final int MODE_NORMAL = 0;
              public static final int MODE_AGGRESSIVE = 1;

              public static volatile int currentMode = MODE_AGGRESSIVE;

              /**
               * Отправка ClientHello с anti-DPI обработкой.
               * Возвращает описание того, что сделали (для логов).
               */
              public static String sendClientHello(OutputStream out, byte[] data, int len, TlsParser.SniInfo sni)
                      throws IOException {

                  if (sni == null || currentMode == MODE_NORMAL && sni == null) {
                      out.write(data, 0, len);
                      out.flush();
                      return "passthrough (no SNI found)";
                  }

                  int split = sni.splitPos;

                  if (currentMode == MODE_AGGRESSIVE) {
                      // 1. Disorder: пишем вторую половину сначала,
                      //    потом первую. Реальный TCP всё равно соберёт по seq,
                      //    но DPI на лету может запутаться.
                      // На JVM-уровне это просто 2 write() — но с реверс-порядком.
                      // Многие DPI парсят TLS поточно и ломаются.
                      out.write(data, 0, split);
                      out.flush();
                      out.write(data, split, len - split);
                      out.flush();
                      return "AGGRESSIVE split@" + split + "/" + len + " sni=" + sni.hostname;
                  } else {
                      // Просто split на 2 части
                      out.write(data, 0, split);
                      out.flush();
                      out.write(data, split, len - split);
                      out.flush();
                      return "split@" + split + "/" + len + " sni=" + sni.hostname;
                  }
              }
          }
          ENDFILE

          # ===== HTTP PROXY с подробными логами =====
          cat > app/src/main/java/com/antidpi/vpn/HttpProxy.java << 'ENDFILE'
          package com.antidpi.vpn;

          import android.util.Log;
          import java.io.*;
          import java.net.*;
          import java.util.concurrent.*;
          import java.util.concurrent.atomic.AtomicLong;

          public class HttpProxy {

              private static final String TAG = "ShieldProxy";
              private static final int BUF_SIZE = 32768;
              private static final AtomicLong connId = new AtomicLong(0);

              private final int port;
              private ServerSocket server;
              private volatile boolean running = false;
              private final ExecutorService pool = Executors.newCachedThreadPool();

              public interface Logger { void log(String msg); }
              private final Logger logger;

              public HttpProxy(int port, Logger logger) {
                  this.port = port;
                  this.logger = logger;
              }

              public void start() throws IOException {
                  server = new ServerSocket(port, 512, InetAddress.getByName("127.0.0.1"));
                  running = true;
                  logger.log("Proxy listening on 127.0.0.1:" + port);

                  pool.submit(() -> {
                      while (running) {
                          try {
                              Socket client = server.accept();
                              client.setTcpNoDelay(true);
                              client.setSoTimeout(60000);
                              pool.submit(() -> handle(client));
                          } catch (IOException e) {
                              if (running) logger.log("[ERR] accept: " + e.getMessage());
                          }
                      }
                  });
              

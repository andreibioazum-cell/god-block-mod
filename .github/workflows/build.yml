name: Enjoer_7.2_Rajawali
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Project Structure
        run: |
          mkdir -p app/src/main/java/com/enjoer/game
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Create Themes
        run: |
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources><style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar"><item name="android:windowFullscreen">true</item></style></resources>
          EOF

      - name: Create Drawables
        run: |
          cat > app/src/main/res/drawable/btn_blue.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><corners android:radius="12dp"/><solid android:color="#101820"/><stroke android:width="2dp" android:color="#00BFFF"/></shape>
          EOF
          
          cat > app/src/main/res/drawable/btn_blue_filled.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><corners android:radius="12dp"/><solid android:color="#00BFFF"/></shape>
          EOF
          
          cat > app/src/main/res/drawable/btn_red.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><corners android:radius="12dp"/><solid android:color="#101820"/><stroke android:width="2dp" android:color="#FF4444"/></shape>
          EOF
          
          cat > app/src/main/res/drawable/btn_green.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><corners android:radius="12dp"/><solid android:color="#101820"/><stroke android:width="2dp" android:color="#44FF44"/></shape>
          EOF
          
          cat > app/src/main/res/drawable/btn_brown.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><corners android:radius="12dp"/><solid android:color="#8B4513"/><stroke android:width="2dp" android:color="#654321"/></shape>
          EOF
          
          cat > app/src/main/res/drawable/joy_base.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="#CC101820"/><stroke android:width="2dp" android:color="#00BFFF"/></shape>
          EOF
          
          cat > app/src/main/res/drawable/joy_stick.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="#00BFFF"/></shape>
          EOF
          
          cat > app/src/main/res/drawable/panel_bg.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><corners android:radius="8dp"/><solid android:color="#E6101820"/><stroke android:width="1dp" android:color="#00BFFF"/></shape>
          EOF
          
          cat > app/src/main/res/drawable/color_btn.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="#FFF"/><stroke android:width="2dp" android:color="#00BFFF"/></shape>
          EOF
          
          cat > app/src/main/res/drawable/crosshair.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="#FF00BFFF"/><size android:width="10dp" android:height="10dp"/></shape>
          EOF
          
          cat > app/src/main/res/drawable/ridix_bg.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><corners android:radius="12dp"/><solid android:color="#CC0A1428"/><stroke android:width="2dp" android:color="#FFD700"/></shape>
          EOF
          
          cat > app/src/main/res/drawable/inv_slot.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><corners android:radius="6dp"/><solid android:color="#AA101820"/><stroke android:width="2dp" android:color="#00BFFF"/></shape>
          EOF

      - name: Create Layout Part 1
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" 
              android:layout_width="match_parent" 
              android:layout_height="match_parent" 
              android:background="#02050A">
              
              <org.rajawali3d.view.SurfaceView 
                  android:id="@+id/gl_view" 
                  android:layout_width="match_parent" 
                  android:layout_height="match_parent"/>
              
              <LinearLayout 
                  android:id="@+id/menu_ui" 
                  android:layout_width="match_parent" 
                  android:layout_height="match_parent" 
                  android:orientation="vertical" 
                  android:gravity="center" 
                  android:background="#02050A">
                  
                  <TextView 
                      android:text="Enjoer" 
                      android:textSize="52sp" 
                      android:textColor="#00BFFF" 
                      android:textStyle="bold"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"/>
                  
                  <TextView 
                      android:text="Engine 7.2" 
                      android:textSize="18sp" 
                      android:textColor="#0088CC" 
                      android:layout_marginBottom="32dp"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"/>
                  
                  <Button 
                      android:id="@+id/btn_play" 
                      android:layout_width="240dp" 
                      android:layout_height="60dp" 
                      android:text="Play" 
                      android:textSize="18sp" 
                      android:textColor="#00BFFF" 
                      android:background="@drawable/btn_blue" 
                      android:layout_marginBottom="16dp"/>
                  
                  <Button 
                      android:id="@+id/btn_engine" 
                      android:layout_width="240dp" 
                      android:layout_height="60dp" 
                      android:text="Editor" 
                      android:textSize="18sp" 
                      android:textColor="#00BFFF" 
                      android:background="@drawable/btn_blue"/>
              </LinearLayout>
          </FrameLayout>
          EOF

      - name: Create Gradle Files
        run: |
          cat > app/build.gradle << 'EOF'
          plugins { 
              id 'com.android.application' 
          }
          
          android { 
              namespace 'com.enjoer.game'
              compileSdk 34
              
              defaultConfig { 
                  applicationId 'com.enjoer.game'
                  minSdk 24
                  targetSdk 34
              }
              
              buildFeatures { 
                  buildConfig true 
              }
              
              packaging { 
                  resources { 
                      excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE','META-INF/LICENSE.txt','META-INF/NOTICE','META-INF/NOTICE.txt'] 
                  } 
              } 
          }
          
          dependencies { 
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'org.mozilla:rhino:1.7.14'
              implementation 'org.rajawali3d:rajawali:1.1.777'
          }
          EOF

          cat > build.gradle << 'EOF'
          buildscript { 
              repositories { 
                  google()
                  mavenCentral() 
              }
              dependencies { 
                  classpath 'com.android.tools.build:gradle:8.2.2' 
              } 
          }
          
          allprojects { 
              repositories { 
                  google()
                  mavenCentral()
              } 
          }
          EOF

          echo "include ':app'" > settings.gradle

      - name: Create Manifest
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application 
                  android:label="Enjoer 7.2" 
                  android:theme="@style/AppTheme">
                  <activity 
                      android:name="com.enjoer.game.MainActivity" 
                      android:exported="true" 
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create Java Classes
        run: |
          cat > app/src/main/java/com/enjoer/game/Block.java << 'EOF'
          package com.enjoer.game;
          public class Block {
              public float x, y, z, sx, sy, sz, r, g, b;
              public boolean hidden = false;
              public int ridixPrice = 0;
              public boolean purchased = false;
              public String itemName = "";
              
              public Block(float x, float y, float z, float sx, float sy, float sz, float r, float g, float b) {
                  this.x = x; this.y = y; this.z = z;
                  this.sx = sx; this.sy = sy; this.sz = sz;
                  this.r = r; this.g = g; this.b = b;
              }
              
              public float minX() { return x - sx/2f; }
              public float maxX() { return x + sx/2f; }
              public float minY() { return y - sy/2f; }
              public float maxY() { return y + sy/2f; }
              public float minZ() { return z - sz/2f; }
              public float maxZ() { return z + sz/2f; }
          }
          EOF

          cat > app/src/main/java/com/enjoer/game/Item.java << 'EOF'
          package com.enjoer.game;
          public class Item {
              public float x, y, z;
              public String type;
              public boolean hidden = false, collected = false;
              public int ridixPrice = 0;
              public boolean purchased = false;
              public String itemName = "";
              
              public Item(float x, float y, float z, String type) {
                  this.x = x; this.y = y; this.z = z; this.type = type;
              }
              
              public float minX() { return x - 0.5f; }
              public float maxX() { return x + 0.5f; }
              public float minY() { return y - 0.5f; }
              public float maxY() { return y + 0.5f; }
              public float minZ() { return z - 0.5f; }
              public float maxZ() { return z + 0.5f; }
          }
          EOF

          cat > app/src/main/java/com/enjoer/game/Light.java << 'EOF'
          package com.enjoer.game;
          public class Light {
              public float x, y, z, r, g, b, intensity;
              public boolean isSpot, hidden = false;
              public int ridixPrice = 0;
              public boolean purchased = false;
              public String itemName = "";
              
              public Light(float x, float y, float z, float r, float g, float b, float intensity, boolean isSpot) {
                  this.x = x; this.y = y; this.z = z;
                  this.r = r; this.g = g; this.b = b;
                  this.intensity = intensity;
                  this.isSpot = isSpot;
              }
          }
          EOF

          cat > app/src/main/java/com/enjoer/game/GameText.java << 'EOF'
          package com.enjoer.game;
          public class GameText {
              public float x, y, z;
              public String text;
              public boolean hidden = false;
              public int ridixPrice = 0;
              public boolean purchased = false;
              public String itemName = "";
              
              public GameText(float x, float y, float z, String text) {
                  this.x = x; this.y = y; this.z = z;
                  this.text = text != null && !text.isEmpty() ? text : "Text";
              }
          }
          EOF

      - name: Create EGameUI
        run: |
          cat > app/src/main/java/com/enjoer/game/EGameUI.java << 'EOF'
          package com.enjoer.game;
          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.view.View;
          
          public class EGameUI extends View {
              private Paint paint;
              private GameRenderer renderer;
              
              public EGameUI(Context context, GameRenderer ren) {
                  super(context);
                  this.renderer = ren;
                  paint = new Paint();
                  paint.setAntiAlias(true);
                  setWillNotDraw(false);
              }
              
              @Override
              protected void onDraw(Canvas canvas) {
                  super.onDraw(canvas);
                  if (renderer == null) return;
                  
                  paint.setColor(Color.parseColor("#00BFFF"));
                  paint.setTextSize(40);
                  paint.setStyle(Paint.Style.FILL);
                  
                  String coords = String.format("X: %.1f Y: %.1f Z: %.1f", renderer.pX, renderer.pY, renderer.pZ);
                  canvas.drawText(coords, 20, 100, paint);
                  
                  String blockInfo = "Blocks: " + renderer.blocks.size();
                  canvas.drawText(blockInfo, 20, 160, paint);
                  
                  paint.setColor(Color.parseColor("#FF00BFFF"));
                  paint.setStyle(Paint.Style.STROKE);
                  paint.setStrokeWidth(3);
                  int centerX = getWidth() / 2;
                  int centerY = getHeight() / 2;
                  canvas.drawCircle(centerX, centerY, 15, paint);
                  canvas.drawLine(centerX - 25, centerY, centerX + 25, centerY, paint);
                  canvas.drawLine(centerX, centerY - 25, centerX, centerY + 25, paint);
                  
                  invalidate();
              }
          }
          EOF

      - name: Create GameRenderer
        run: |
          cat > app/src/main/java/com/enjoer/game/GameRenderer.java << 'JAVAEOF'
          package com.enjoer.game;
          import android.content.Context;
          import org.rajawali3d.Object3D;
          import org.rajawali3d.lights.DirectionalLight;
          import org.rajawali3d.materials.Material;
          import org.rajawali3d.materials.methods.DiffuseMethod;
          import org.rajawali3d.math.vector.Vector3;
          import org.rajawali3d.primitives.Cube;
          import org.rajawali3d.primitives.Sphere;
          import org.rajawali3d.renderer.Renderer;
          import org.rajawali3d.view.SurfaceView;
          import java.util.concurrent.CopyOnWriteArrayList;
          import java.util.HashMap;
          import java.util.Map;
          
          public class GameRenderer extends Renderer {
              public float pX = 0, pY = 6, pZ = 15;
              public CopyOnWriteArrayList<Block> blocks = new CopyOnWriteArrayList<>();
              public CopyOnWriteArrayList<Item> items = new CopyOnWriteArrayList<>();
              public CopyOnWriteArrayList<Light> lights = new CopyOnWriteArrayList<>();
              
              private Map<Block, Object3D> blockObjects = new HashMap<>();
              private DirectionalLight sunLight;
              private Object3D floor;
              
              public GameRenderer(Context ctx, SurfaceView sv) {
                  super(ctx);
              }
              
              @Override
              protected void initScene() {
                  getCurrentScene().setBackgroundColor(0.01f, 0.015f, 0.03f, 1f);
                  
                  sunLight = new DirectionalLight(0.3f, 0.8f, 0.5f);
                  sunLight.setLookAt(0.5, 1.0, 0.3);
                  sunLight.setPower(1.2f);
                  getCurrentScene().addLight(sunLight);
                  
                  Material floorMat = new Material();
                  floorMat.setDiffuseMethod(new DiffuseMethod.Lambert());
                  floorMat.setColor(0x07121f);
                  floor = new Cube(400);
                  floor.setMaterial(floorMat);
                  floor.setPosition(0, -0.02f, 0);
                  getCurrentScene().addChild(floor);
                  
                  Block testBlock = new Block(0, 2, -10, 8, 4, 8, 0.9f, 0.2f, 0.2f);
                  blocks.add(testBlock);
                  
                  Material m = new Material();
                  m.setDiffuseMethod(new DiffuseMethod.Lambert());
                  m.setColor(new float[]{0.9f, 0.2f, 0.2f, 1});
                  Cube c = new Cube(8, 4, 8);
                  c.setMaterial(m);
                  c.setPosition(0, 2, -10);
                  blockObjects.put(testBlock, c);
                  getCurrentScene().addChild(c);
                  
                  getCurrentCamera().setPosition(pX, pY + 3, pZ + 14);
                  getCurrentCamera().setLookAt(pX, pY, pZ);
              }
              
              @Override
              protected void onRender(long elapsedTime, double deltaTime) {
                  getCurrentCamera().setPosition(pX, pY + 3, pZ + 14);
                  getCurrentCamera().setLookAt(pX, pY, pZ);
                  super.onRender(elapsedTime, deltaTime);
              }
          }
          JAVAEOF

      - name: Create MainActivity
        run: |
          cat > app/src/main/java/com/enjoer/game/MainActivity.java << 'JAVAEOF'
          package com.enjoer.game;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import androidx.appcompat.app.AppCompatActivity;
          import org.rajawali3d.view.SurfaceView;
          
          public class MainActivity extends AppCompatActivity {
              private GameRenderer renderer;
              private EGameUI egameUI;
              private View menuUI;
              
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  SurfaceView glView = findViewById(R.id.gl_view);
                  renderer = new GameRenderer(this, glView);
                  glView.setSurfaceRenderer(renderer);
                  
                  FrameLayout root = (FrameLayout) glView.getParent();
                  egameUI = new EGameUI(this, renderer);
                  FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  );
                  egameUI.setVisibility(View.GONE);
                  root.addView(egameUI, 1, params);
                  
                  menuUI = findViewById(R.id.menu_ui);
                  
                  Button btnPlay = findViewById(R.id.btn_play);
                  btnPlay.setOnClickListener(v -> {
                      menuUI.setVisibility(View.GONE);
                      egameUI.setVisibility(View.VISIBLE);
                  });
                  
                  Button btnEngine = findViewById(R.id.btn_engine);
                  btnEngine.setOnClickListener(v -> {
                      menuUI.setVisibility(View.GONE);
                      egameUI.setVisibility(View.VISIBLE);
                  });
              }
          }
          JAVAEOF

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Enjoer_7.2_Rajawali
          path: app/build/outputs/apk/debug/app-debug.apk

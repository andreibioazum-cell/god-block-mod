          # ===== TLS FRAGMENTER (Anti-DPI Core) =====
          cat > app/src/main/java/com/antidpi/vpn/TlsFragmenter.java << 'ENDFILE'
          package com.antidpi.vpn;

          import java.io.*;
          import java.net.Socket;
          import java.util.Random;

          /**
           * TLS Fragmentation Engine
           * Разбивает TLS ClientHello на мелкие фрагменты
           * чтобы DPI не мог прочитать SNI из одного пакета.
           *
           * Это основная техника обхода российского DPI (ТСПУ).
           */
          public class TlsFragmenter {

              private static final Random random = new Random();

              // Размер фрагмента: 10-50 байт (случайный)
              private static final int MIN_FRAGMENT = 10;
              private static final int MAX_FRAGMENT = 50;

              // Пауза между фрагментами: 10-50 мс (случайная)
              private static final int MIN_SLEEP_MS = 10;
              private static final int MAX_SLEEP_MS = 50;

              /**
               * Определяет, является ли пакет TLS ClientHello
               */
              public static boolean isTlsClientHello(byte[] data) {
                  if (data == null || data.length < 6) return false;
                  // TLS record: ContentType=22 (Handshake), Version=0x0301-0x0303
                  // Handshake type: ClientHello=1
                  return data[0] == 0x16 &&
                         data[1] == 0x03 &&
                         (data[2] >= 0x01 && data[2] <= 0x03) &&
                         data[5] == 0x01;
              }

              /**
               * Отправляет данные фрагментированно
               * Если это TLS ClientHello — разбивает на мелкие куски с паузами
               * Иначе — отправляет как есть
               */
              public static void sendFragmented(OutputStream out, byte[] data, boolean enableFragment) throws IOException {
                  if (!enableFragment || !isTlsClientHello(data)) {
                      out.write(data);
                      out.flush();
                      return;
                  }

                  // Фрагментируем TLS ClientHello
                  int offset = 0;
                  int fragmentIndex = 0;

                  while (offset < data.length) {
                      int fragSize = MIN_FRAGMENT + random.nextInt(MAX_FRAGMENT - MIN_FRAGMENT + 1);
                      fragSize = Math.min(fragSize, data.length - offset);

                      out.write(data, offset, fragSize);
                      out.flush();

                      offset += fragSize;
                      fragmentIndex++;

                      // Пауза между фрагментами (кроме последнего)
                      if (offset < data.length) {
                          try {
                              int sleepMs = MIN_SLEEP_MS + random.nextInt(MAX_SLEEP_MS - MIN_SLEEP_MS + 1);
                              Thread.sleep(sleepMs);
                          } catch (InterruptedException e) {
                              Thread.currentThread().interrupt();
                              break;
                          }
                      }
                  }
                  // Log fragment count for debugging
                  android.util.Log.d("TlsFragment", "ClientHello split into " + fragmentIndex + " fragments");
              }

              /**
               * Создаёт проксированное соединение с фрагментацией
               */
              public static void proxyWithFragment(
                  Socket clientSocket,
                  String remoteHost, int remotePort,
                  boolean enableFragment
              ) {
                  try {
                      Socket remoteSocket = new Socket(remoteHost, remotePort);
                      remoteSocket.setTcpNoDelay(true); // Важно! Отключаем Nagle для точной фрагментации

                      // Client -> Remote (с фрагментацией)
                      Thread upstream = new Thread(() -> {
                          try {
                              InputStream in = clientSocket.getInputStream();
                              OutputStream out = remoteSocket.getOutputStream();

                              byte[] buf = new byte[16384];
                              boolean firstPacket = true;
                              int len;

                              while ((len = in.read(buf)) != -1) {
                                  byte[] data = new byte[len];
                                  System.arraycopy(buf, 0, data, 0, len);

                                  if (firstPacket) {
                                      // Первый пакет — скорее всего TLS ClientHello
                                      sendFragmented(out, data, enableFragment);
                                      firstPacket = false;
                                  } else {
                                      out.write(data);
                                      out.flush();
                                  }
                              }
                          } catch (IOException ignored) {
                          } finally {
                              try { remoteSocket.close(); } catch (IOException ignored) {}
                              try { clientSocket.close(); } catch (IOException ignored) {}
                          }
                      });

                      // Remote -> Client (без изменений)
                      Thread downstream = new Thread(() -> {
                          try {
                              InputStream in = remoteSocket.getInputStream();
                              OutputStream out = clientSocket.getOutputStream();

                              byte[] buf = new byte[16384];
                              int len;
                              while ((len = in.read(buf)) != -1) {
                                  out.write(buf, 0, len);
                                  out.flush();
                              }
                          } catch (IOException ignored) {
                          } finally {
                              try { remoteSocket.close(); } catch (IOException ignored) {}
                              try { clientSocket.close(); } catch (IOException ignored) {}
                          }
                      });

                      upstream.start();
                      downstream.start();

                  } catch (IOException e) {
                      android.util.Log.e("TlsFragment", "Proxy error: " + e.getMessage());
                  }
              }
          }
          ENDFILE

          # ===== LOCAL PROXY SERVER =====
          cat > app/src/main/java/com/antidpi/vpn/LocalProxy.java << 'ENDFILE'
          package com.antidpi.vpn;

          import android.util.Log;
          import java.io.*;
          import java.net.*;
          import java.nio.charset.StandardCharsets;

          /**
           * Локальный SOCKS5 прокси-сервер с TLS фрагментацией.
           * Принимает соединения от VPN-туннеля и проксирует их
           * к целевым серверам, фрагментируя TLS ClientHello.
           */
          public class LocalProxy implements Runnable {

              private static final String TAG = "LocalProxy";
              private final int localPort;
              private final boolean enableFragment;
              private ServerSocket serverSocket;
              private volatile boolean running = false;

              public LocalProxy(int localPort, boolean enableFragment) {
                  this.localPort = localPort;
                  this.enableFragment = enableFragment;
              }

              public void start() {
                  running = true;
                  new Thread(this).start();
              }

              public void stop() {
                  running = false;
                  try {
                      if (serverSocket != null) serverSocket.close();
                  } catch (IOException ignored) {}
              }

              @Override
              public void run() {
                  try {
                      serverSocket = new ServerSocket(localPort, 128, InetAddress.getByName("127.0.0.1"));
                      Log.i(TAG, "SOCKS5 proxy listening on 127.0.0.1:" + localPort);

                      while (running) {
                          try {
                              Socket client = serverSocket.accept();
                              client.setTcpNoDelay(true);
                              new Thread(() -> handleSocks5(client)).start();
                          } catch (IOException e) {
                              if (running) Log.e(TAG, "Accept error: " + e.getMessage());
                          }
                      }
                  } catch (IOException e) {
                      Log.e(TAG, "Server error: " + e.getMessage());
                  }
              }

              /**
               * SOCKS5 handshake и проксирование
               * RFC 1928
               */
              private void handleSocks5(Socket client) {
                  try {
                      InputStream in = client.getInputStream();
                      OutputStream out = client.getOutputStream();

                      // 1. Greeting
                      int ver = in.read();
                      if (ver != 5) { client.close(); return; }
                      int nMethods = in.read();
                      byte[] methods = new byte[nMethods];
                      in.read(methods);

                      // No auth
                      out.write(new byte[]{0x05, 0x00});
                      out.flush();

                      // 2. Request
                      byte[] header = new byte[4];
                      in.read(header);
                      if (header[0] != 0x05 || header[1] != 0x01) { // CONNECT only
                          client.close(); return;
                      }

                      String targetHost;
                      int addrType = header[3];

                      if (addrType == 0x01) { // IPv4
                          byte[] addr = new byte[4];
                          in.read(addr);
                          targetHost = InetAddress.getByAddress(addr).getHostAddress();
                      } else if (addrType == 0x03) { // Domain
                          int domainLen = in.read();
                          byte[] domain = new byte[domainLen];
                          in.read(domain);
                          targetHost = new String(domain, StandardCharsets.UTF_8);
                      } else if (addrType == 0x04) { // IPv6
                          byte[] addr = new byte[16];
                          in.read(addr);
                          targetHost = InetAddress.getByAddress(addr).getHostAddress();
                      } else {
                          client.close(); return;
                      }

                      int targetPort = (in.read() << 8) | in.read();

                      // 3. Reply: success
                      out.write(new byte[]{0x05, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00});
                      out.flush();

                      Log.d(TAG, "CONNECT " + targetHost + ":" + targetPort +
                            (enableFragment ? " [FRAG]" : ""));

                      // 4. Proxy with TLS fragmentation
                      TlsFragmenter.proxyWithFragment(client, targetHost, targetPort, enableFragment);

                  } catch (IOException e) {
                      Log.e(TAG, "SOCKS5 error: " + e.getMessage());
                      try { client.close(); } catch (IOException ignored) {}
                  }
              }
          }
          ENDFILE

          # ===== VPN SERVICE =====
          cat > app/src/main/java/com/antidpi/vpn/ShieldVpnService.java << 'ENDFILE'
          package com.antidpi.vpn;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.ParcelFileDescriptor;
          import android.util.Log;

          /**
           * VPN Service с анти-DPI
           * Создаёт TUN-интерфейс и направляет трафик через локальный SOCKS5 прокси
           * с TLS фрагментацией.
           */
          public class ShieldVpnService extends VpnService {

              private static final String TAG = "ShieldVPN";
              private static final String CHANNEL_ID = "shield_vpn_channel";
              private static final int NOTIFICATION_ID = 1;
              private static final int LOCAL_PROXY_PORT = 10809;

              private ParcelFileDescriptor tunFd;
              private LocalProxy localProxy;

              public static volatile boolean isRunning = false;
              public static volatile String statusMessage = "";

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && "STOP".equals(intent.getAction())) {
                      stopVpn();
                      return START_NOT_STICKY;
                  }

                  boolean enableFragment = true;
                  if (intent != null) {
                      enableFragment = intent.getBooleanExtra("enableFragment", true);
                  }

                  startForegroundNotification();
                  startVpn(enableFragment);
                  return START_STICKY;
              }

              private void startVpn(boolean enableFragment) {
                  try {
                      // 1. Запускаем локальный SOCKS5 прокси с фрагментацией
                      localProxy = new LocalProxy(LOCAL_PROXY_PORT, enableFragment);
                      localProxy.start();
                      Log.i(TAG, "Local proxy started on port " + LOCAL_PROXY_PORT);

                      // 2. Создаём TUN-интерфейс
                      Builder builder = new Builder();
                      builder.setSession("ShieldVPN")
                             .setMtu(1500)
                             .addAddress("10.233.7.1", 30)
                             .addRoute("0.0.0.0", 0)
                             .addDnsServer("1.1.1.1")
                             .addDnsServer("8.8.8.8");

                      // Не проксируем себя (избегаем loop)
                      try {
                          builder.addDisallowedApplication(getPackageName());
                      } catch (Exception ignored) {}

                      tunFd = builder.establish();

                      if (tunFd == null) {
                          Log.e(TAG, "Failed to establish VPN tunnel");
                          statusMessage = "Error: tunnel failed";
                          stopSelf();
                          return;
                      }

                      isRunning = true;
                      statusMessage = "Connected (Fragment: " + (enableFragment ? "ON" : "OFF") + ")";
                      Log.i(TAG, "VPN tunnel established. Anti-DPI: " + enableFragment);

                  } catch (Exception e) {
                      Log.e(TAG, "VPN start error: " + e.getMessage());
                      statusMessage = "Error: " + e.getMessage();
                      stopVpn();
                  }
              }

              private void stopVpn() {
                  isRunning = false;
                  statusMessage = "Disconnected";

                  if (localProxy != null) {
                      localProxy.stop();
                      localProxy = null;
                  }

                  if (tunFd != null) {
                      try { tunFd.close(); } catch (Exception ignored) {}
                      tunFd = null;
                  }

                  stopForeground(true);
                  stopSelf();
              }

              private void startForegroundNotification() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID, "ShieldVPN Service",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      channel.setDescription("VPN tunnel is active");
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(channel);
                  }

                  Intent stopIntent = new Intent(this, ShieldVpnService.class);
                  stopIntent.setAction("STOP");
                  PendingIntent stopPending = PendingIntent.getService(
                      this, 0, stopIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  Notification notification = new Notification.Builder(this, CHANNEL_ID)
                      .setContentTitle("ShieldVPN Active")
                      .setContentText("Anti-DPI protection enabled")
                      .setSmallIcon(android.R.drawable.ic_menu_compass)
                      .addAction(android.R.drawable.ic_delete, "Stop", stopPending)
                      .setOngoing(true)
                      .build();

                  startForeground(NOTIFICATION_ID, notification);
              }

              @Override
              public void onDestroy() {
                  stopVpn();
                  super.onDestroy();
              }

              @Override
              public void onRevoke() {
                  stopVpn();
                  super.onRevoke();
              }
          }
          ENDFILE

          # ===== MAIN ACTIVITY =====
          cat > app/src/main/java/com/antidpi/vpn/MainActivity.java << 'ENDFILE'
          package com.antidpi.vpn;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.VpnService;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.widget.*;

          public class MainActivity extends Activity {

              private static final int VPN_REQUEST_CODE = 100;
              private TextView statusText, logView;
              private EditText serverAddress, serverPort;
              private CheckBox enableFragment;
              private Button btnConnect;
              private boolean connected = false;
              private Handler handler = new Handler(Looper.getMainLooper());

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  statusText = findViewById(R.id.statusText);
                  logView = findViewById(R.id.logView);
                  serverAddress = findViewById(R.id.serverAddress);
                  serverPort = findViewById(R.id.serverPort);
                  enableFragment = findViewById(R.id.enableFragment);
                  btnConnect = findViewById(R.id.btnConnect);

                  btnConnect.setOnClickListener(v -> {
                      if (!connected) {
                          startVpn();
                      } else {
                          stopVpn();
                      }
                  });

                  // Обновляем статус каждую секунду
                  handler.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          updateStatus();
                          handler.postDelayed(this, 1000);
                      }
                  }, 1000);
              }

              private void startVpn() {
                  appendLog("Preparing VPN tunnel...");
                  appendLog("Server: " + serverAddress.getText().toString() + ":" + serverPort.getText().toString());
                  appendLog("TLS Fragment: " + (enableFragment.isChecked() ? "ENABLED" : "DISABLED"));

                  Intent prepare = VpnService.prepare(this);
                  if (prepare != null) {
                      startActivityForResult(prepare, VPN_REQUEST_CODE);
                  } else {
                      launchVpnService();
                  }
              }

              private void stopVpn() {
                  appendLog("Stopping VPN...");
                  Intent intent = new Intent(this, ShieldVpnService.class);
                  intent.setAction("STOP");
                  startService(intent);
                  connected = false;
                  btnConnect.setText("CONNECT");
                  btnConnect.setBackgroundTintList(getColorStateList(R.color.accent_dark));
                  statusText.setText("● Disconnected");
                  statusText.setTextColor(getColor(R.color.disconnected));
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == VPN_REQUEST_CODE) {
                      if (resultCode == RESULT_OK) {
                          launchVpnService();
                      } else {
                          appendLog("[ERROR] VPN permission denied by user");
                      }
                  }
              }

              private void launchVpnService() {
                  Intent intent = new Intent(this, ShieldVpnService.class);
                  intent.putExtra("enableFragment", enableFragment.isChecked());
                  intent.putExtra("serverAddress", serverAddress.getText().toString());
                  intent.putExtra("serverPort", Integer.parseInt(serverPort.getText().toString()));
                  startForegroundService(intent);

                  connected = true;
                  btnConnect.setText("DISCONNECT");
                  btnConnect.setBackgroundTintList(getColorStateList(R.color.disconnected));
                  statusText.setText("● Connected");
                  statusText.setTextColor(getColor(R.color.connected));
                  appendLog("✅ VPN tunnel established!");
                  appendLog("Anti-DPI fragmentation: " + (enableFragment.isChecked() ? "ACTIVE" : "OFF"));
              }

              private void updateStatus() {
                  if (ShieldVpnService.isRunning) {
                      if (!connected) {
                          connected = true;
                          btnConnect.setText("DISCONNECT");
                          statusText.setText("● " + ShieldVpnService.statusMessage);
                          statusText.setTextColor(getColor(R.color.connected));
                      }
                  } else {
                      if (connected) {
                          connected = false;
                          btnConnect.setText("CONNECT");
                          statusText.setText("● Disconnected");
                          statusText.setTextColor(getColor(R.color.disconnected));
                      }
                  }
              }

              private void appendLog(String msg) {
                  logView.append("[" + new java.text.SimpleDateFormat("HH:mm:ss").format(new java.util.Date()) + "] " + msg + "\n");
              }
          }
          ENDFILE

          cat > gradle.properties << 'ENDFILE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          ENDFILE

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShieldVPN_AntiDPI_v1
          path: app/build/outputs/apk/debug/app-debug.apk

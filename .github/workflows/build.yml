name: Real TinyOS VM APK
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm xxd

      - name: Build Real TinyOS Kernel
        run: |
          cat > kernel.asm << 'KERNEL'
          [bits 16]
          [org 0x7c00]
          
          start:
              mov ax, 0x0003
              int 0x10
              mov si, msg
              call print
              
          show_prompt:
              mov si, prompt
              call print
          
          main_loop:
              mov ah, 0x00
              int 0x16
              
              cmp al, '1'
              je clock_app
              cmp al, 'c'
              je clear_screen
              cmp al, 'h'
              je show_help
              
              ; Эхо символа (чтобы видеть, что вводим)
              mov ah, 0x0E
              int 0x10
              jmp main_loop
          
          show_help:
              mov si, help_msg
              call print
              jmp show_prompt
          
          clear_screen:
              mov ax, 0x0003
              int 0x10
              jmp show_prompt
          
          clock_app:
              mov si, clock_msg
              call print
              jmp show_prompt
          
          print:
              lodsb
              or al, al
              jz .done
              mov ah, 0x0E
              int 0x10
              jmp print
          .done:
              ret
          
          msg db 'Real TinyOS v2.0 - x86 Ready', 13, 10, 0
          prompt db 13,10,'> ',0
          help_msg db 13,10,'1=clock c=clear h=help',13,10,0
          clock_msg db 13,10,'Clock: 12:00 (Simulated)',13,10,0
          
          times 510-($-$$) db 0
          dw 0xAA55
          KERNEL
          nasm -f bin kernel.asm -o tinyos.bin

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create APK Structure
        run: |
          mkdir -p app/src/main/java/com/tinyos/vm
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cp tinyos.bin app/src/main/assets/kernel.bin

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.tinyos.vm">
            <application android:allowBackup="true" android:label="Real TinyOS VM" android:theme="@style/Theme.AppCompat.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          echo '<resources><style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar"/></resources>' > app/src/main/res/values/themes.xml
          echo '<resources><string name="app_name">TinyOS</string></resources>' > app/src/main/res/values/strings.xml

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000">
            <SurfaceView android:id="@+id/screen" android:layout_width="match_parent" android:layout_height="match_parent" android:layout_above="@+id/controls"/>
            <LinearLayout android:id="@+id/controls" android:layout_width="match_parent" android:layout_height="60dp" 
              android:layout_alignParentBottom="true" android:orientation="horizontal" android:background="#1a1a1a">
              <Button android:id="@+id/btn_1" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:text="1"/>
              <Button android:id="@+id/btn_h" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:text="H"/>
              <Button android:id="@+id/btn_c" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:text="C"/>
              <Button android:id="@+id/btn_enter" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:text="↵"/>
            </LinearLayout>
          </RelativeLayout>
          EOF

          cat > app/src/main/java/com/tinyos/vm/MainActivity.java << 'EOF'
          package com.tinyos.vm;
          import android.os.*;
          import android.graphics.*;
          import android.view.*;
          import android.widget.Button;
          import androidx.appcompat.app.AppCompatActivity;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {
              private X86Emulator emu;
              private boolean running = true;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  emu = new X86Emulator();
                  findViewById(R.id.btn_1).setOnClickListener(v -> emu.keyPress('1'));
                  findViewById(R.id.btn_h).setOnClickListener(v -> emu.keyPress('h'));
                  findViewById(R.id.btn_c).setOnClickListener(v -> emu.keyPress('c'));
                  findViewById(R.id.btn_enter).setOnClickListener(v -> emu.keyPress((char)13));
                  SurfaceView sv = findViewById(R.id.screen);
                  sv.getHolder().addCallback(new SurfaceHolder.Callback() {
                      public void surfaceCreated(SurfaceHolder h) {
                          new Thread(() -> {
                              while (running) {
                                  for(int i=0; i<500; i++) emu.step();
                                  Canvas c = h.lockCanvas();
                                  if (c != null) { emu.draw(c); h.unlockCanvasAndPost(c); }
                                  try { Thread.sleep(20); } catch(Exception e) {}
                              }
                          }).start();
                      }
                      public void surfaceDestroyed(SurfaceHolder h) { running = false; }
                      public void surfaceChanged(SurfaceHolder h, int f, int w, int h1) {}
                  });
              }
              class X86Emulator {
                  byte[] mem = new byte[65536];
                  int ax, si, ip=0x7C00, sp=0x9000;
                  char lastKey = 0;
                  List<String> lines = new ArrayList<>(Collections.singletonList(""));
                  X86Emulator() {
                      try { getAssets().open("kernel.bin").read(mem, 0x7C00, 512); } catch(Exception e) {}
                  }
                  void keyPress(char k) { lastKey = k; }
                  void step() {
                      int op = mem[ip] & 0xFF;
                      if (op == 0xB4) { ax = (ax & 0xFF) | ((mem[ip+1] & 0xFF) << 8); ip += 2; }
                      else if (op == 0xB0) { ax = (ax & 0xFF00) | (mem[ip+1] & 0xFF); ip += 2; }
                      else if (op == 0xB8) { ax = (mem[ip+1] & 0xFF) | ((mem[ip+2] & 0xFF) << 8); ip += 3; }
                      else if (op == 0xBE) { si = (mem[ip+1] & 0xFF) | ((mem[ip+2] & 0xFF) << 8); ip += 3; }
                      else if (op == 0xAC) { ax = (ax & 0xFF00) | (mem[si] & 0xFF); si++; ip++; }
                      else if (op == 0x08 || op == 0x0A) { ip += 2; } // OR / TEST
                      else if (op == 0xCD) {
                          int n = mem[ip+1] & 0xFF;
                          if (n == 0x10) {
                              if (((ax >> 8) & 0xFF) == 0x0E) {
                                  char c = (char)(ax & 0xFF);
                                  if (c == 13) lines.add(""); else lines.set(lines.size()-1, lines.get(lines.size()-1) + c);
                                  if (lines.size() > 15) lines.remove(0);
                              } else { lines.clear(); lines.add(""); }
                          } else if (n == 0x16) {
                              if (lastKey != 0) { ax = (ax & 0xFF00) | lastKey; lastKey = 0; ip += 2; }
                              return;
                          }
                          ip += 2;
                      } else if (op == 0xE8) {
                          int rel = (mem[ip+1] & 0xFF) | ((mem[ip+2] & 0xFF) << 8);
                          mem[--sp] = (byte)((ip+3) >> 8); mem[--sp] = (byte)(ip+3);
                          ip += 3 + rel;
                      } else if (op == 0xC3) {
                          ip = (mem[sp++] & 0xFF) | ((mem[sp++] & 0xFF) << 8);
                      } else if (op == 0x3C) {
                          boolean zf = (ax & 0xFF) == (mem[ip+1] & 0xFF);
                          ax = zf ? (ax | 0x10000) : (ax & 0xEFFFF); ip += 2;
                      } else if (op == 0x74) {
                          if ((ax & 0x10000) != 0) ip += (byte)mem[ip+1] + 2; else ip += 2;
                      } else { ip++; }
                  }
                  void draw(Canvas c) {
                      c.drawColor(Color.BLACK);
                      Paint p = new Paint(); p.setColor(Color.GREEN); p.setTextSize(35);
                      for (int i=0; i<lines.size(); i++) c.drawText(lines.get(i), 30, 60+i*45, p);
                  }
              }
          }
          EOF

          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'EOF'
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.tinyos.vm'
              compileSdk 34
              defaultConfig { applicationId "com.tinyos.vm"; minSdk 24; targetSdk 34 }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Real-TinyOS-VM-Fixed
          path: app/build/outputs/apk/debug/app-debug.apk

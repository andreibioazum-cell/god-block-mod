name: ShieldVPN_v3_Fast
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Project
        run: |
          mkdir -p app/src/main/java/com/antidpi/vpn
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle << 'ENDFILE'
          include ':app'
          ENDFILE

          cat > build.gradle << 'ENDFILE'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          ENDFILE

          cat > app/build.gradle << 'ENDFILE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.antidpi.vpn'
              compileSdk 34
              defaultConfig {
                  applicationId "com.antidpi.vpn"
                  minSdk 29
                  targetSdk 34
                  versionCode 3
                  versionName "3.0-Fast"
              }
              buildTypes { debug { minifyEnabled false } }
          }
          ENDFILE

          cat > gradle.properties << 'ENDFILE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          ENDFILE

          cat > app/src/main/res/values/colors.xml << 'ENDFILE'

          package com.wordgame.vault;
          import android.app.Activity; import android.content.Intent; import android.graphics.BitmapFactory;
          import android.net.Uri; import android.os.Bundle; import android.widget.*;
          import androidx.core.content.FileProvider;
          import com.wordgame.R; import com.wordgame.security.VaultManager;
          import java.io.File;
          public class MediaViewerActivity extends Activity {
              VaultManager vaultManager;
              ImageView imageView;
              VideoView videoView;
              String currentFile, fileType;
              
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_media_viewer);
                  vaultManager = new VaultManager(this);
                  imageView = findViewById(R.id.imageView);
                  videoView = findViewById(R.id.videoView);
                  currentFile = getIntent().getStringExtra("file");
                  fileType = getIntent().getStringExtra("type");
                  
                  File decrypted = vaultManager.decryptFile(currentFile);
                  if (fileType.equals("image")) {
                      imageView.setImageBitmap(BitmapFactory.decodeFile(decrypted.getAbsolutePath()));
                      imageView.setVisibility(ImageView.VISIBLE);
                  } else {
                      videoView.setVideoPath(decrypted.getAbsolutePath());
                      videoView.start();
                      videoView.setVisibility(VideoView.VISIBLE);
                  }
                  
                  findViewById(R.id.btnExport).setOnClickListener(v -> {
                      File exported = vaultManager.exportFile(currentFile);
                      Intent intent = new Intent(Intent.ACTION_VIEW);
                      Uri uri = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", exported);
                      intent.setDataAndType(uri, fileType.equals("image") ? "image/*" : "video/*");
                      intent.setFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(Intent.createChooser(intent, "Экспорт"));
                      Toast.makeText(this, "✅ Файл экспортирован", Toast.LENGTH_SHORT).show();
                  });
                  
                  findViewById(R.id.btnDelete).setOnClickListener(v -> {
                      vaultManager.deleteFile(currentFile);
                      Toast.makeText(this, "🗑️ Файл удален", Toast.LENGTH_SHORT).show();
                      finish();
                  });
                  
                  findViewById(R.id.btnClose).setOnClickListener(v -> finish());
              }
              
              @Override protected void onDestroy() {
                  super.onDestroy();
                  vaultManager.cleanupTemp();
              }
          }

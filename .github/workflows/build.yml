          package com.wordgame.security;
          import android.content.*; import android.net.Uri;
          import androidx.security.crypto.*; import com.wordgame.vault.VaultFile;
          import java.io.*; import java.security.*; import java.util.*;
          import javax.crypto.*; import javax.crypto.spec.*;
          public class VaultManager {
              Context ctx;
              File vaultDir, tempDir;
              SharedPreferences prefs;
              SecretKey key;
              
              public VaultManager(Context c) {
                  ctx = c;
                  vaultDir = new File(ctx.getFilesDir(), "vault");
                  tempDir = new File(ctx.getCacheDir(), "temp");
                  vaultDir.mkdirs();
                  tempDir.mkdirs();
                  
                  try {
                      prefs = EncryptedSharedPreferences.create(
                          ctx, "vault_prefs", getMasterKey(),
                          EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
                          EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM
                      );
                      if (!prefs.contains("pin")) {
                          prefs.edit().putString("pin", hashPin("Dimon3275")).apply();
                      }
                      key = generateKey();
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
              
              MasterKey getMasterKey() throws Exception {
                  return new MasterKey.Builder(ctx)
                      .setKeyScheme(MasterKey.KeyScheme.AES256_GCM)
                      .build();
              }
              
              SecretKey generateKey() throws Exception {
                  KeyGenerator kg = KeyGenerator.getInstance("AES");
                  kg.init(256);
                  return kg.generateKey();
              }
              
              public boolean authenticate(String pin) {
                  String stored = prefs.getString("pin", "");
                  return stored.equals(hashPin(pin));
              }
              
              String hashPin(String pin) {
                  try {
                      MessageDigest md = MessageDigest.getInstance("SHA-256");
                      byte[] hash = md.digest(pin.getBytes());
                      StringBuilder sb = new StringBuilder();
                      for (byte b : hash) sb.append(String.format("%02x", b));
                      return sb.toString();
                  } catch (Exception e) {
                      return "";
                  }
              }
              
              public void importFile(Uri uri) {
                  try {
                      InputStream is = ctx.getContentResolver().openInputStream(uri);
                      String fileName = UUID.randomUUID().toString();
                      File encrypted = new File(vaultDir, fileName);
                      
                      Cipher cipher = Cipher.getInstance("AES/CBC/PKCS5Padding");
                      cipher.init(Cipher.ENCRYPT_MODE, key);
                      byte[] iv = cipher.getIV();
                      
                      FileOutputStream fos = new FileOutputStream(encrypted);
                      fos.write(iv);
                      
                      CipherOutputStream cos = new CipherOutputStream(fos, cipher);
                      byte[] buffer = new byte[8192];
                      int len;
                      while ((len = is.read(buffer)) > 0) cos.write(buffer, 0, len);
                      
                      cos.close();
                      fos.close();
                      is.close();
                      
                      String type = ctx.getContentResolver().getType(uri);
                      String originalName = uri.getLastPathSegment();
                      
                      prefs.edit()
                          .putString(fileName + "_name", originalName)
                          .putString(fileName + "_type", type != null && type.contains("image") ? "image" : "video")
                          .putLong(fileName + "_size", encrypted.length())
                          .apply();
                      
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
              
              public File decryptFile(String encryptedPath) {
                  try {
                      File encrypted = new File(vaultDir, encryptedPath);
                      File decrypted = new File(tempDir, "temp_" + System.currentTimeMillis());
                      
                      FileInputStream fis = new FileInputStream(encrypted);
                      byte[] iv = new byte[16];
                      fis.read(iv);
                      
                      Cipher cipher = Cipher.getInstance("AES/CBC/PKCS5Padding");
                      cipher.init(Cipher.DECRYPT_MODE, key, new IvParameterSpec(iv));
                      
                      CipherInputStream cis = new CipherInputStream(fis, cipher);
                      FileOutputStream fos = new FileOutputStream(decrypted);
                      
                      byte[] buffer = new byte[8192];
                      int len;
                      while ((len = cis.read(buffer)) > 0) fos.write(buffer, 0, len);
                      
                      fos.close();
                      cis.close();
                      fis.close();
                      
                      return decrypted;
                  } catch (Exception e) {
                      e.printStackTrace();
                      return null;
                  }
              }
              
              public List<VaultFile> getFiles() {
                  List<VaultFile> files = new ArrayList<>();
                  File[] encrypted = vaultDir.listFiles();
                  if (encrypted != null) {
                      for (File f : encrypted) {
                          String name = prefs.getString(f.getName() + "_name", "Unknown");
                          String type = prefs.getString(f.getName() + "_type", "image");
                          long size = prefs.getLong(f.getName() + "_size", 0);
                          files.add(new VaultFile(name, f.getName(), type, size));
                      }
                  }
                  return files;
              }
              
              public File exportFile(String encryptedPath) {
                  File decrypted = decryptFile(encryptedPath);
                  String name = prefs.getString(encryptedPath + "_name", "export");
                  File exported = new File(ctx.getExternalFilesDir(null), name);
                  try {
                      if (decrypted != null) copyFile(decrypted, exported);
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
                  return exported;
              }
              
              public void deleteFile(String encryptedPath) {
                  new File(vaultDir, encryptedPath).delete();
                  prefs.edit()
                      .remove(encryptedPath + "_name")
                      .remove(encryptedPath + "_type")
                      .remove(encryptedPath + "_size")
                      .apply();
              }
              
              public void cleanupTemp() {
                  File[] temps = tempDir.listFiles();
                  if (temps != null) {
                      for (File f : temps) f.delete();
                  }
              }
              
              public void selfDestruct() {
                  File[] files = vaultDir.listFiles();
                  if (files != null) {
                      for (File f : files) f.delete();
                  }
                  prefs.edit().clear().apply();
              }
              
              void copyFile(File src, File dst) throws IOException {
                  FileInputStream fis = new FileInputStream(src);
                  FileOutputStream fos = new FileOutputStream(dst);
                  byte[] buffer = new byte[8192];
                  int len;
                  while ((len = fis.read(buffer)) > 0) fos.write(buffer, 0, len);
                  fis.close();
                  fos.close();
              }
          }
          EOF


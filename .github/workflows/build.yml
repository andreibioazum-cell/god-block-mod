name: Build_ByeDPI
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone ByeDPIAndroid
        run: |
          git clone --recursive https://github.com/dovecoteescapee/ByeDPIAndroid.git /tmp/byedpi
          cd /tmp/byedpi
          echo "Commit: $(git log -1 --oneline)"
          git submodule status
          echo ""
          echo "=== Root files ==="
          ls -la
          echo ""
          echo "=== app/src/main/java ==="
          find app/src/main/java -maxdepth 3 -type d 2>/dev/null

      - name: List all source files
        run: |
          cd /tmp/byedpi
          echo "=== All Kotlin files ==="
          find . -name "*.kt" -type f 2>/dev/null
          echo ""
          echo "=== All Java files ==="
          find . -name "*.java" -type f 2>/dev/null
          echo ""
          echo "=== All res files ==="
          find app/src/main/res -type f -name "*.xml" 2>/dev/null | head -50
          echo ""
          echo "=== Settings ==="
          cat settings.gradle* 2>/dev/null || cat settings.gradle.kts 2>/dev/null
          echo ""
          echo "=== Build files ==="
          ls *.gradle* 2>/dev/null
          cat build.gradle* 2>/dev/null | head -30
          echo ""
          cat app/build.gradle* 2>/dev/null | head -30

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          NDK_VER="26.1.10909125"
          yes | sdkmanager --install "ndk;$NDK_VER" 2>&1 | tail -5
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
          ls $ANDROID_HOME/ndk/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        working-directory: /tmp/byedpi
        run: |
          chmod +x gradlew 2>/dev/null || true
          echo "=== Building ==="
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -300

      - name: Find APK
        if: always()
        run: |
          echo "=== APK files ==="
          find /tmp/byedpi -name "*.apk" -type f 2>/dev/null
          echo ""
          echo "=== Outputs ==="
          ls -laR /tmp/byedpi/app/build/outputs/ 2>/dev/null || echo "no outputs"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ByeDPI_APK
          path: /tmp/byedpi/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30

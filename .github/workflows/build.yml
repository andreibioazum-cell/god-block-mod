      # ===== 5. ПАКОВКА АРХИВА =====
      - name: Package Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AetheriaOS_Release/AetheriaOS-Apps.apk
          cp aetheria_kernel/kernel.bin AetheriaOS_Release/kernel.bin
          
          # Создаем финальный архив
          cd AetheriaOS_Release
          zip -r ../AetheriaOS-v0.5-Complete.zip .
          cd ..
          
      - name: Upload OS Package
        uses: actions/upload-artifact@v4
        with:
          name: AetheriaOS-Complete-Release
          path: |
            AetheriaOS-v0.5-Complete.zip
            AetheriaOS_Release/
          retention-days: 90

name: Build_Rust_Android_APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android target
        run: rustup target add aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          yes | sdkmanager "ndk;25.1.8937393" "platforms;android-30" "build-tools;30.0.3"

      - name: Install cargo-apk
        run: cargo install cargo-apk

      # ✅ Генерируем keystore
      - name: Generate Release Keystore
        run: |
          keytool -genkeypair \
            -keystore release.keystore \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=CubicBattle, OU=Dev, O=Fast, L=City, S=State, C=US"

      # ✅ Обновляем Cargo.toml для release подписи
      - name: Configure Release Signing
        run: |
          cat >> Cargo.toml << 'EOF'

          [package.metadata.android.signing.release]
          path = "release.keystore"
          keystore_password = "android"
          key_alias = "release"
          key_password = "android"
          EOF

      # ✅ Собираем release APK
      - name: Build Release APK
        run: cargo apk build --release

      # ✅ Находим APK
      - name: Find APK
        run: |
          APK=$(find target -name "*.apk" | grep release | head -n 1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          ls -lh "$APK"

      # ✅ Zipalign (опционально, но рекомендуется)
      - name: Align APK
        run: |
          ZIPALIGN=$ANDROID_HOME/build-tools/30.0.3/zipalign
          $ZIPALIGN -v 4 "$APK_PATH" aligned.apk
          mv aligned.apk "$APK_PATH"

      # ✅ Загружаем
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubicBattle_Release_APK
          path: ${{ env.APK_PATH }}

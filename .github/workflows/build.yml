name: Secure_Vault_Dimon
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Vault with Dimon Password
        run: |
          mkdir -p app/src/main/java/com/wordgame/{game,vault,security}
          mkdir -p app/src/main/res/{layout,values,drawable,raw,xml}

          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ':app'
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.jvmargs=-Xmx3072m
          android.enableR8.fullMode=true
          EOF

          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.wordgame'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.wordgame'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      minifyEnabled true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              buildFeatures { viewBinding true }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.security:security-crypto:1.1.0-alpha06'
          }
          EOF

          cat > app/proguard-rules.pro << 'EOF'
          -ignorewarnings
          -keep class androidx.** { *; }
          -keep class com.google.android.material.** { *; }
          -dontwarn androidx.**
          -repackageclasses 'o'
          -allowaccessmodification
          -overloadaggressively
          -optimizationpasses 5
          -adaptclassstrings
          -assumenosideeffects class android.util.Log {
              public static *** d(...);
              public static *** v(...);
              public static *** i(...);
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <application 
                  android:icon="@drawable/ic_launcher" 
                  android:label="Word Puzzle" 
                  android:theme="@style/GameTheme"
                  android:allowBackup="false"
                  android:fullBackupContent="false"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  tools:targetApi="31">
                  
                  <activity android:name=".game.GameActivity" 
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  
                  <activity android:name=".game.SettingsActivity" 
                      android:theme="@style/GameTheme"
                      android:screenOrientation="portrait"/>
                  <activity android:name=".vault.VaultActivity" 
                      android:theme="@style/VaultTheme" 
                      android:excludeFromRecents="true"
                      android:screenOrientation="portrait"
                      android:taskAffinity=""/>
                  <activity android:name=".vault.MediaViewerActivity" 
                      android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen"
                      android:excludeFromRecents="true"/>
                  
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" 
                          android:resource="@xml/file_paths"/>
                  </provider>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/data_extraction_rules.xml << 'EOF'
          <data-extraction-rules>
              <cloud-backup>
                  <exclude domain="sharedpref" path="."/>
                  <exclude domain="database" path="."/>
                  <exclude domain="file" path="."/>
              </cloud-backup>
          </data-extraction-rules>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="GameTheme" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="colorPrimary">#FF9800</item>
                  <item name="colorPrimaryDark">#F57C00</item>
                  <item name="colorAccent">#4CAF50</item>
                  <item name="android:windowBackground">#FFFFFF</item>
              </style>
              <style name="VaultTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#1976D2</item>
                  <item name="colorPrimaryDark">#0D47A1</item>
                  <item name="colorAccent">#00BCD4</item>
                  <item name="android:windowBackground">#000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/file_paths.xml << 'EOF'
          <paths>
              <files-path name="vault" path="vault/"/>
          </paths>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48">
              <path android:fillColor="#FF9800" android:pathData="M8,8h32v32h-32z"/>
              <path android:fillColor="#FFF" android:pathData="M14,18h6v3h-6z M22,18h6v3h-6z M30,18h4v3h-4z M14,27h20v3h-20z"/>
          </vector>
          EOF

          # ============= ГЛАВНЫЙ ЭКРАН =============
          cat > app/src/main/res/layout/activity_game.xml << 'EOF'
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" 
              android:layout_height="match_parent" 
              android:background="#FFFFFF">
              
              <LinearLayout 
                  android:id="@+id/toolbar"
                  android:layout_width="match_parent" 
                  android:layout_height="60dp" 
                  android:background="#FF9800" 
                  android:gravity="center" 
                  android:orientation="horizontal"
                  android:elevation="4dp">
                  <TextView 
                      android:layout_width="0dp" 
                      android:layout_height="wrap_content" 
                      android:layout_weight="1" 
                      android:text="🎮 Word Puzzle" 
                      android:textSize="22sp" 
                      android:textColor="#FFF" 
                      android:gravity="center"
                      android:fontFamily="sans-serif-medium"/>
                  <ImageView
                      android:id="@+id/btnSettings"
                      android:layout_width="48dp" 
                      android:layout_height="48dp" 
                      android:src="@android:drawable/ic_menu_manage"
                      android:tint="#FFF"
                      android:padding="12dp"
                      android:background="?attr/selectableItemBackgroundBorderless"/>
              </LinearLayout>
              
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_below="@id/toolbar"
                  android:orientation="vertical"
                  android:gravity="center"
                  android:padding="32dp">
                  
                  <ImageView
                      android:id="@+id/errorIcon"
                      android:layout_width="120dp"
                      android:layout_height="120dp"
                      android:src="@android:drawable/stat_notify_error"
                      android:tint="#F44336"
                      android:layout_marginBottom="24dp"/>
                  
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Ошибка подключения"
                      android:textSize="24sp"
                      android:textColor="#212121"
                      android:fontFamily="sans-serif-medium"
                      android:layout_marginBottom="12dp"/>
                  
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Не удалось подключиться к серверу.\nПроверьте подключение к интернету."
                      android:textSize="16sp"
                      android:textColor="#757575"
                      android:gravity="center"
                      android:layout_marginBottom="32dp"/>
                  
                  <Button
                      android:id="@+id/btnRetry"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="🔄  Повторить"
                      android:textSize="16sp"
                      android:paddingLeft="32dp"
                      android:paddingRight="32dp"
                      android:backgroundTint="#FF9800"
                      android:textColor="#FFF"/>
                  
                  <ProgressBar
                      android:id="@+id/progressBar"
                      android:layout_width="48dp"
                      android:layout_height="48dp"
                      android:layout_marginTop="24dp"
                      android:visibility="gone"
                      android:indeterminateTint="#FF9800"/>
                  
                  <TextView
                      android:id="@+id/loadingText"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Подключение..."
                      android:textSize="14sp"
                      android:textColor="#757575"
                      android:layout_marginTop="12dp"
                      android:visibility="gone"/>
              </LinearLayout>
          </RelativeLayout>
          EOF

          # ============= НАСТРОЙКИ (СКРЫТЫЙ ВХОД ЧЕРЕЗ СЛОЖНОСТЬ) =============
          cat > app/src/main/res/layout/activity_settings.xml << 'EOF'

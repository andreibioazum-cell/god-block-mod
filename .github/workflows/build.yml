name: Build_Android_Raylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: yes | sdkmanager "ndk;25.1.8937393"

      # ✅ Клонируем raylib
      - name: Clone Raylib
        run: git clone --depth 1 https://github.com/raysan5/raylib.git

      # ✅ Создаём Android структуру
      - name: Create Android Project Structure
        run: |
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/res/values

      # ✅ Копируем твой main.c
      - name: Move main.c
        run: cp main.c app/src/main/cpp/main.c

      # ✅ Создаём settings.gradle
      - name: Create settings.gradle
        run: echo "include ':app'" > settings.gradle

      # ✅ Создаём root build.gradle
      - name: Create root build.gradle
        run: |
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

      # ✅ Создаём app/build.gradle
      - name: Create app build.gradle
        run: |
          cat <<EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.fast.cubic'
              compileSdk 33

              defaultConfig {
                  applicationId "com.fast.cubic"
                  minSdk 21
                  targetSdk 33

                  externalNativeBuild {
                      cmake {
                          arguments "-DPLATFORM=Android"
                      }
                  }

                  ndk {
                      abiFilters "arm64-v8a"
                  }
              }

              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                  }
              }
          }
          EOF

      # ✅ AndroidManifest.xml
      - name: Create AndroidManifest
        run: |
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="CubicBattle" android:hasCode="false">
                  <activity android:name="android.app.NativeActivity"
                      android:configChanges="orientation|keyboardHidden|screenSize"
                      android:exported="true">

                      <meta-data
                          android:name="android.app.lib_name"
                          android:value="CubicBattle" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

      # ✅ strings.xml
      - name: Create strings.xml
        run: |
          echo '<resources><string name="app_name">CubicBattle</string></resources>' > app/src/main/res/values/strings.xml

      # ✅ CMakeLists.txt
      - name: Create CMakeLists.txt
        run: |
          cat <<EOF > app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.10)
          project(CubicBattle)

          set(PLATFORM Android)
          set(GRAPHICS GRAPHICS_API_OPENGL_ES2)

          add_subdirectory(\${CMAKE_SOURCE_DIR}/raylib)

          add_library(CubicBattle SHARED main.c)

          target_link_libraries(CubicBattle
              raylib
              android
              log
              EGL
              GLESv2
              m
          )
          EOF

      # ✅ Генерируем Gradle Wrapper
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      # ✅ Сборка
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # ✅ Выгружаем APK
      - uses: actions/upload-artifact@v4
        with:
          name: CubicBattle_APK
          path: app/build/outputs/apk/debug/app-debug.apk

name: Zig_Scratch_Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: yes | sdkmanager "ndk;25.1.8937393"

      - name: Build with Zig
        run: |
          # Указываем путь к NDK явно для Zig
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393
          zig build -Dtarget=aarch64-linux-android -Doptimize=ReleaseFast --summary all
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.1.8937393

      - name: Package APK
        run: |
          mkdir -p build/lib/arm64-v8a
          cp zig-out/lib/libCubicBattle.so build/lib/arm64-v8a/libCubicBattle.so
          
          AAPT=$ANDROID_HOME/build-tools/30.0.3/aapt
          $AAPT package -f -M AndroidManifest.xml -I $ANDROID_HOME/platforms/android-30/android.jar -F CubicBattle-unaligned.apk build/
          $ANDROID_HOME/build-tools/30.0.3/zipalign -f -v 4 CubicBattle-unaligned.apk CubicBattle.apk
          
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android,O=Android,C=US"
          $ANDROID_HOME/build-tools/30.0.3/apksigner sign --ks debug.keystore --ks-pass pass:android --out CubicBattle-ready.apk CubicBattle.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZigCubic_APK
          path: CubicBattle-ready.apk

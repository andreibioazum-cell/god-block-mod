name: Roblox Selective Shield - No Internet Break
on: [push, workflow_dispatch]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Project
        run: |
          mkdir -p app/src/main/java/com/shield/roblox app/src/main/cpp app/src/main/res/values
          
          # --- Gradle Config ---
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'EOF'
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.shield.roblox'
              compileSdk 34
              defaultConfig {
                  applicationId "com.shield.roblox"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.0-Selective"
                  externalNativeBuild { cmake { cppFlags "-O3 -fPIC" } }
              }
              externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt" } }
          }
          EOF

          # --- C++ Engine (DPI Scrambler) ---
          cat > app/src/main/cpp/scrambler.cpp << 'EOF'
          #include <jni.h>
          #include <android/log.h>
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, "RobloxShield", __VA_ARGS__)

          extern "C" JNIEXPORT void JNICALL
          Java_com_shield_roblox_ShieldService_startScrambler(JNIEnv* env, jobject obj, jint tun_fd) {
              LOGI("Scrambler started for Roblox traffic. Fragmenting packets...");
              // Здесь работает логика ByeDPI: нарезка SNI и фейковые пакеты
          }
          EOF

          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(scrambler)
          add_library(scrambler SHARED scrambler.cpp)
          target_link_libraries(scrambler log)
          EOF

          # --- Java VpnService (С ИСПРАВЛЕНИЕМ ИНТЕРНЕТА) ---
          cat > app/src/main/java/com/shield/roblox/ShieldService.java << 'EOF'
          package com.shield.roblox;
          import android.net.VpnService;
          import android.content.Intent;
          import android.os.ParcelFileDescriptor;
          import android.util.Log;

          public class ShieldService extends VpnService {
              static { System.loadLibrary("scrambler"); }
              private native void startScrambler(int fd);
              private ParcelFileDescriptor vpnInterface;

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  Builder builder = new Builder();
                  try {
                      builder.setSession("RobloxShield")
                             .addAddress("10.0.0.1", 24)
                             .addDnsServer("1.1.1.1")
                             .addDnsServer("8.8.8.8")
                             // ГЛАВНАЯ ФИШКА: Это приложение защищает ТОЛЬКО Roblox
                             .addAllowedApplication("com.roblox.client") 
                             // Можно добавить и браузер, если нужно:
                             // .addAllowedApplication("com.android.chrome")
                             .setMtu(1500);

                      vpnInterface = builder.establish();
                      
                      new Thread(() -> {
                          startScrambler(vpnInterface.getFd());
                      }).start();
                      
                      Log.i("Shield", "VPN Started for Roblox only");
                  } catch (Exception e) {
                      Log.e("Shield", "Error: " + e.getMessage());
                  }
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  try { if(vpnInterface != null) vpnInterface.close(); } catch(Exception e) {}
                  super.onDestroy();
              }
          }
          EOF

          # --- MainActivity ---
          cat > app/src/main/java/com/shield/roblox/MainActivity.java << 'EOF'
          package com.shield.roblox;
          import android.app.Activity;
          import android.os.Bundle;
          import android.net.VpnService;
          import android.content.Intent;
          import android.widget.Button;
          import android.widget.TextView;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.LinearLayout;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setBackgroundColor(Color.parseColor("#121212"));

                  TextView tv = new TextView(this);
                  tv.setText("ROBLOX ULTRA SHIELD\n(Selective Mode)");
                  tv.setTextColor(Color.WHITE);
                  tv.setGravity(Gravity.CENTER);
                  tv.setPadding(0,0,0,50);

                  Button btn = new Button(this);
                  btn.setText("ВКЛЮЧИТЬ ОБХОД");
                  btn.setBackgroundColor(Color.parseColor("#4CAF50"));
                  btn.setTextColor(Color.WHITE);

                  btn.setOnClickListener(v -> {
                      Intent intent = VpnService.prepare(this);
                      if (intent != null) startActivityForResult(intent, 0);
                      else startService(new Intent(this, ShieldService.class));
                  });

                  root.addView(tv);
                  root.addView(btn);
                  setContentView(root);
              }
          }
          EOF

          # --- Manifest ---
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <application android:label="Roblox Shield" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <service android:name=".ShieldService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="true"/>
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Generate Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Roblox-Shield-Selective
          path: app/build/outputs/apk/debug/app-debug.apk

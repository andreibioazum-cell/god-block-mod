name: Secure_Vault_Dimon
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Vault with Dimon Password
        run: |
          mkdir -p app/src/main/java/com/wordgame/{game,vault,security}
          mkdir -p app/src/main/res/{layout,values,drawable,raw,xml}

          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ':app'
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.jvmargs=-Xmx3072m
          android.enableR8.fullMode=true
          EOF

          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.wordgame'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.wordgame'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      minifyEnabled false
                  }
              }
              buildFeatures { viewBinding true }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.security:security-crypto:1.1.0-alpha06'
              implementation 'androidx.cardview:cardview:1.0.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <application 
                  android:icon="@drawable/ic_launcher" 
                  android:label="Word Puzzle" 
                  android:theme="@style/GameTheme"
                  android:allowBackup="false"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  tools:targetApi="31">
                  
                  <activity android:name=".game.GameActivity" 
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  
                  <activity android:name=".game.SettingsActivity" 
                      android:screenOrientation="portrait"/>
                  <activity android:name=".vault.VaultActivity" 
                      android:theme="@style/VaultTheme" 
                      android:excludeFromRecents="true"
                      android:screenOrientation="portrait"/>
                  <activity android:name=".vault.MediaViewerActivity" 
                      android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen"
                      android:excludeFromRecents="true"/>
                  
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" 
                          android:resource="@xml/file_paths"/>
                  </provider>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="GameTheme" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="colorPrimary">#FF9800</item>
                  <item name="colorPrimaryDark">#F57C00</item>
                  <item name="colorAccent">#4CAF50</item>
                  <item name="android:windowBackground">#FFFFFF</item>
              </style>
              <style name="VaultTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#1976D2</item>
                  <item name="colorPrimaryDark">#0D47A1</item>
                  <item name="colorAccent">#00BCD4</item>
                  <item name="android:windowBackground">#000000</item>
              </style>
          </resources>
          EOF

          # Исправленный GameActivity (наследуем AppCompatActivity)
          cat > app/src/main/java/com/wordgame/game/GameActivity.java << 'EOF'
          package com.wordgame.game;
          import android.content.Intent; import android.os.Bundle;
          import android.os.Handler; import android.view.View; import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import com.wordgame.R;
          public class GameActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_game);
                  
                  findViewById(R.id.btnSettings).setOnClickListener(v -> 
                      startActivity(new Intent(this, SettingsActivity.class)));
                  
                  findViewById(R.id.btnRetry).setOnClickListener(v -> {
                      findViewById(R.id.btnRetry).setVisibility(View.GONE);
                      findViewById(R.id.progressBar).setVisibility(View.VISIBLE);
                      new Handler().postDelayed(() -> {
                          findViewById(R.id.progressBar).setVisibility(View.GONE);
                          findViewById(R.id.btnRetry).setVisibility(View.VISIBLE);
                          Toast.makeText(this, "Ошибка сети", Toast.LENGTH_SHORT).show();
                      }, 2000);
                  });
              }
          }
          EOF

          # Исправленный SettingsActivity (наследуем AppCompatActivity)
          cat > app/src/main/java/com/wordgame/game/SettingsActivity.java << 'EOF'
          package com.wordgame.game;
          import android.content.Intent; import android.os.Bundle;
          import android.widget.*; import androidx.appcompat.app.AppCompatActivity;
          import com.wordgame.R; import com.wordgame.vault.VaultActivity;
          public class SettingsActivity extends AppCompatActivity {
              int secretTaps = 0;
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_settings);
                  findViewById(R.id.btnBack).setOnClickListener(v -> finish());
                  
                  SeekBar difficultyBar = findViewById(R.id.difficultyBar);
                  difficultyBar.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar sb, int p, boolean f) {
                          if (p == 100) {
                              secretTaps++;
                              if (secretTaps >= 3) {
                                  startActivity(new Intent(SettingsActivity.this, VaultActivity.class));
                                  finish();
                              }
                          }
                      }
                      @Override public void onStartTrackingTouch(SeekBar sb) {}
                      @Override public void onStopTrackingTouch(SeekBar sb) {}
                  });
              }
          }
          EOF

          # Исправленный VaultActivity
          cat > app/src/main/java/com/wordgame/vault/VaultActivity.java << 'EOF'
          package com.wordgame.vault;
          import android.Manifest; import android.content.*; import android.os.Bundle;
          import android.provider.MediaStore; import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat; import androidx.recyclerview.widget.*;
          import com.wordgame.R; import com.wordgame.security.VaultManager;
          import java.util.List;
          public class VaultActivity extends AppCompatActivity {
              VaultManager vaultManager;
              EditText passwordInput;
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_vault);
                  vaultManager = new VaultManager(this);
                  passwordInput = findViewById(R.id.passwordInput);
                  
                  findViewById(R.id.btnUnlock).setOnClickListener(v -> {
                      if (vaultManager.authenticate(passwordInput.getText().toString())) {
                          findViewById(R.id.authLayout).setVisibility(android.view.View.GONE);
                          findViewById(R.id.vaultLayout).setVisibility(android.view.View.VISIBLE);
                          loadMedia();
                      } else {
                          Toast.makeText(this, "Неверно", Toast.LENGTH_SHORT).show();
                      }
                  });
                  
                  findViewById(R.id.btnAdd).setOnClickListener(v -> {
                      Intent intent = new Intent(Intent.ACTION_PICK);
                      intent.setType("image/*");
                      startActivityForResult(intent, 100);
                  });
              }
              void loadMedia() {
                  RecyclerView rv = findViewById(R.id.recyclerMedia);
                  rv.setLayoutManager(new GridLayoutManager(this, 2));
                  List<VaultFile> files = vaultManager.getFiles();
                  rv.setAdapter(new MediaAdapter(files, file -> {
                      Intent i = new Intent(this, MediaViewerActivity.class);
                      i.putExtra("file", file.encryptedPath);
                      i.putExtra("type", file.type);
                      startActivity(i);
                  }));
              }
              @Override protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (res == RESULT_OK && data != null && data.getData() != null) {
                      vaultManager.importFile(data.getData());
                      loadMedia();
                  }
              }
          }
          EOF

          # Исправленный VaultManager (хранение ключа)
          cat > app/src/main/java/com/wordgame/security/VaultManager.java << 'EOF'
          package com.wordgame.security;
          import android.content.*; import android.net.Uri; import android.util.Base64;
          import androidx.security.crypto.*; import com.wordgame.vault.VaultFile;
          import java.io.*; import java.security.MessageDigest; import java.util.*;
          import javax.crypto.*; import javax.crypto.spec.*;
          public class VaultManager {
              Context ctx; SharedPreferences prefs; SecretKey key;
              public VaultManager(Context c) {
                  ctx = c;
                  try {
                      MasterKey mk = new MasterKey.Builder(ctx).setKeyScheme(MasterKey.KeyScheme.AES256_GCM).build();
                      prefs = EncryptedSharedPreferences.create(ctx, "v_prefs", mk, 
                          EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
                          EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM);
                      
                      if (!prefs.contains("pin")) prefs.edit().putString("pin", hash("Dimon3275")).apply();
                      
                      if (!prefs.contains("aes_key")) {
                          KeyGenerator kg = KeyGenerator.getInstance("AES"); kg.init(256);
                          prefs.edit().putString("aes_key", Base64.encodeToString(kg.generateKey().getEncoded(), 0)).apply();
                      }
                      byte[] encoded = Base64.decode(prefs.getString("aes_key", ""), 0);
                      key = new SecretKeySpec(encoded, 0, encoded.length, "AES");
                  } catch (Exception e) {}
              }
              public boolean authenticate(String p) { return hash(p).equals(prefs.getString("pin", "")); }
              private String hash(String p) {
                  try {
                      MessageDigest md = MessageDigest.getInstance("SHA-256");
                      byte[] h = md.digest(p.getBytes());
                      StringBuilder sb = new StringBuilder();
                      for (byte b : h) sb.append(String.format("%02x", b));
                      return sb.toString();
                  } catch (Exception e) { return ""; }
              }
              public void importFile(Uri uri) {
                  try {
                      InputStream is = ctx.getContentResolver().openInputStream(uri);
                      String id = UUID.randomUUID().toString();
                      File out = new File(ctx.getFilesDir(), "vault/" + id);
                      out.getParentFile().mkdirs();
                      Cipher c = Cipher.getInstance("AES/CBC/PKCS5Padding");
                      c.init(Cipher.ENCRYPT_MODE, key);
                      FileOutputStream fos = new FileOutputStream(out);
                      fos.write(c.getIV());
                      CipherOutputStream cos = new CipherOutputStream(fos, c);
                      byte[] b = new byte[8192]; int l;
                      while ((l = is.read(b)) > 0) cos.write(b, 0, l);
                      cos.close(); is.close();
                      prefs.edit().putString(id + "_name", "File_" + id.substring(0,4))
                          .putString(id + "_type", "image").putLong(id + "_size", out.length()).apply();
                  } catch (Exception e) {}
              }
              public List<VaultFile> getFiles() {
                  List<VaultFile> list = new ArrayList<>();
                  File dir = new File(ctx.getFilesDir(), "vault");
                  if (dir.exists()) {
                      for (File f : dir.listFiles()) {
                          list.add(new VaultFile(prefs.getString(f.getName()+"_name", "N/A"), 
                              f.getName(), prefs.getString(f.getName()+"_type", "image"), f.length()));
                      }
                  }
                  return list;
              }
              public File decryptFile(String path) {
                  try {
                      File in = new File(ctx.getFilesDir(), "vault/" + path);
                      File out = new File(ctx.getCacheDir(), "tmp");
                      FileInputStream fis = new FileInputStream(in);
                      byte[] iv = new byte[16]; fis.read(iv);
                      Cipher c = Cipher.getInstance("AES/CBC/PKCS5Padding");
                      c.init(Cipher.DECRYPT_MODE, key, new IvParameterSpec(iv));
                      CipherInputStream cis = new CipherInputStream(fis, c);
                      FileOutputStream fos = new FileOutputStream(out);
                      byte[] b = new byte[8192]; int l;
                      while ((l = cis.read(b)) > 0) fos.write(b, 0, l);
                      fos.close(); cis.close();
                      return out;
                  } catch (Exception e) { return null; }
              }
          }
          EOF

          # Остальные вспомогательные файлы (без изменений или минимальные правки)
          cat > app/src/main/res/xml/data_extraction_rules.xml << 'EOF'
          <data-extraction-rules><cloud-backup><exclude domain="file" path="."/></cloud-backup></data-extraction-rules>
          EOF
          cat > app/src/main/res/xml/file_paths.xml << 'EOF'
          <paths><files-path name="vault" path="vault/"/><cache-path name="cache" path="/"/></paths>
          EOF
          cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48"><path android:fillColor="#FF9800" android:pathData="M8,8h32v32h-32z"/><path android:fillColor="#FFF" android:pathData="M14,18h20v3h-20zM14,27h20v3h-20z"/></vector>
          EOF

          # Копируем заглушки для остальных классов, чтобы сборка не упала
          cp app/src/main/java/com/wordgame/vault/VaultFile.java app/src/main/java/com/wordgame/vault/VaultFile.java || cat > app/src/main/java/com/wordgame/vault/VaultFile.java << 'EOF'
          package com.wordgame.vault;
          public class VaultFile {
              public String originalName, encryptedPath, type; public long size;
              public VaultFile(String n, String p, String t, long s) { originalName=n; encryptedPath=p; type=t; size=s; }
          }
          EOF

          cat > app/src/main/java/com/wordgame/vault/MediaAdapter.java << 'EOF'
          package com.wordgame.vault;
          import android.view.*; import android.widget.*; import androidx.recyclerview.widget.RecyclerView;
          import com.wordgame.R; import java.util.List;
          public class MediaAdapter extends RecyclerView.Adapter<MediaAdapter.VH> {
              List<VaultFile> files; OnItemClick listener;
              public interface OnItemClick { void onClick(VaultFile f); }
              public MediaAdapter(List<VaultFile> f, OnItemClick l) { files = f; listener = l; }
              @Override public VH onCreateViewHolder(ViewGroup p, int t) {
                  return new VH(LayoutInflater.from(p.getContext()).inflate(R.layout.item_media, p, false));
              }
              @Override public void onBindViewHolder(VH h, int p) {
                  h.t.setText(files.get(p).originalName);
                  h.itemView.setOnClickListener(v -> listener.onClick(files.get(p)));
              }
              @Override public int getItemCount() { return files.size(); }
              static class VH extends RecyclerView.ViewHolder { TextView t; VH(View v) { super(v); t = v.findViewById(R.id.fileName); } }
          }
          EOF

          cat > app/src/main/java/com/wordgame/vault/MediaViewerActivity.java << 'EOF'
          package com.wordgame.vault;
          import android.os.Bundle; import android.widget.ImageView; import android.graphics.BitmapFactory;
          import androidx.appcompat.app.AppCompatActivity; import com.wordgame.R; import com.wordgame.security.VaultManager;
          public class MediaViewerActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_media_viewer);
                  String path = getIntent().getStringExtra("file");
                  VaultManager vm = new VaultManager(this);
                  java.io.File dec = vm.decryptFile(path);
                  if (dec != null) ((ImageView)findViewById(R.id.imageView)).setImageBitmap(BitmapFactory.decodeFile(dec.getAbsolutePath()));
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault_Fixed
          path: app/build/outputs/apk/debug/app-debug.apk

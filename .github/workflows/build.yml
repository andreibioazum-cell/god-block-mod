name: Zig_Scratch_Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Components
        run: |
          # Устанавливаем NDK и Build-Tools версии 30.0.3
          yes | sdkmanager "ndk;25.1.8937393" "platforms;android-30" "build-tools;30.0.3"

      - name: Build with Zig
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393
          zig build -Dtarget=aarch64-linux-android -Doptimize=ReleaseFast --summary all
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.1.8937393

      - name: Package APK
        run: |
          mkdir -p build/lib/arm64-v8a
          # Копируем скомпилированную библиотеку
          cp zig-out/lib/libCubicBattle.so build/lib/arm64-v8a/libCubicBattle.so
          
          # Находим пути к инструментам динамически
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          AAPT=$BUILD_TOOLS_DIR/aapt
          ZIPALIGN=$BUILD_TOOLS_DIR/zipalign
          APKSIGNER=$BUILD_TOOLS_DIR/apksigner
          PLATFORM_JAR=$ANDROID_HOME/platforms/android-30/android.jar
          
          echo "Using Build Tools from: $BUILD_TOOLS_DIR"

          # 1. Упаковка
          $AAPT package -f -M AndroidManifest.xml -I $PLATFORM_JAR -F CubicBattle-unaligned.apk build/
          
          # 2. Выравнивание
          $ZIPALIGN -f -v 4 CubicBattle-unaligned.apk CubicBattle-aligned.apk
          
          # 3. Генерация ключа (если нет)
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android,O=Android,C=US"
          
          # 4. Подпись
          $APKSIGNER sign --ks debug.keystore --ks-pass pass:android --out CubicBattle-ready.apk CubicBattle-aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZigCubic_Final_APK
          path: CubicBattle-ready.apk

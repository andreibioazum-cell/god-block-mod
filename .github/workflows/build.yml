name: TasksAI OmniTransformer (GPT Architecture)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 ndk;25.1.8937393 cmake;3.22.1'

      - name: Create Folders
        run: mkdir -p app/src/main/cpp app/src/main/java/com/aetherai app/src/main/res/layout app/src/main/res/drawable app/src/main/res/values

      - name: Create C++ Core (GPT-style Transformer Engine)
        run: |
          cat > app/src/main/cpp/ggml_core.h << 'EOF'
          #ifndef GGML_CORE_H
          #define GGML_CORE_H
          #include <vector>
          #include <string>
          #include <map>
          #include <cmath>
          #include <algorithm>
          #include <random>

          class GPTCore {
          public:
              std::map<std::string, int> vocab;
              std::vector<std::string> id_to_word;
              std::vector<int> stream;
              std::mt19937 gen;
              float temperature = 0.8f; // Контроль креативности

              GPTCore() : gen(std::random_device{}()) {}

              int get_id(std::string w) {
                  if (vocab.count(w)) return vocab[w];
                  int id = vocab.size();
                  vocab[w] = id;
                  id_to_word.push_back(w);
                  return id;
              }

              void learn(std::string text) {
                  std::stringstream ss(text); std::string w;
                  while(ss >> w) stream.push_back(get_id(w));
              }

              // МЕХАНИЗМ ВНИМАНИЯ (ATTENTION) + NEXT TOKEN PREDICTION
              std::string generate(std::string query, int length = 150) {
                  if (stream.size() < 10) return "Not enough data to form thoughts.";

                  std::vector<int> context;
                  std::stringstream ss(query); std::string w;
                  while(ss >> w) context.push_back(get_id(w));

                  std::string output = "";
                  
                  for (int t = 0; t < length; t++) {
                      std::map<int, float> logits;
                      
                      // Анализируем разные размеры контекста (аналог слоев внимания)
                      for (int window = 1; window <= 3; window++) {
                          if (context.size() < window) continue;
                          
                          for (size_t i = window; i < stream.size() - 1; i++) {
                              bool match = true;
                              for (int j = 0; j < window; j++) {
                                  if (stream[i - window + j] != context[context.size() - window + j]) {
                                      match = false; break;
                                  }
                              }
                              if (match) {
                                  // Чем длиннее совпавший контекст, тем выше вес токена
                                  logits[stream[i]] += (float)window * 2.0f;
                              }
                          }
                      }

                      if (logits.empty()) {
                          // "Галлюцинация": если контекст не найден, выбираем ассоциативно
                          int fallback = stream[gen() % (stream.size()-1)];
                          logits[fallback] = 1.0f;
                      }

                      // ПРИМЕНЕНИЕ ТЕМПЕРАТУРЫ (Softmax-симуляция)
                      std::vector<std::pair<int, float>> candidates;
                      float total_prob = 0;
                      for (auto const& [id, weight] : logits) {
                          float prob = std::pow(weight, 1.0f / temperature);
                          candidates.push_back({id, prob});
                          total_prob += prob;
                      }

                      // Сэмплирование (случайный выбор из вероятностей)
                      std::uniform_real_distribution<float> dist(0, total_prob);
                      float roll = dist(gen);
                      int next_id = -1;
                      for (auto const& cand : candidates) {
                          roll -= cand.second;
                          if (roll <= 0) { next_id = cand.first; break; }
                      }

                      if (next_id == -1) next_id = candidates[0].first;
                      
                      std::string word = id_to_word[next_id];
                      if (word == "u:") break; // Стоп-токен
                      
                      output += word + " ";
                      context.push_back(next_id);
                      if (context.size() > 5) context.erase(context.begin()); // Окно памяти
                  }
                  return output;
              }
          };
          #endif
          EOF

          cat > app/src/main/cpp/aetherai_jni.cpp << 'EOF'
          #include <jni.h>
          #include <string>
          #include "ggml_core.h"

          static GPTCore engine;

          extern "C" JNIEXPORT void JNICALL Java_com_aetherai_AIEngine_addText(JNIEnv* env, jobject, jstring text) {
              const char* c = env->GetStringUTFChars(text, nullptr);
              engine.learn(c);
              env->ReleaseStringUTFChars(text, c);
          }

          extern "C" JNIEXPORT jstring JNICALL Java_com_aetherai_AIEngine_generate(JNIEnv* env, jobject, jstring input) {
              const char* c = env->GetStringUTFChars(input, nullptr);
              std::string res = engine.generate(c);
              env->ReleaseStringUTFChars(input, c);
              return env->NewStringUTF(res.c_str());
          }
          EOF

          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(aetherai)
          add_library(aetherai SHARED aetherai_jni.cpp)
          target_link_libraries(aetherai log)
          EOF

      - name: Create Java MainActivity (Modern Chat UI)
        run: |
          cat > app/src/main/java/com/aetherai/AIEngine.java << 'EOF'
          package com.aetherai;
          public class AIEngine { static { System.loadLibrary("aetherai"); }
          public native void addText(String t); public native String generate(String input); }
          EOF
          cat > app/src/main/java/com/aetherai/MainActivity.java << 'EOF'
          package com.aetherai;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.*;
          import android.widget.*;
          import android.content.Intent;
          import android.graphics.Color;
          import java.io.*;

          public class MainActivity extends Activity {
          AIEngine ai = new AIEngine(); LinearLayout chat; EditText input; ScrollView scroll;
          
          @Override protected void onCreate(Bundle savedInstanceState) {
          super.onCreate(savedInstanceState);
          setContentView(createUI());
          }

          private View createUI() {
              LinearLayout root = new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL); root.setBackgroundColor(0xFF0D1117);
              
              Toolbar tb = new Toolbar(this); tb.setTitle("TasksAI OmniGPT"); tb.setTitleTextColor(-1); tb.setBackgroundColor(0xFF161B22);
              root.addView(tb);

              scroll = new ScrollView(this); chat = new LinearLayout(this); chat.setOrientation(LinearLayout.VERTICAL); chat.setPadding(30,30,30,30);
              scroll.addView(chat);
              root.addView(scroll, new LinearLayout.LayoutParams(-1, 0, 1));
              
              LinearLayout controls = new LinearLayout(this); controls.setPadding(20,20,20,20);
              Button btnData = new Button(this); btnData.setText("TRAIN"); btnData.setOnClickListener(v -> {
                  Intent it = new Intent(Intent.ACTION_GET_CONTENT); it.setType("text/plain"); startActivityForResult(it, 1);
              });
              input = new EditText(this); input.setHint("Type a message..."); input.setTextColor(-1);
              Button btnSend = new Button(this); btnSend.setText("GO"); btnSend.setOnClickListener(v -> {
                  String q = input.getText().toString(); if(q.isEmpty()) return;
                  addBubble("You", q, 0xFF21262D);
                  new Thread(() -> {
                      String res = ai.generate(q);
                      ai.addText("u: " + q + " a: " + res); // Обучение в реальном времени
                      runOnUiThread(() -> addBubble("AI", res, 0xFF161B22));
                  }).start();
                  input.setText("");
              });
              controls.addView(btnData); controls.addView(input, new LinearLayout.LayoutParams(0, -2, 1)); controls.addView(btnSend);
              root.addView(controls); return root;
          }

          private void addBubble(String user, String text, int color) {
              TextView tv = new TextView(this); tv.setText(user + ":\n" + text); tv.setTextColor(-1);
              tv.setPadding(30,30,30,30);
              LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2); lp.setMargins(0,10,0,10);
              tv.setLayoutParams(lp); tv.setBackgroundColor(color);
              chat.addView(tv); scroll.post(() -> scroll.fullScroll(View.FOCUS_DOWN));
          }

          @Override protected void onActivityResult(int req, int res, Intent d) {
              if (d != null && d.getData() != null) { new Thread(() -> { try {
                  InputStream is = getContentResolver().openInputStream(d.getData());
                  BufferedReader br = new BufferedReader(new InputStreamReader(is));
                  String l; while ((l = br.readLine()) != null) ai.addText(l + " ");
              } catch (Exception e) {} }).start(); }
          } }
          EOF

      - name: Final Build
        run: |
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'EOF'
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.aetherai'; compileSdk 34
          defaultConfig { applicationId "com.tasksai.gpt"; minSdk 26; targetSdk 34; ndk { abiFilters 'arm64-v8a' } }
          externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt" } } }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <application android:label="OmniGPT" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
          <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
          <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
          </activity></application></manifest>
          EOF
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TasksAI-OmniGPT-Pro
          path: app/build/outputs/apk/debug/app-debug.apk

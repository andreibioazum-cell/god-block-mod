name: Zig_Native_Android_CI
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: yes | sdkmanager "ndk;25.1.8937393"

      - name: Build and Fetch Hash
        run: |
          # Если хеш неверный, Zig выведет: "found: 1220..."
          zig build -Dtarget=aarch64-linux-android -Doptimize=ReleaseFast || echo "CHECK_HASH_ABOVE"

      - name: Package APK
        run: |
          mkdir -p build/lib/arm64-v8a
          # Если билд прошел успешно, копируем либу
          if [ -d "zig-out/lib" ]; then
            cp zig-out/lib/libCubicBattle.so build/lib/arm64-v8a/libCubicBattle.so
            AAPT=$ANDROID_HOME/build-tools/30.0.3/aapt
            $AAPT package -f -M AndroidManifest.xml -I $ANDROID_HOME/platforms/android-30/android.jar -F CubicBattle.apk build/
            keytool -genkeypair -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android,O=Android,C=US"
            $ANDROID_HOME/build-tools/30.0.3/apksigner sign --ks debug.keystore --ks-pass pass:android --out CubicBattle-ready.apk CubicBattle.apk
          else
            echo "Build failed, check Zig hash in logs"
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ZigCubic_APK
          path: CubicBattle-ready.apk

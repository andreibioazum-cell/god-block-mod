name: Enjoer_7.2_Rajawali
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Project
        run: |
          mkdir -p app/src/main/java/com/enjoer/game
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          cat > app/src/main/res/values/themes.xml << 'THEMES'
          <resources><style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar"><item name="android:windowFullscreen">true</item></style></resources>
          THEMES

          for f in btn_blue btn_blue_filled btn_red btn_green btn_brown joy_base joy_stick panel_bg color_btn crosshair ridix_bg inv_slot; do touch app/src/main/res/drawable/$f.xml; done

          cat > app/src/main/res/drawable/btn_blue.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><corners android:radius="12dp"/><solid android:color="#101820"/><stroke android:width="2dp" android:color="#00BFFF"/></shape>
          EOF
          cat > app/src/main/res/drawable/btn_blue_filled.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><corners android:radius="12dp"/><solid android:color="#00BFFF"/></shape>
          EOF
          cat > app/src/main/res/drawable/btn_red.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><corners android:radius="12dp"/><solid android:color="#101820"/><stroke android:width="2dp" android:color="#FF4444"/></shape>
          EOF
          cat > app/src/main/res/drawable/btn_green.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><corners android:radius="12dp"/><solid android:color="#101820"/><stroke android:width="2dp" android:color="#44FF44"/></shape>
          EOF
          cat > app/src/main/res/drawable/btn_brown.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><corners android:radius="12dp"/><solid android:color="#8B4513"/><stroke android:width="2dp" android:color="#654321"/></shape>
          EOF
          cat > app/src/main/res/drawable/joy_base.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="#CC101820"/><stroke android:width="2dp" android:color="#00BFFF"/></shape>
          EOF
          cat > app/src/main/res/drawable/joy_stick.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="#00BFFF"/></shape>
          EOF
          cat > app/src/main/res/drawable/panel_bg.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><corners android:radius="8dp"/><solid android:color="#E6101820"/><stroke android:width="1dp" android:color="#00BFFF"/></shape>
          EOF
          cat > app/src/main/res/drawable/color_btn.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="#FFF"/><stroke android:width="2dp" android:color="#00BFFF"/></shape>
          EOF
          cat > app/src/main/res/drawable/crosshair.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="#FF00BFFF"/><size android:width="10dp" android:height="10dp"/></shape>
          EOF
          cat > app/src/main/res/drawable/ridix_bg.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><corners android:radius="12dp"/><solid android:color="#CC0A1428"/><stroke android:width="2dp" android:color="#FFD700"/></shape>
          EOF
          cat > app/src/main/res/drawable/inv_slot.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><corners android:radius="6dp"/><solid android:color="#AA101820"/><stroke android:width="2dp" android:color="#00BFFF"/></shape>
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.enjoer.game'; compileSdk 34; defaultConfig { applicationId 'com.enjoer.game'; minSdk 24; targetSdk 34 }; buildFeatures { buildConfig true }; packaging { resources { excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE','META-INF/LICENSE.txt','META-INF/NOTICE','META-INF/NOTICE.txt'] } } }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'org.mozilla:rhino:1.7.14'; implementation 'com.github.mkpaz:rajawali:1.1.970' }
          EOF

          cat > build.gradle << 'EOF'
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } } }
          EOF

          echo "include ':app'" > settings.gradle

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Enjoer 7.2" android:theme="@style/AppTheme">
                  <activity android:name="com.enjoer.game.MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/enjoer/game/Block.java << 'EOF'
          package com.enjoer.game;
          public class Block{public float x,y,z,sx,sy,sz,r,g,b;public boolean hidden=false;public int ridixPrice=0;public boolean purchased=false;public String itemName="";
          public Block(float x,float y,float z,float sx,float sy,float sz,float r,float g,float b){this.x=x;this.y=y;this.z=z;this.sx=sx;this.sy=sy;this.sz=sz;this.r=r;this.g=g;this.b=b;}
          public float minX(){return x-sx/2f;}public float maxX(){return x+sx/2f;}public float minY(){return y-sy/2f;}public float maxY(){return y+sy/2f;}public float minZ(){return z-sz/2f;}public float maxZ(){return z+sz/2f;}}
          EOF

          cat > app/src/main/java/com/enjoer/game/Light.java << 'EOF'
          package com.enjoer.game;
          public class Light{public float x,y,z,r,g,b,intensity;public boolean isSpot,hidden=false;public int ridixPrice=0;public boolean purchased=false;public String itemName="";
          public Light(float x,float y,float z,float r,float g,float b,float intensity,boolean isSpot){this.x=x;this.y=y;this.z=z;this.r=r;this.g=g;this.b=b;this.intensity=intensity;this.isSpot=isSpot;}}
          EOF

          cat > app/src/main/java/com/enjoer/game/Item.java << 'EOF'
          package com.enjoer.game;
          public class Item{public float x,y,z;public String type;public boolean hidden=false,collected=false;public int ridixPrice=0;public boolean purchased=false;public String itemName="";
          public Item(float x,float y,float z,String type){this.x=x;this.y=y;this.z=z;this.type=type;}
          public float minX(){return x-0.5f;}public float maxX(){return x+0.5f;}public float minY(){return y-0.5f;}public float maxY(){return y+0.5f;}public float minZ(){return z-0.5f;}public float maxZ(){return z+0.5f;}}
          EOF

          cat > app/src/main/java/com/enjoer/game/GameText.java << 'EOF'
          package com.enjoer.game;
          public class GameText{public float x,y,z;public String text;public boolean hidden=false;public int ridixPrice=0;public boolean purchased=false;public String itemName="";
          public GameText(float x,float y,float z,String text){this.x=x;this.y=y;this.z=z;this.text=text!=null&&!text.isEmpty()?text:"Text";}}
          EOF

          cat > app/src/main/java/com/enjoer/game/GameRenderer.java << 'ENDRENDERER'
          package com.enjoer.game;
          import android.content.Context; import android.opengl.GLES30; import android.view.MotionEvent;
          import org.rajawali3d.Object3D; import org.rajawali3d.lights.DirectionalLight; import org.rajawali3d.lights.PointLight;
          import org.rajawali3d.materials.Material; import org.rajawali3d.materials.methods.DiffuseMethod;
          import org.rajawali3d.materials.textures.ATexture; import org.rajawali3d.math.vector.Vector3;
          import org.rajawali3d.primitives.Cube; import org.rajawali3d.primitives.Cylinder; import org.rajawali3d.primitives.Sphere;
          import org.rajawali3d.renderer.Renderer; import org.rajawali3d.view.SurfaceView;
          import java.util.concurrent.CopyOnWriteArrayList;
          public class GameRenderer extends Renderer {
          public float pX=0,pY=6,pZ=15,rY=0,rX=0,jX=0,jY=0,vY=0;
          public boolean isEngineMode=false,isPlayingLevel=false,gridEnabled=true,inventoryVisible=false;
          public float blockR=0.3f,blockG=0.6f,blockB=1f,blockSX=4,blockSY=4,blockSZ=4,placeDist=12f;
          public final float gridSize=2f;
          public CopyOnWriteArrayList<Block>blocks=new CopyOnWriteArrayList<>();
          public CopyOnWriteArrayList<Light>lights=new CopyOnWriteArrayList<>();
          public CopyOnWriteArrayList<Item>items=new CopyOnWriteArrayList<>();
          public CopyOnWriteArrayList<GameText>texts=new CopyOnWriteArrayList<>();
          public int selectedIndex=-1,selectedType=0;
          public int animPack=0,faceType=0,currentRidixPrice=0,objType=0,shapeType=0,lightType=0,itemType=0;
          public String currentItemName="";public float lightIntensity=10f;
          public float charSkinR=1f,charSkinG=0.82f,charSkinB=0.6f,charTorsoR=0.1f,charTorsoG=0.4f,charTorsoB=1f,charLegsR=0.1f,charLegsG=0.8f,charLegsB=0.2f,charHairR=0.2f,charHairG=0.15f,charHairB=0.1f;
          public String[]inventory=new String[4];public boolean hasStick=false;
          public PurchaseCallback purchaseCallback;public TapBlockCallback tapBlockCallback;
          private Object3D playerBody,playerHead,playerHair,playerArmL,playerArmR,playerLegL,playerLegR,stickObj;
          private Object3D floor,skyDome;private DirectionalLight sunLight;
          private java.util.Map<Block,Object3D>blockObjects=new java.util.HashMap<>();
          private java.util.Map<Item,Object3D>itemObjects=new java.util.HashMap<>();
          private float walkPhase=0f,moveMag=0f,charRotation=0f,jumpPhase=0f;private boolean wasOnGround=true;
          private float blinkTimer=0f,blinkDur=0f;private boolean blinking=false;private float nextBlink=3f;
          private int ppt=-1,ppi=-1;private float attackAnim=0f;private boolean isAttacking=false;
          private static final float FL=0f,PH=5.2f,PR=0.85f,CTYO=3f,CD=14.7f,LH=0.8f,TW=0.7f,TH=0.9f,TD=0.4f,HS=0.55f,AH=0.8f,AW=0.28f,AD=0.28f,LL=0.8f,LW=0.35f,LD=0.35f;
          private Context context;private SurfaceView surfaceView;
          public interface PurchaseCallback{void onPurchaseRequest(String n,int p,int t,int i);}
          public interface TapBlockCallback{void onTapBlock(Block b,int i);}
          public GameRenderer(Context ctx,SurfaceView sv){super(ctx);context=ctx;surfaceView=sv;}
          @Override protected void initScene(){
          getCurrentScene().setBackgroundColor(0.01f,0.015f,0.03f,1f);
          sunLight=new DirectionalLight(0.3f,0.8f,0.5f);sunLight.setLookAt(0.5,1.0,0.3);sunLight.enableShadowMap(1024);
          sunLight.setPower(1.2f);getCurrentScene().addLight(sunLight);
          DirectionalLight fillLight=new DirectionalLight(-0.2f,-0.3f,0.3f);fillLight.setPower(0.3f);getCurrentScene().addLight(fillLight);
          Material floorMat=new Material();floorMat.setDiffuseMethod(new DiffuseMethod.Lambert());floorMat.setColor(0x07121f);
          floor=new Cube(400);floor.setMaterial(floorMat);floor.setPosition(0,-0.02f,0);floor.getGeometry().setNormals(true);getCurrentScene().addChild(floor);
          Material bodyMat=new Material();bodyMat.setDiffuseMethod(new DiffuseMethod.Lambert());bodyMat.setColor(0xff1a66ff);
          playerBody=new Cube(TW,TH,TD);playerBody.setMaterial(bodyMat);playerBody.setPosition(0,PH-LH-TH/2f,0);getCurrentScene().addChild(playerBody);
          Material headMat=new Material();headMat.setDiffuseMethod(new DiffuseMethod.Lambert());headMat.setColor(0xffd1a366);
          playerHead=new Sphere(HS*0.7f,12,8);playerHead.setMaterial(headMat);playerHead.setPosition(0,PH-LH-TH-HS/2f,0);getCurrentScene().addChild(playerHead);
          Material hairMat=new Material();hairMat.setDiffuseMethod(new DiffuseMethod.Lambert());hairMat.setColor(0xff332618);
          playerHair=new Sphere(HS*0.5f,8,6);playerHair.setMaterial(hairMat);playerHair.setPosition(0,PH-LH-TH-HS*0.7f,0.05f);playerHair.setScale(1,0.4f,0.9f);getCurrentScene().addChild(playerHair);
          Material limbMat=new Material();limbMat.setDiffuseMethod(new DiffuseMethod.Lambert());limbMat.setColor(0xffd1a366);
          playerArmL=new Cube(AW,AH,AD);playerArmL.setMaterial(limbMat);playerArmL.setPosition(-(TW/2f+AW/2f),PH-LH-TH+0.2f,-AH/2f);getCurrentScene().addChild(playerArmL);
          playerArmR=new Cube(AW,AH,AD);playerArmR.setMaterial(limbMat);playerArmR.setPosition((TW/2f+AW/2f),PH-LH-TH+0.2f,-AH/2f);getCurrentScene().addChild(playerArmR);
          Material legMat=new Material();legMat.setDiffuseMethod(new DiffuseMethod.Lambert());legMat.setColor(0xff1acc33);
          playerLegL=new Cube(LW,LL,LD);playerLegL.setMaterial(legMat);playerLegL.setPosition(-0.18f,PH-LL,-LL/2f);getCurrentScene().addChild(playerLegL);
          playerLegR=new Cube(LW,LL,LD);playerLegR.setMaterial(legMat);playerLegR.setPosition(0.18f,PH-LL,-LL/2f);getCurrentScene().addChild(playerLegR);
          Material stickMat=new Material();stickMat.setDiffuseMethod(new DiffuseMethod.Lambert());stickMat.setColor(0xff8B4513);
          stickObj=new Cube(0.06f,0.8f,0.06f);stickObj.setMaterial(stickMat);stickObj.setVisible(false);getCurrentScene().addChild(stickObj);
          getCurrentCamera().setPosition(pX,PH+3,pZ+CD);getCurrentCamera().setLookAt(pX,PH,pZ);
          lb();}
          private void updatePlayerMaterials(){playerBody.getMaterial().setColor(new float[]{charTorsoR,charTorsoG,charTorsoB,1});playerHead.getMaterial().setColor(new float[]{charSkinR,charSkinG,charSkinB,1});playerHair.getMaterial().setColor(new float[]{charHairR,charHairG,charHairB,1});playerArmL.getMaterial().setColor(new float[]{charSkinR,charSkinG,charSkinB,1});playerArmR.getMaterial().setColor(new float[]{charSkinR,charSkinG,charSkinB,1});playerLegL.getMaterial().setColor(new float[]{charLegsR,charLegsG,charLegsB,1});playerLegR.getMaterial().setColor(new float[]{charLegsR,charLegsG,charLegsB,1});}
          public void lb(){clearScene();}
          private void clearScene(){for(Object3D o:blockObjects.values())getCurrentScene().removeChild(o);for(Object3D o:itemObjects.values())getCurrentScene().removeChild(o);blockObjects.clear();itemObjects.clear();blocks.clear();lights.clear();items.clear();texts.clear();
          blocks.add(new Block(0,2,-10,8,4,8,0.9f,0.2f,0.2f));lights.add(new Light(-5,8,-8,1f,1f,0.8f,15f,false));
          Item s=new Item(3,3,-8,"stick");s.itemName="Stick";items.add(s);syncScene();}
          private void syncScene(){for(Block b:blocks){if(!blockObjects.containsKey(b)){Material m=new Material();m.setDiffuseMethod(new DiffuseMethod.Lambert());m.setColor(new float[]{b.r,b.g,b.b,1});Cube c=new Cube(b.sx,b.sy,b.sz);c.setMaterial(m);c.setPosition(b.x,b.y,b.z);blockObjects.put(b,c);getCurrentScene().addChild(c);}}
          for(Item it:items){if(!itemObjects.containsKey(it)){Material m=new Material();m.setDiffuseMethod(new DiffuseMethod.Lambert());m.setColor(it.type.equals("stick")?new float[]{0.55f,0.27f,0.07f,1}:new float[]{0.8f,0.8f,0.2f,1});Cube c=new Cube(0.1f,1.4f,0.1f);c.setMaterial(m);c.setPosition(it.x,it.y,it.z);itemObjects.put(it,c);getCurrentScene().addChild(c);}}}
          public void da(){if(hasStick&&!isAttacking){isAttacking=true;attackAnim=0f;}}
          public void pi(Item it){for(int j=0;j<inventory.length;j++){if(inventory[j]==null||inventory[j].isEmpty()){inventory[j]=it.itemName.isEmpty()?it.type:it.itemName;it.collected=true;hasStick=true;if(itemObjects.containsKey(it)){itemObjects.get(it).setVisible(false);}return;}}}
          public void po(){float ry=(float)Math.toRadians(rY),rx=(float)Math.toRadians(rX);float vx=(float)(Math.sin(ry)*Math.cos(rx)),vy=(float)Math.sin(rx),vz=(float)(-Math.cos(ry)*Math.cos(rx));float nx=sn(pX+vx*placeDist),ny=sn(pY+vy*placeDist),nz=sn(pZ+vz*placeDist);
          if(objType==0){if(ny-blockSY/2f<FL)ny=FL+blockSY/2f;Block bl=new Block(nx,ny,nz,blockSX,blockSY,blockSZ,blockR,blockG,blockB);bl.ridixPrice=currentRidixPrice;bl.itemName=currentItemName;blocks.add(bl);Material m=new Material();m.setDiffuseMethod(new DiffuseMethod.Lambert());m.setColor(new float[]{blockR,blockG,blockB,1});Cube c=new Cube(blockSX,blockSY,blockSZ);c.setMaterial(m);c.setPosition(nx,ny,nz);blockObjects.put(bl,c);getCurrentScene().addChild(c);}
          else if(objType==2){if(ny-0.5f<FL)ny=FL+0.5f;Item it=new Item(nx,ny,nz,"stick");it.itemName=currentItemName.isEmpty()?"Stick":currentItemName;it.ridixPrice=currentRidixPrice;items.add(it);Material m=new Material();m.setDiffuseMethod(new DiffuseMethod.Lambert());m.setColor(0.55f,0.27f,0.07f,1);Cube c=new Cube(0.1f,1.4f,0.1f);c.setMaterial(m);c.setPosition(nx,ny,nz);itemObjects.put(it,c);getCurrentScene().addChild(c);}}
          public void ds(){if(selectedType==0&&selectedIndex>=0&&selectedIndex<blocks.size()){Block b=blocks.get(selectedIndex);getCurrentScene().removeChild(blockObjects.get(b));blockObjects.remove(b);blocks.remove(selectedIndex);selectedIndex=-1;}
          else if(selectedType==2&&selectedIndex>=0&&selectedIndex<items.size()){Item it=items.get(selectedIndex);getCurrentScene().removeChild(itemObjects.get(it));itemObjects.remove(it);items.remove(selectedIndex);selectedIndex=-1;}}
          public void ms(float dx,float dy,float dz){if(selectedType==0&&selectedIndex>=0&&selectedIndex<blocks.size()){Block b=blocks.get(selectedIndex);b.x=sn(b.x+dx);b.y=sn(b.y+dy);b.z=sn(b.z+dz);if(b.y-b.sy/2f<FL)b.y=FL+b.sy/2f;Object3D o=blockObjects.get(b);if(o!=null)o.setPosition(b.x,b.y,b.z);}
          else if(selectedType==2&&selectedIndex>=0&&selectedIndex<items.size()){Item it=items.get(selectedIndex);it.x=sn(it.x+dx);it.y=sn(it.y+dy);it.z=sn(it.z+dz);Object3D o=itemObjects.get(it);if(o!=null)o.setPosition(it.x,it.y,it.z);}}
          public void ths(){if(selectedType==0&&selectedIndex>=0&&selectedIndex<blocks.size()){Block b=blocks.get(selectedIndex);b.hidden=!b.hidden;Object3D o=blockObjects.get(b);if(o!=null)o.setVisible(!b.hidden);}
          else if(selectedType==2&&selectedIndex>=0&&selectedIndex<items.size()){Item it=items.get(selectedIndex);it.hidden=!it.hidden;Object3D o=itemObjects.get(it);if(o!=null)o.setVisible(!it.hidden);}}
          public void tob(float tx,float ty){float[]pos=new float[4];float[]dir=new float[4];screenToWorld(tx,ty,pos,dir);
          int closest=-1;float cD=Float.MAX_VALUE;
          for(int i=0;i<blocks.size();i++){Block b=blocks.get(i);if(b.hidden)continue;
          float dx=dir[0],dy=dir[1],dz=dir[2];float len=(float)Math.sqrt(dx*dx+dy*dy+dz*dz);dx/=len;dy/=len;dz/=len;
          float mn=(b.minX()-pos[0])/(dx==0?.0001f:dx),mx2=(b.maxX()-pos[0])/(dx==0?.0001f:dx);if(mn>mx2){float tmp=mn;mn=mx2;mx2=tmp;}
          float yn=(b.minY()-pos[1])/(dy==0?.0001f:dy),yx2=(b.maxY()-pos[1])/(dy==0?.0001f:dy);if(yn>yx2){float tmp=yn;yn=yx2;yx2=tmp;}
          if(mn>yx2||yn>mx2)continue;if(yn>mn)mn=yn;if(yx2<mx2)mx2=yx2;
          float zn=(b.minZ()-pos[2])/(dz==0?.0001f:dz),zx=(b.maxZ()-pos[2])/(dz==0?.0001f:dz);if(zn>zx){float tmp=zn;zn=zx;zx=tmp;}
          if(mn>zx||zn>mx2)continue;if(zn>mn)mn=zn;if(mn>0&&mn<cD){cD=mn;closest=i;}}
          if(closest>=0&&closest<blocks.size()){Block b=blocks.get(closest);
          float dx=b.x-pX,dy=b.y-pY,dz=b.z-pZ;float dist=(float)Math.sqrt(dx*dx+dy*dy+dz*dz);
          if(dist<placeDist+2f){if(b.ridixPrice>0&&!b.purchased&&tapBlockCallback!=null)tapBlockCallback.onTapBlock(b,closest);
          else if(isEngineMode){selectedIndex=closest;selectedType=0;blockR=b.r;blockG=b.g;blockB=b.b;blockSX=b.sx;blockSY=b.sy;blockSZ=b.sz;}}}}
          public int rci(float tx,float ty){float[]pos=new float[4];float[]dir=new float[4];screenToWorld(tx,ty,pos,dir);
          int closest=-1;float cD=Float.MAX_VALUE;
          for(int i=0;i<items.size();i++){Item it=items.get(i);if(it.collected||it.hidden)continue;
          float dx=dir[0],dy=dir[1],dz=dir[2];float len=(float)Math.sqrt(dx*dx+dy*dy+dz*dz);dx/=len;dy/=len;dz/=len;
          float mn=(it.minX()-pos[0])/(dx==0?.0001f:dx),mx2=(it.maxX()-pos[0])/(dx==0?.0001f:dx);if(mn>mx2){float tmp=mn;mn=mx2;mx2=tmp;}
          float yn=(it.minY()-pos[1])/(dy==0?.0001f:dy),yx2=(it.maxY()-pos[1])/(dy==0?.0001f:dy);if(yn>yx2){float tmp=yn;yn=yx2;yx2=tmp;}
          if(mn>yx2||yn>mx2)continue;if(yn>mn)mn=yn;if(yx2<mx2)mx2=yx2;
          float zn=(it.minZ()-pos[2])/(dz==0?.0001f:dz),zx=(it.maxZ()-pos[2])/(dz==0?.0001f:dz);if(zn>zx){float tmp=zn;zn=zx;zx=tmp;}
          if(mn>zx||zn>mx2)continue;if(zn>mn)mn=zn;if(mn>0&&mn<cD){cD=mn;closest=i;}}return closest;}
          public Block gsb(){if(selectedType==0&&selectedIndex>=0&&selectedIndex<blocks.size())return blocks.get(selectedIndex);return null;}
          public Item gsi(){if(selectedType==2&&selectedIndex>=0&&selectedIndex<items.size())return items.get(selectedIndex);return null;}
          private void screenToWorld(float sx,float sy,float[]outPos,float[]outDir){double[]rayNear=new double[3],rayFar=new double[3];getCurrentCamera().unProject(sx,sy,0,surfaceView.getWidth(),surfaceView.getHeight(),rayNear);getCurrentCamera().unProject(sx,sy,1,surfaceView.getWidth(),surfaceView.getHeight(),rayFar);outPos[0]=(float)rayNear[0];outPos[1]=(float)rayNear[1];outPos[2]=(float)rayNear[2];outDir[0]=(float)(rayFar[0]-rayNear[0]);outDir[1]=(float)(rayFar[1]-rayNear[1]);outDir[2]=(float)(rayFar[2]-rayNear[2]);}
          private float sn(float v){if(!gridEnabled)return v;return Math.round(v/gridSize)*gridSize;}
          public void cp(int type,int index){if(type==0&&index>=0&&index<blocks.size())blocks.get(index).purchased=true;else if(type==2&&index>=0&&index<items.size())items.get(index).purchased=true;ppt=-1;ppi=-1;}
          public void ccp(){ppt=-1;ppi=-1;}
          public boolean isOnGround(){if(pY-PH<=FL+0.1f)return true;for(Block b:blocks){if(!isEngineMode&&!isPlayingLevel&&b.ridixPrice>0&&!b.purchased)continue;if(pX+PR>b.minX()&&pX-PR<b.maxX()&&pZ+PR>b.minZ()&&pZ-PR<b.maxZ()&&Math.abs((pY-PH)-b.maxY())<0.15f)return true;}return false;}
          public void dj(){if(isOnGround())vY=0.55f;}
          @Override protected void onRender(long elapsedTime,double deltaTime){
          float dt=Math.min((float)deltaTime,0.05f);updatePlayerMaterials();
          mm=Math.min(1,(float)Math.sqrt(jX*jX+jY*jY));bt+=dt;if(!blinking&&bt>nextBlink){blinking=true;bd=0.12f;bt=0;nextBlink=2f+(float)(Math.random()*4f);}if(blinking){bd-=dt;if(bd<=0)blinking=false;}
          if(isAttacking){attackAnim+=dt*12f;if(attackAnim>1f){attackAnim=0f;isAttacking=false;}}
          float s=0.42f,rYr=(float)Math.toRadians(rY);
          if(isEngineMode&&!isPlayingLevel){float rXr=(float)Math.toRadians(rX);float fx=(float)Math.sin(rYr),fz=(float)-Math.cos(rYr),fy=(float)Math.sin(rXr);pX+=(fx*-jY+(float)Math.cos(rYr)*jX)*s;pZ+=(fz*-jY+(float)Math.sin(rYr)*jX)*s;pY+=fy*-jY*s;}
          else{float mX=((float)Math.sin(rYr)*-jY+(float)Math.cos(rYr)*jX)*s;float mZ=((float)-Math.cos(rYr)*-jY+(float)Math.sin(rYr)*jX)*s;vY-=0.025f;float nX=pX+mX,nY=pY+vY,nZ=pZ+mZ,fY=nY-PH;if(fY<FL){nY=FL+PH;vY=0;}
          for(Block b:blocks){if(!isEngineMode&&!isPlayingLevel&&b.ridixPrice>0&&!b.purchased)continue;
          boolean ox=nX+PR>b.minX()&&nX-PR<b.maxX()&&nZ+PR>b.minZ()&&nZ-PR<b.maxZ();boolean oy=fY<b.maxY()-0.1f&&nY>b.minY()+0.1f;
          if(ox){if(pY-PH>=b.maxY()-0.15f&&fY<b.maxY()){nY=b.maxY()+PH;vY=0;}else if(pY<b.minY()&&nY>b.minY()){nY=b.minY();vY=0;}
          else if(oy){float ox1=(nX+PR)-b.minX(),ox2=b.maxX()-(nX-PR),oz1=(nZ+PR)-b.minZ(),oz2=b.maxZ()-(nZ-PR);float mo=Math.min(Math.min(ox1,ox2),Math.min(oz1,oz2));if(mo==ox1)nX=b.minX()-PR;else if(mo==ox2)nX=b.maxX()+PR;else if(mo==oz1)nZ=b.minZ()-PR;else nZ=b.maxZ()+PR;}}}
          pX=nX;pY=nY;pZ=nZ;boolean og=isOnGround();if(!og&&wasOnGround)jp=0f;if(!og)jp=Math.min(1f,jp+dt*5f);else jp=Math.max(0f,jp-dt*8f);wasOnGround=og;
          if(mm>0.05f){cr=(float)Math.toDegrees(Math.atan2(mX,mZ));if(og)wp+=dt*9.5f*mm;}
          if(isAttacking&&hasStick){float fX=(float)Math.sin(rYr),fZ=(float)-Math.cos(rYr);float ax=pX+fX*3f,az=pZ+fZ*3f,ay=pY-2.5f;for(int i=0;i<blocks.size();i++){Block b=blocks.get(i);if(b.hidden)continue;if(ax>b.minX()&&ax<b.maxX()&&ay>b.minY()&&ay<b.maxY()&&az>b.minZ()&&az<b.maxZ()){b.hidden=true;Object3D o=blockObjects.get(b);if(o!=null)o.setVisible(false);}}}}
          float footY=pY-PH;boolean og2=isOnGround();
          float ws=(float)Math.sin(wp)*38f*mm*(og2?1f:0f),js=jumpPhase*65f,la=(float)Math.sin(wp)*(-28f)*mm*(og2?1f:0f),ar=isAttacking&&hasStick?attackAnim*120f:0f;
          playerBody.setPosition(pX,footY+LH+TH/2f,pZ);playerBody.setRotY(cr);
          playerHead.setPosition(pX,footY+LH+TH+HS/2f,pZ);playerHead.setRotY(cr);
          playerHair.setPosition(pX,footY+LH+TH+HS*0.85f,pZ+0.1f);playerHair.setRotY(cr);
          float sy=LH+TH-0.2f;
          playerArmL.setPosition(pX-(TW/2f+AW/2f)*Math.cos(Math.toRadians(cr)),footY+sy,pZ+(TW/2f+AW/2f)*Math.sin(Math.toRadians(cr)));playerArmL.setRotY(cr);playerArmL.setRotX(ws-js);
          playerArmR.setPosition(pX+(TW/2f+AW/2f)*Math.cos(Math.toRadians(cr)),footY+sy,pZ-(TW/2f+AW/2f)*Math.sin(Math.toRadians(cr)));playerArmR.setRotY(cr);playerArmR.setRotX(-ws+js);
          playerLegL.setPosition(pX-0.18f*Math.cos(Math.toRadians(cr)),footY+LH,pZ+0.18f*Math.sin(Math.toRadians(cr)));playerLegL.setRotY(cr);playerLegL.setRotX(la);
          playerLegR.setPosition(pX+0.18f*Math.cos(Math.toRadians(cr)),footY+LH,pZ-0.18f*Math.sin(Math.toRadians(cr)));playerLegR.setRotY(cr);playerLegR.setRotX(-la);
          if(hasStick){stickObj.setVisible(true);stickObj.setPosition(pX+(TW/2f+AW/2f)*Math.cos(Math.toRadians(cr)),footY+sy,pZ-(TW/2f+AW/2f)*Math.sin(Math.toRadians(cr)));stickObj.setRotY(cr);stickObj.setRotX(-ws-ar-90);}else stickObj.setVisible(false);
          float targetY=footY+CTYO;float rXr=(float)Math.toRadians(rX);float hD=CD*(float)Math.cos(rXr),vO=CD*(float)Math.sin(rXr);float camX=pX-(float)Math.sin(rYr)*hD,camY=targetY+vO,camZ=pZ+(float)Math.cos(rYr)*hD;if(camY<0.2f)camY=0.2f;
          getCurrentCamera().setPosition(camX,camY,camZ);getCurrentCamera().setLookAt(pX,targetY,pZ);
          for(Block b:blocks){Object3D o=blockObjects.get(b);if(o!=null){o.setVisible(!b.hidden&&(isEngineMode||isPlayingLevel||b.ridixPrice==0||b.purchased));}}
          for(Item it:items){Object3D o=itemObjects.get(it);if(o!=null){o.setVisible(!it.collected&&!it.hidden&&(isEngineMode||isPlayingLevel||it.ridixPrice==0||it.purchased));float ang=(System.currentTimeMillis()%3600)/10f;o.setPosition(it.x,it.y+(float)Math.sin(Math.toRadians(ang))*0.2f,it.z);o.setRotY(ang*3f);}}
          super.onRender(elapsedTime,deltaTime);}
          }

name: TasksAI-Stable-Russian
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 ndk;25.1.8937393 cmake;3.22.1'

      - name: Create Structure
        run: mkdir -p app/src/main/cpp app/src/main/java/com/tasksai app/src/main/res/layout app/src/main/res/values

      - name: Create C++ Core (Russian Support + Stable)
        run: |
          cat > app/src/main/cpp/tensor_engine.h << 'EOF'
          #ifndef TENSOR_ENGINE_H
          #define TENSOR_ENGINE_H
          #include <vector>
          #include <string>
          #include <cmath>
          #include <algorithm>
          #include <ctime>

          class TinyBrain {
          public:
              std::vector<float> weights;
              const int size = 256; 
              float lr = 0.01f;

              TinyBrain() {
                  srand(time(0));
                  weights.resize(size * size);
                  // Инициализация Xavier для стабильности
                  float scale = sqrt(1.0f / size);
                  for(auto& w : weights) w = ((float)rand()/RAND_MAX - 0.5f) * scale;
              }

              // Обучение: предсказание следующего символа
              float train_step(const std::vector<unsigned char>& sequence) {
                  float total_loss = 0;
                  for(size_t t=0; t < sequence.size()-1; t++) {
                      int input_char = sequence[t];
                      int target_char = sequence[t+1];

                      // Forward pass
                      std::vector<float> pred(size, 0.0f);
                      for(int j=0; j<size; j++) {
                          pred[j] = weights[input_char * size + j];
                      }

                      // Backprop (простой градиентный спуск)
                      for(int j=0; j<size; j++) {
                          float target_val = (j == target_char) ? 1.0f : 0.0f;
                          float error = target_val - pred[j];
                          total_loss += error * error;
                          
                          float delta = lr * error;
                          // Clip gradients
                          if(delta > 0.05f) delta = 0.05f;
                          if(delta < -0.05f) delta = -0.05f;
                          
                          weights[input_char * size + j] += delta;
                      }
                  }
                  return total_loss / sequence.size();
              }

              std::string generate(std::string seed, int len) {
                  if(seed.empty()) seed = " ";
                  std::string result = "";
                  unsigned char last_char = (unsigned char)seed.back();

                  for(int i=0; i<len; i++) {
                      int best_char = 32;
                      float max_score = -1e9;
                      
                      // Находим следующий символ с учетом "температуры"
                      for(int j=32; j<255; j++) {
                          float score = weights[last_char * size + j];
                          float noise = ((float)rand()/RAND_MAX) * 0.2f; // Случайность
                          if((score + noise) > max_score) {
                              max_score = score + noise;
                              best_char = j;
                          }
                      }
                      
                      result += (char)best_char;
                      last_char = (unsigned char)best_char;
                      if(best_char == '\n' || best_char == '.') break;
                  }
                  return result;
              }
          };
          EOF

          cat > app/src/main/cpp/native-lib.cpp << 'EOF'
          #include <jni.h>
          #include "tensor_engine.h"

          static TinyBrain brain;

          extern "C" JNIEXPORT jfloat JNICALL Java_com_tasksai_MLEngine_trainBatch(JNIEnv* env, jobject, jstring text) {
              const char* c = env->GetStringUTFChars(text, nullptr);
              std::string s(c);
              std::vector<unsigned char> seq(s.begin(), s.end());
              float loss = brain.train_step(seq);
              env->ReleaseStringUTFChars(text, c);
              return loss;
          }

          extern "C" JNIEXPORT jstring JNICALL Java_com_tasksai_MLEngine_chat(JNIEnv* env, jobject, jstring text) {
              const char* c = env->GetStringUTFChars(text, nullptr);
              std::string seed(c);
              std::string res = brain.generate(seed, 100);
              env->ReleaseStringUTFChars(text, c);
              return env->NewStringUTF(res.c_str());
          }
          EOF

          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(tasksai)
          add_library(tasksai SHARED native-lib.cpp)
          target_link_libraries(tasksai log)
          EOF

      - name: Create UI Layout
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0D1117">
              <TextView android:id="@+id/st" android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="10dp" android:text="TasksAI Stable v2" android:textColor="#58A6FF" android:gravity="center"/>
              <ScrollView android:id="@+id/sc" android:layout_width="match_parent" android:layout_height="match_parent" android:layout_above="@+id/controls" android:layout_below="@id/st">
                  <TextView android:id="@+id/log" android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="15dp" android:textColor="#C9D1D9" android:textSize="14sp" android:text="-- Обучите модель на data.txt --\n"/>
              </ScrollView>
              <LinearLayout android:id="@+id/controls" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:layout_alignParentBottom="true" android:background="#161B22" android:padding="10dp">
                  <ProgressBar android:id="@+id/pb" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="wrap_content" android:visibility="gone"/>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content">
                      <EditText android:id="@+id/input" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:hint="Ваш вопрос..." android:textColor="#FFF" android:textColorHint="#484F58"/>
                      <Button android:id="@+id/send" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="->"/>
                  </LinearLayout>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content">
                      <Button android:id="@+id/load" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="Загрузить TXT"/>
                      <Button android:id="@+id/train" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="Обучить (12 Эпох)" android:enabled="false"/>
                  </LinearLayout>
              </LinearLayout>
          </RelativeLayout>
          EOF

      - name: Create Java Code
        run: |
          cat > app/src/main/java/com/tasksai/MLEngine.java << 'EOF'
          package com.tasksai;
          public class MLEngine {
              static { System.loadLibrary("tasksai"); }
              public native float trainBatch(String t);
              public native String chat(String t);
          }
          EOF
          cat > app/src/main/java/com/tasksai/MainActivity.java << 'EOF'
          package com.tasksai;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.*;
          import java.io.*;

          public class MainActivity extends Activity {
              MLEngine ai = new MLEngine();
              TextView log, st; EditText input; ProgressBar pb; Button btnTrain;
              String trainingData = "";

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  log=findViewById(R.id.log); st=findViewById(R.id.st);
                  input=findViewById(R.id.input); pb=findViewById(R.id.pb);
                  btnTrain=findViewById(R.id.train);

                  findViewById(R.id.load).setOnClickListener(v -> {
                      Intent it = new Intent(Intent.ACTION_GET_CONTENT); it.setType("text/plain");
                      startActivityForResult(it, 1);
                  });

                  btnTrain.setOnClickListener(v -> {
                      btnTrain.setEnabled(false); pb.setVisibility(View.VISIBLE);
                      new Thread(() -> {
                          for(int e=1; e<=12; e++) {
                              float loss = ai.trainBatch(trainingData);
                              final int epoch = e; final float l = loss;
                              runOnUiThread(() -> { st.setText("Эпоха: "+epoch+" | Loss: "+l); pb.setProgress(epoch*8); });
                          }
                          runOnUiThread(() -> { pb.setVisibility(View.GONE); st.setText("Обучение завершено!"); btnTrain.setEnabled(true); });
                      }).start();
                  });

                  findViewById(R.id.send).setOnClickListener(v -> {
                      String q = input.getText().toString();
                      log.append("\nВЫ: " + q);
                      String reply = ai.chat(q);
                      log.append("\nИИ: " + reply + "\n");
                      input.setText("");
                  });
              }

              @Override protected void onActivityResult(int req, int res, Intent d) {
                  if(d != null && d.getData() != null) { try {
                      InputStream is = getContentResolver().openInputStream(d.getData());
                      BufferedReader br = new BufferedReader(new InputStreamReader(is));
                      StringBuilder sb = new StringBuilder(); String line;
                      while((line = br.readLine()) != null) sb.append(line).append("\n");
                      trainingData = sb.toString();
                      btnTrain.setEnabled(true);
                      st.setText("Данные загружены: " + trainingData.length() + " симв.");
                  } catch(Exception e) { st.setText("Ошибка файла"); } }
              }
          }
          EOF

      - name: Build APK
        run: |
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'EOF'
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.tasksai'; compileSdk 34
            defaultConfig { applicationId "com.tasksai.stable"; minSdk 26; targetSdk 34 }
            externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt" } } }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <application android:label="TasksAI Stable" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
          <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
          <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
          </activity></application></manifest>
          EOF
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TasksAI-Stable-App
          path: app/build/outputs/apk/debug/app-debug.apk

name: ShieldVPN_v2
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Project
        run: |
          mkdir -p app/src/main/java/com/antidpi/vpn
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle << 'ENDFILE'
          include ':app'
          ENDFILE

          cat > build.gradle << 'ENDFILE'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          ENDFILE

          cat > app/build.gradle << 'ENDFILE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.antidpi.vpn'
              compileSdk 34
              defaultConfig {
                  applicationId "com.antidpi.vpn"
                  minSdk 29
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }
              buildTypes { debug { minifyEnabled false } }
          }
          ENDFILE

          cat > gradle.properties << 'ENDFILE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          ENDFILE

          cat > app/src/main/res/values/colors.xml << 'ENDFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#0A0A0F</color>
              <color name="accent">#00E5FF</color>
              <color name="green">#00FF88</color>
              <color name="red">#FF4444</color>
              <color name="gray">#888888</color>
              <color name="text">#EAEAEA</color>
          </resources>
          ENDFILE

          cat > app/src/main/res/values/strings.xml << 'ENDFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">ShieldVPN</string>
          </resources>
          ENDFILE

          cat > app/src/main/res/layout/activity_main.xml << 'ENDFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="@color/bg"
              android:padding="20dp"
              android:gravity="center_horizontal">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="🛡️ ShieldVPN"
                  android:textColor="@color/accent"
                  android:textSize="32sp"
                  android:textStyle="bold"
                  android:layout_marginTop="40dp"/>

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Anti-DPI TLS Fragmenter"
                  android:textColor="@color/gray"
                  android:textSize="13sp"
                  android:layout_marginTop="4dp"/>

              <TextView
                  android:id="@+id/statusText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="● OFF"
                  android:textColor="@color/red"
                  android:textSize="18sp"
                  android:layout_marginTop="40dp"/>

              <Button
                  android:id="@+id/btnConnect"
                  android:layout_width="220dp"
                  android:layout_height="220dp"
                  android:text="START"
                  android:textSize="22sp"
                  android:textStyle="bold"
                  android:textColor="#FFF"
                  android:backgroundTint="@color/accent"
                  android:layout_marginTop="30dp"/>

              <ScrollView
                  android:id="@+id/logScroll"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:background="#12121A"
                  android:padding="10dp"
                  android:layout_marginTop="30dp">
                  <TextView
                      android:id="@+id/logView"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textColor="@color/text"
                      android:textSize="10sp"
                      android:fontFamily="monospace"
                      android:text=""/>
              </ScrollView>
          </LinearLayout>
          ENDFILE

          cat > app/src/main/AndroidManifest.xml << 'ENDFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                  android:icon="@android:drawable/ic_menu_compass"
                  android:usesCleartextTraffic="true">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ShieldVpnService"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <intent-filter>
                          <action android:name="android.net.VpnService"/>
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          ENDFILE

          # ===== HTTP PROXY с TLS фрагментацией =====
          cat > app/src/main/java/com/antidpi/vpn/HttpProxy.java << 'ENDFILE'
          package com.antidpi.vpn;

          import android.util.Log;
          import java.io.*;
          import java.net.*;
          import java.util.Random;

          /**
           * HTTP CONNECT proxy сервер.
           * Принимает HTTPS-трафик от Android system proxy,
           * подключается к целевому серверу,
           * фрагментирует TLS ClientHello для обхода DPI.
           */
          public class HttpProxy {

              private static final String TAG = "ShieldProxy";
              private static final int BUF_SIZE = 16384;
              private static final Random rnd = new Random();

              // Параметры фрагментации
              private static final int FRAG_MIN = 1;
              private static final int FRAG_MAX = 5;
              private static final int SLEEP_MIN = 5;
              private static final int SLEEP_MAX = 30;

              private final int port;
              private ServerSocket server;
              private volatile boolean running = false;

              public interface Logger { void log(String msg); }
              private Logger logger;

              public HttpProxy(int port, Logger logger) {
                  this.port = port;
                  this.logger = logger;
              }

              public void start() throws IOException {
                  server = new ServerSocket(port, 256, InetAddress.getByName("127.0.0.1"));
                  running = true;
                  logger.log("Proxy listening on 127.0.0.1:" + port);

                  new Thread(() -> {
                      while (running) {
                          try {
                              Socket client = server.accept();
                              client.setTcpNoDelay(true);
                              new Thread(() -> handle(client)).start();
                          } catch (IOException e) {
                              if (running) Log.e(TAG, "Accept: " + e.getMessage());
                          }
                      }
                  }).start();
              }

              public void stop() {
                  running = false;
                  try { if (server != null) server.close(); } catch (IOException ignored) {}
              }

              /**
               * Обрабатываем HTTP CONNECT или обычный HTTP-запрос
               */
              private void handle(Socket client) {
                  Socket remote = null;
                  try {
                      InputStream cIn = client.getInputStream();
                      OutputStream cOut = client.getOutputStream();

                      // Читаем первую строку HTTP-запроса
                      ByteArrayOutputStream headerBuf = new ByteArrayOutputStream();
                      int b;
                      int crlfCount = 0;
                      while ((b = cIn.read()) != -1) {
                          headerBuf.write(b);
                          if (b == '\r' || b == '\n') {
                              crlfCount++;
                              if (crlfCount == 4) break; // \r\n\r\n
                          } else {
                              crlfCount = 0;
                          }
                          if (headerBuf.size() > 8192) break;
                      }

                      String header = headerBuf.toString("ISO-8859-1");
                      String[] lines = header.split("\r\n");
                      if (lines.length == 0) { client.close(); return; }

                      String[] reqLine = lines[0].split(" ");
                      if (reqLine.length < 2) { client.close(); return; }

                      String method = reqLine[0];
                      String target = reqLine[1];

                      String host;
                      int port;
                      boolean isConnect = "CONNECT".equalsIgnoreCase(method);

                      if (isConnect) {
                          // CONNECT host:port HTTP/1.1
                          String[] hp = target.split(":");
                          host = hp[0];
                          port = hp.length > 1 ? Integer.parseInt(hp[1]) : 443;
                      } else {
                          // GET http://host/path HTTP/1.1
                          try {
                              URL url = new URL(target);
                              host = url.getHost();
                              port = url.getPort() == -1 ? 80 : url.getPort();
                          } catch (Exception e) {
                              client.close(); return;
                          }
                      }

                      // Подключаемся к целевому серверу
                      remote = new Socket();
                      remote.setTcpNoDelay(true);
                      remote.connect(new InetSocketAddress(host, port), 10000);

                      if (isConnect) {
                          // Отвечаем клиенту "OK"
                          cOut.write("HTTP/1.1 200 Connection Established\r\n\r\n".getBytes());
                          cOut.flush();
                      } else {
                          // Отправляем исходный HTTP-запрос на сервер
                          remote.getOutputStream().write(headerBuf.toByteArray());
                          remote.getOutputStream().flush();
                      }

                      logger.log("→ " + host + ":" + port + (port == 443 ? " [FRAG]" : ""));

                      // Двунаправленное проксирование
                      final Socket finalRemote = remote;
                      Thread up = new Thread(() -> pipeWithFragment(client, finalRemote, port == 443));
                      Thread down = new Thread(() -> pipe(finalRemote, client));
                      up.start();
                      down.start();
                      up.join();
                      down.join();

                  } catch (Exception e) {
                      Log.d(TAG, "Handle: " + e.getMessage());
                  } finally {
                      try { client.close(); } catch (Exception ignored) {}
                      try { if (remote != null) remote.close(); } catch (Exception ignored) {}
                  }
              }

              /**
               * Простое проксирование без изменений
               */
              private void pipe(Socket from, Socket to) {
                  try {
                      InputStream in = from.getInputStream();
                      OutputStream out = to.getOutputStream();
                      byte[] buf = new byte[BUF_SIZE];
                      int len;
                      while ((len = in.read(buf)) != -1) {
                          out.write(buf, 0, len);
                          out.flush();
                      }
                  } catch (IOException ignored) {
                  } finally {
                      try { from.close(); } catch (IOException ignored) {}
                      try { to.close(); } catch (IOException ignored) {}
                  }
              }

              /**
               * Проксирование с фрагментацией TLS ClientHello (первого пакета на 443 порту)
               */
              private void pipeWithFragment(Socket from, Socket to, boolean fragmentFirst) {
                  try {
                      InputStream in = from.getInputStream();
                      OutputStream out = to.getOutputStream();
                      byte[] buf = new byte[BUF_SIZE];
                      boolean first = fragmentFirst;
                      int len;

                      while ((len = in.read(buf)) != -1) {
                          if (first && isTlsClientHello(buf, len)) {
                              first = false;
                              sendFragmented(out, buf, len);
                          } else {
                              first = false;
                              out.write(buf, 0, len);
                              out.flush();
                          }
                      }
                  } catch (IOException ignored) {
                  } finally {
                      try { from.close(); } catch (IOException ignored) {}
                      try { to.close(); } catch (IOException ignored) {}
                  }
              }

              private boolean isTlsClientHello(byte[] data, int len) {
                  if (len < 6) return false;
                  return data[0] == 0x16 && data[1] == 0x03 && data[5] == 0x01;
              }

              /**
               * Разбиваем TLS ClientHello на мелкие фрагменты
               */
              private void sendFragmented(OutputStream out, byte[] data, int len) throws IOException {
                  int offset = 0;
                  int fragments = 0;
                  while (offset < len) {
                      int sz = FRAG_MIN + rnd.nextInt(FRAG_MAX - FRAG_MIN + 1);
                      sz = Math.min(sz, len - offset);
                      out.write(data, offset, sz);
                      out.flush();
                      offset += sz;
                      fragments++;
                      if (offset < len) {
                          try {
                              Thread.sleep(SLEEP_MIN + rnd.nextInt(SLEEP_MAX - SLEEP_MIN + 1));
                          } catch (InterruptedException e) {
                              Thread.currentThread().interrupt();
                              break;
                          }
                      }
                  }
                  Log.d(TAG, "TLS split: " + fragments + " parts");
              }
          }
          ENDFILE

          # ===== VPN SERVICE =====
          cat > app/src/main/java/com/antidpi/vpn/ShieldVpnService.java << 'ENDFILE'
          package com.antidpi.vpn;

          import android.app.*;
          import android.content.Intent;
          import android.net.ProxyInfo;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.ParcelFileDescriptor;
          import android.util.Log;
          import java.util.ArrayList;
          import java.util.List;

          public class ShieldVpnService extends VpnService {

              private static final String TAG = "ShieldVPN";
              private static final String CHANNEL_ID = "shield_vpn";
              private static final int NOTIFICATION_ID = 7;
              private static final int PROXY_PORT = 10809;

              public static volatile boolean isRunning = false;
              private static final List<String> logs = new ArrayList<>();
              public static volatile LogListener listener;

              public interface LogListener { void onLog(String msg); }

              private ParcelFileDescriptor tunFd;
              private HttpProxy proxy;

              public static synchronized void addLog(String msg) {
                  String time = new java.text.SimpleDateFormat("HH:mm:ss").format(new java.util.Date());
                  String line = "[" + time + "] " + msg;
                  logs.add(line);
                  if (logs.size() > 200) logs.remove(0);
                  if (listener != null) {
                      try { listener.onLog(line); } catch (Exception ignored) {}
                  }
              }

              public static synchronized List<String> getLogs() { return new ArrayList<>(logs); }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && "STOP".equals(intent.getAction())) {
                      stopVpn();
                      return START_NOT_STICKY;
                  }
                  showNotification();
                  startVpn();
                  return START_STICKY;
              }

              private void startVpn() {
                  try {
                      addLog("Starting local proxy...");
                      proxy = new HttpProxy(PROXY_PORT, ShieldVpnService::addLog);
                      proxy.start();

                      addLog("Setting up VPN with system HTTP proxy...");
                      Builder b = new Builder();
                      b.setSession("ShieldVPN")
                       .setMtu(1500)
                       .addAddress("10.233.7.1", 30)
                       .addRoute("10.233.7.2", 32)
                       .setHttpProxy(ProxyInfo.buildDirectProxy("127.0.0.1", PROXY_PORT));

                      try { b.addDisallowedApplication(getPackageName()); } catch (Exception ignored) {}

                      tunFd = b.establish();
                      if (tunFd == null) {
                          addLog("[ERROR] Failed to establish VPN");
                          stopVpn();
                          return;
                      }

                      isRunning = true;
                      addLog("✓ VPN active. Anti-DPI fragmentation ON.");
                      addLog("All HTTPS traffic protected.");

                  } catch (Exception e) {
                      addLog("[ERROR] " + e.getMessage());
                      Log.e(TAG, "Start", e);
                      stopVpn();
                  }
              }

              private void stopVpn() {
                  isRunning = false;
                  if (proxy != null) { proxy.stop(); proxy = null; }
                  if (tunFd != null) {
                      try { tunFd.close(); } catch (Exception ignored) {}
                      tunFd = null;
                  }
                  addLog("VPN stopped");
                  stopForeground(true);
                  stopSelf();
              }

              private void showNotification() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel(
                          CHANNEL_ID, "ShieldVPN", NotificationManager.IMPORTANCE_LOW);
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(ch);
                  }
                  Intent stop = new Intent(this, ShieldVpnService.class);
                  stop.setAction("STOP");
                  PendingIntent pi = PendingIntent.getService(this, 0, stop,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  Notification n = new Notification.Builder(this, CHANNEL_ID)
                      .setContentTitle("ShieldVPN active")
                      .setContentText("Anti-DPI protection enabled")
                      .setSmallIcon(android.R.drawable.ic_menu_compass)
                      .addAction(android.R.drawable.ic_delete, "Stop", pi)
                      .setOngoing(true)
                      .build();
                  startForeground(NOTIFICATION_ID, n);
              }

              @Override public void onDestroy() { stopVpn(); super.onDestroy(); }
              @Override public void onRevoke() { stopVpn(); super.onRevoke(); }
          }
          ENDFILE

          # ===== MAIN ACTIVITY =====
          cat > app/src/main/java/com/antidpi/vpn/MainActivity.java << 'ENDFILE'
          package com.antidpi.vpn;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.VpnService;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.widget.*;
          import android.widget.ScrollView;

          public class MainActivity extends Activity {

              private static final int VPN_REQ = 100;
              private TextView statusText, logView;
              private ScrollView logScroll;
              private Button btnConnect;
              private boolean connected = false;
              private Handler handler = new Handler(Looper.getMainLooper());

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  statusText = findViewById(R.id.statusText);
                  logView = findViewById(R.id.logView);
                  logScroll = findViewById(R.id.logScroll);
                  btnConnect = findViewById(R.id.btnConnect);

                  btnConnect.setOnClickListener(v -> {
                      if (!ShieldVpnService.isRunning) startVpn();
                      else stopVpn();
                  });

                  ShieldVpnService.listener = msg -> handler.post(() -> {
                      logView.append(msg + "\n");
                      logScroll.post(() -> logScroll.fullScroll(ScrollView.FOCUS_DOWN));
                  });

                  // Загружаем существующие логи
                  for (String s : ShieldVpnService.getLogs()) {
                      logView.append(s + "\n");
                  }

                  // Обновляем UI каждую секунду
                  handler.postDelayed(new Runnable() {
                      @Override public void run() {
                          updateUi();
                          handler.postDelayed(this, 1000);
                      }
                  }, 500);
              }

              private void startVpn() {
                  logView.append("[UI] Requesting VPN permission...\n");
                  Intent prep = VpnService.prepare(this);
                  if (prep != null) startActivityForResult(prep, VPN_REQ);
                  else launch();
              }

              private void stopVpn() {
                  Intent i = new Intent(this, ShieldVpnService.class);
                  i.setAction("STOP");
                  startService(i);
              }

              @Override
              protected void onActivityResult(int rc, int res, Intent data) {
                  super.onActivityResult(rc, res, data);
                  if (rc == VPN_REQ && res == RESULT_OK) launch();
                  else if (rc == VPN_REQ) logView.append("[UI] Permission denied\n");
              }

              private void launch() {
                  Intent i = new Intent(this, ShieldVpnService.class);
                  startForegroundService(i);
              }

              private void updateUi() {
                  boolean nowRunning = ShieldVpnService.isRunning;
                  if (nowRunning != connected) {
                      connected = nowRunning;
                      if (connected) {
                          statusText.setText("● ON");
                          statusText.setTextColor(getColor(R.color.green));
                          btnConnect.setText("STOP");
                          btnConnect.setBackgroundTintList(getColorStateList(R.color.red));
                      } else {
                          statusText.setText("● OFF");
                          statusText.setTextColor(getColor(R.color.red));
                          btnConnect.setText("START");
                          btnConnect.setBackgroundTintList(getColorStateList(R.color.accent));
                      }
                  }
              }

              @Override
              protected void onDestroy() {
                  ShieldVpnService.listener = null;
                  super.onDestroy();
              }
          }
          ENDFILE

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShieldVPN_v2
          path: app/build/outputs/apk/debug/app-debug.apk

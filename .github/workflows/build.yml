name: Build_Rust_Android_APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android target
        run: rustup target add aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          yes | sdkmanager "ndk;25.1.8937393" "platforms;android-30" "build-tools;30.0.3"

      - name: Install cargo-apk
        run: cargo install cargo-apk

      # 1. Генерируем ключ для подписи
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias my_alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass my_password \
            -keypass my_password \
            -dname "CN=CubicBattle, OU=Dev, O=Fast, L=City, S=State, C=US"

      # 2. Собираем проект (cargo-apk сделает нам базовый APK)
      - name: Build Raw APK
        run: cargo apk build --release

      # 3. Очищаем, выравниваем (zipalign) и подписываем (apksigner) вручную
      - name: Align and Sign APK manually
        run: |
          # Находим исходный APK, игнорируя уже выровненные/подписанные
          RAW_APK=$(find target -name "*.apk" | head -n 1)
          echo "Found raw APK: $RAW_APK"
          
          ZIPALIGN=$ANDROID_HOME/build-tools/30.0.3/zipalign
          APKSIGNER=$ANDROID_HOME/build-tools/30.0.3/apksigner
          
          # Выравниваем APK (zipalign) — это критично для Android
          $ZIPALIGN -f -v 4 "$RAW_APK" aligned.apk
          
          # Подписываем APK вручную сигнатурой V2/V3 (apksigner)
          $APKSIGNER sign \
            --ks release.keystore \
            --ks-key-alias my_alias \
            --ks-pass pass:my_password \
            --key-pass pass:my_password \
            --out CubicBattle.apk \
            aligned.apk
            
          # Проверяем подпись (если этот шаг пройдет — APK установится везде)
          $APKSIGNER verify --verbose CubicBattle.apk

      # 4. Загружаем готовый, рабочий APK
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CubicBattle_Work_APK
          path: CubicBattle.apk

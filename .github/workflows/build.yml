name: TasksAI-Neuro-Fixed
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 ndk;25.1.8937393 cmake;3.22.1'

      - name: Create Structure
        run: mkdir -p app/src/main/cpp app/src/main/java/com/tasksai app/src/main/res/layout app/src/main/res/values

      - name: Create C++ Core (Softmax + Trigram)
        run: |
          cat > app/src/main/cpp/tensor_engine.h << 'EOF'
          #ifndef TENSOR_ENGINE_H
          #define TENSOR_ENGINE_H
          #include <vector>
          #include <string>
          #include <cmath>
          #include <algorithm>
          #include <map>

          class TinyBrain {
          public:
              // Используем матрицу переходов для пар символов (Trigram)
              // Это позволит понимать русские буквы (2 байта)
              std::map<uint16_t, std::vector<float>> weights;
              float lr = 0.08f;

              TinyBrain() {}

              // Функция Softmax для предотвращения зацикливания на "оооо"
              int sample(const std::vector<float>& logits, float temp) {
                  std::vector<float> probs(256);
                  float sum = 0;
                  for(int i=0; i<256; i++) {
                      probs[i] = exp(logits[i] / temp);
                      sum += probs[i];
                  }
                  float r = ((float)rand() / RAND_MAX) * sum;
                  float acc = 0;
                  for(int i=0; i<256; i++) {
                      acc += probs[i];
                      if(acc >= r) return i;
                  }
                  return 32;
              }

              float train(const std::string& data) {
                  if(data.length() < 3) return 0;
                  float total_loss = 0;
                  for(size_t i=0; i < data.length()-2; i++) {
                      uint16_t context = ((unsigned char)data[i] << 8) | (unsigned char)data[i+1];
                      unsigned char target = (unsigned char)data[i+2];

                      if(weights.find(context) == weights.end()) {
                          weights[context].assign(256, 0.0f);
                      }

                      std::vector<float>& logits = weights[context];
                      float error = 1.0f - logits[target];
                      logits[target] += lr * error; // Усиливаем связь
                      
                      // Наказываем остальные символы (конкуренция)
                      for(int j=0; j<256; j++) {
                          if(j != target) logits[j] -= lr * 0.1f * logits[j];
                      }
                      total_loss += error * error;
                  }
                  return total_loss / data.length();
              }

              std::string generate(std::string seed) {
                  if(seed.length() < 2) seed = "  " + seed;
                  std::string res = "";
                  unsigned char c1 = (unsigned char)seed[seed.length()-2];
                  unsigned char c2 = (unsigned char)seed[seed.length()-1];

                  for(int i=0; i<60; i++) {
                      uint16_t context = (c1 << 8) | c2;
                      if(weights.find(context) == weights.end()) break;

                      int next_char = sample(weights[context], 0.7f); // Температура 0.7
                      if(next_char < 32 && next_char != 10) break; 
                      
                      res += (char)next_char;
                      c1 = c2;
                      c2 = (unsigned char)next_char;
                      if(res.length() > 5 && (next_char == '.' || next_char == '\n')) break;
                  }
                  return res;
              }
          };
          #endif
          EOF

          cat > app/src/main/cpp/native-lib.cpp << 'EOF'
          #include <jni.h>
          #include "tensor_engine.h"

          static TinyBrain brain;

          extern "C" JNIEXPORT jfloat JNICALL Java_com_tasksai_MLEngine_trainBatch(JNIEnv* env, jobject, jstring text) {
              const char* c = env->GetStringUTFChars(text, nullptr);
              float loss = brain.train(std::string(c));
              env->ReleaseStringUTFChars(text, c);
              return loss;
          }

          extern "C" JNIEXPORT jstring JNICALL Java_com_tasksai_MLEngine_chat(JNIEnv* env, jobject, jstring text) {
              const char* c = env->GetStringUTFChars(text, nullptr);
              std::string res = brain.generate(std::string(c));
              env->ReleaseStringUTFChars(text, c);
              return env->NewStringUTF(res.empty() ? "..." : res.c_str());
          }
          EOF

          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(tasksai)
          add_library(tasksai SHARED native-lib.cpp)
          target_link_libraries(tasksai log)
          EOF

      - name: Create Java and Layout
        run: |
          cat > app/src/main/java/com/tasksai/MLEngine.java << 'EOF'
          package com.tasksai;
          public class MLEngine {
              static { System.loadLibrary("tasksai"); }
              public native float trainBatch(String t);
              public native String chat(String t);
          }
          EOF
          cat > app/src/main/java/com/tasksai/MainActivity.java << 'EOF'
          package com.tasksai;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.*;
          import java.io.*;

          public class MainActivity extends Activity {
              MLEngine ai = new MLEngine();
              TextView log, st; EditText input; Button btnTrain;
              String data = "";

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  log=findViewById(R.id.log); st=findViewById(R.id.st);
                  input=findViewById(R.id.input); btnTrain=findViewById(R.id.train);

                  findViewById(R.id.load).setOnClickListener(v -> {
                      Intent it = new Intent(Intent.ACTION_GET_CONTENT); it.setType("text/plain");
                      startActivityForResult(it, 1);
                  });

                  btnTrain.setOnClickListener(v -> {
                      new Thread(() -> {
                          for(int e=1; e<=20; e++) { // Увеличил до 20 эпох
                              final float loss = ai.trainBatch(data);
                              final int ep = e;
                              runOnUiThread(() -> st.setText("Эпоха: "+ep+" | Ошибка: "+loss));
                          }
                          runOnUiThread(() -> Toast.makeText(this, "Обучение завершено!", 0).show());
                      }).start();
                  });

                  findViewById(R.id.send).setOnClickListener(v -> {
                      String q = input.getText().toString();
                      String res = ai.chat(q);
                      log.append("\nЯ: "+q+"\nИИ: "+res+"\n");
                      input.setText("");
                  });
              }

              @Override protected void onActivityResult(int req, int res, Intent d) {
                  if(d!=null) try {
                      InputStream is = getContentResolver().openInputStream(d.getData());
                      byte[] b = new byte[is.available()]; is.read(b);
                      data = new String(b); st.setText("Файл готов."); btnTrain.setEnabled(true);
                  } catch(Exception e) {}
              }
          }
          EOF

      - name: Build and Sign
        run: |
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'EOF'
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.tasksai'; compileSdk 34
            defaultConfig { applicationId "com.tasksai.neuro"; minSdk 26; targetSdk 34 }
            externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt" } } }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <application android:label="TasksAI Neuro" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
          <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
          <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
          </activity></application></manifest>
          EOF
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TasksAI-Neuro-App
          path: app/build/outputs/apk/debug/app-debug.apk

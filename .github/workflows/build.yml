name: TasksAI Smart Guess Pro (Transformer Edition)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 ndk;25.1.8937393 cmake;3.22.1'

      - name: Create Folders
        run: mkdir -p app/src/main/cpp app/src/main/java/com/aetherai app/src/main/res/layout app/src/main/res/drawable app/src/main/res/values

      - name: Create C++ Core (Neural Transformer Engine)
        run: |
          cat > app/src/main/cpp/ggml_core.h << 'EOF'
          #ifndef GGML_CORE_H
          #define GGML_CORE_H
          #include <vector>
          #include <string>
          #include <map>
          #include <cmath>
          #include <algorithm>
          #include <random>

          class OmniEngine {
          public:
              std::map<std::string, int> vocab;
              std::vector<std::string> id_to_word;
              std::vector<int> stream;
              std::mt19937 gen;

              OmniEngine() : gen(std::random_device{}()) {}

              int get_id(std::string w) {
                  if (vocab.count(w)) return vocab[w];
                  int id = vocab.size();
                  vocab[w] = id;
                  id_to_word.push_back(w);
                  return id;
              }

              // Умный поиск ID (fuzzy matching)
              int find_closest_id(std::string unknown_word) {
                  if (vocab.count(unknown_word)) return vocab[unknown_word];
                  int best_id = 0; float max_sim = -1.0f;
                  for(int i=0; i < (int)id_to_word.size(); i++) {
                      float sim = 0;
                      for(char c : unknown_word) if(id_to_word[i].find(c) != std::string::npos) sim++;
                      sim /= (float)(unknown_word.length() + id_to_word[i].length());
                      if(sim > max_sim) { max_sim = sim; best_id = i; }
                  }
                  return best_id;
              }

              std::string inference(const std::vector<int>& query) {
                  if (stream.empty()) return "Система пуста. Загрузите датасет (JSONL/TXT).";
                  
                  // СИМУЛЯЦИЯ ATTENTION (ПОИСК КОНТЕКСТНОГО ОКНА)
                  int best_pos = -1;
                  float max_score = -1.0f;

                  for (size_t i = 0; i < stream.size() - query.size(); i++) {
                      float current_score = 0;
                      for (size_t j = 0; j < query.size(); j++) {
                          if (stream[i + j] == query[j]) current_score += 1.0f;
                      }
                      // Добавляем случайность (Температура)
                      current_score += (float)(gen() % 100) / 500.0f; 

                      if (current_score > max_score) {
                          max_score = current_score;
                          best_pos = (int)i;
                      }
                  }

                  if (best_pos == -1) return "Я не нашел похожих структур в памяти.";

                  // ГЕНЕРАЦИЯ ОТВЕТА (ПРОДОЛЖЕНИЕ ПОСЛЕДОВАТЕЛЬНОСТИ)
                  std::string res = "";
                  int start_idx = best_pos + query.size();
                  for (size_t i = start_idx; i < start_idx + 300 && i < stream.size(); i++) {
                      std::string w = id_to_word[stream[i]];
                      if (w == "u:" || w == "{" || w == "}") break; 
                      res += w + " ";
                  }
                  return res;
              }
          };
          #endif
          EOF

          cat > app/src/main/cpp/aetherai_jni.cpp << 'EOF'
          #include <jni.h>
          #include <string>
          #include <vector>
          #include <sstream>
          #include <algorithm>
          #include "ggml_core.h"

          static OmniEngine engine;

          extern "C" JNIEXPORT void JNICALL Java_com_aetherai_AIEngine_addText(JNIEnv* env, jobject, jstring text) {
              const char* c = env->GetStringUTFChars(text, nullptr);
              std::stringstream ss(c); std::string w;
              while(ss >> w) {
                  // Сохраняем регистр для кода
                  engine.stream.push_back(engine.get_id(w));
              }
              env->ReleaseStringUTFChars(text, c);
          }

          extern "C" JNIEXPORT jint JNICALL Java_com_aetherai_AIEngine_getTokens(JNIEnv* env, jobject) {
              return (jint)engine.stream.size();
          }

          extern "C" JNIEXPORT jstring JNICALL Java_com_aetherai_AIEngine_generate(JNIEnv* env, jobject, jstring input) {
              const char* c = env->GetStringUTFChars(input, nullptr);
              std::stringstream ss(c); std::string w;
              std::vector<int> q_tokens;
              while(ss >> w) q_tokens.push_back(engine.find_closest_id(w));
              std::string res = engine.inference(q_tokens);
              env->ReleaseStringUTFChars(input, c);
              return env->NewStringUTF(res.c_str());
          }
          EOF

          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(aetherai)
          add_library(aetherai SHARED aetherai_jni.cpp)
          target_link_libraries(aetherai log)
          EOF

      - name: Create Java UI (Multi-File Training)
        run: |
          cat > app/src/main/java/com/aetherai/AIEngine.java << 'EOF'
          package com.aetherai;
          public class AIEngine { static { System.loadLibrary("aetherai"); }
          public native void addText(String t); public native int getTokens();
          public native String generate(String input); }
          EOF
          
          cat > app/src/main/java/com/aetherai/MainActivity.java << 'EOF'
          package com.aetherai;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.Intent;
          import android.os.Bundle;
          import android.view.*;
          import android.widget.*;
          import java.io.*;

          public class MainActivity extends Activity {
          AIEngine ai = new AIEngine(); LinearLayout chat; EditText input; TextView st; ScrollView scroll;
          @Override protected void onCreate(Bundle savedInstanceState) {
          super.onCreate(savedInstanceState);
          setContentView(createUI());
          new Thread(() -> { /* Warmup */ }).start(); }

          private View createUI() {
              LinearLayout root = new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL); root.setBackgroundColor(0xFF0D1117);
              LinearLayout h = new LinearLayout(this); h.setPadding(20,20,20,20); h.setBackgroundColor(0xFF161B22);
              st = new TextView(this); st.setText("TasksAI: 0 tokens"); st.setTextColor(0xFF58A6FF);
              Button bL = new Button(this); bL.setText("FILES"); bL.setOnClickListener(v -> {
                  Intent it = new Intent(Intent.ACTION_GET_CONTENT); it.setType("*/*"); it.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true); startActivityForResult(it, 1);
              });
              h.addView(st); h.addView(bL); root.addView(h);
              scroll = new ScrollView(this); chat = new LinearLayout(this); chat.setOrientation(LinearLayout.VERTICAL);
              scroll.addView(chat); root.addView(scroll, new LinearLayout.LayoutParams(-1, 0, 1));
              LinearLayout b = new LinearLayout(this); input = new EditText(this); input.setHint("Ask or Command...");
              input.setTextColor(-1); b.addView(input, new LinearLayout.LayoutParams(0, -2, 1));
              Button s = new Button(this); s.setText("RUN"); s.setOnClickListener(v -> {
                  String q = input.getText().toString(); addM("User", q);
                  new Thread(() -> { String res = ai.generate(q); runOnUiThread(() -> addM("AI", res)); }).start();
                  input.setText("");
              });
              b.addView(s); root.addView(b); return root;
          }

          private void addM(String u, String t) {
              TextView tv = new TextView(this); tv.setText(u + ": " + t); tv.setTextColor(u.equals("AI") ? 0xFFC9D1D9 : 0xFF79C0FF);
              tv.setPadding(20,10,20,10); chat.addView(tv); scroll.post(() -> scroll.fullScroll(View.FOCUS_DOWN));
          }

          @Override protected void onActivityResult(int req, int res, Intent d) {
              if (d != null) { new Thread(() -> { try {
                  if (d.getClipData() != null) {
                      ClipData cd = d.getClipData();
                      for (int i=0; i<cd.getItemCount(); i++) load(cd.getItemAt(i).getUri());
                  } else load(d.getData());
                  runOnUiThread(() -> st.setText("Knowledge: " + ai.getTokens() + " tokens"));
              } catch (Exception e) {} }).start(); }
          }
          private void load(android.net.Uri u) throws Exception {
              InputStream is = getContentResolver().openInputStream(u);
              BufferedReader br = new BufferedReader(new InputStreamReader(is));
              String l; while ((l = br.readLine()) != null) ai.addText(l + " ");
          } }
          EOF

      - name: Final Build
        run: |
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'EOF'
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.aetherai'; compileSdk 34
          defaultConfig { applicationId "com.tasksai.transformer"; minSdk 26; targetSdk 34; ndk { abiFilters 'arm64-v8a' } }
          externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt" } } }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <application android:label="TasksAI Transformer" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
          <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
          <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
          </activity></application></manifest>
          EOF
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TasksAI-Transformer-Pro
          path: app/build/outputs/apk/debug/app-debug.apk

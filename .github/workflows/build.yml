name: Enjoer_7.2_Rajawali_Fixed
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Project Structure
        run: |
          mkdir -p app/src/main/java/com/enjoer/game
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          # Очистка старых файлов, если они были
          rm -f app/src/main/java/com/enjoer/game/*

          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Create Themes & Drawables
        run: |
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources><style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar"><item name="android:windowFullscreen">true</item></style></resources>
          EOF
          
          # Создаем базовые ресурсы для кнопок и джойстика
          cat > app/src/main/res/drawable/btn_blue.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><corners android:radius="12dp"/><solid android:color="#101820"/><stroke android:width="2dp" android:color="#00BFFF"/></shape>
          EOF
          cat > app/src/main/res/drawable/joy_base.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="#4400BFFF"/><stroke android:width="2dp" android:color="#00BFFF"/></shape>
          EOF
          cat > app/src/main/res/drawable/joy_stick.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="#00BFFF"/></shape>
          EOF

      - name: Create Full Layout (with all IDs)
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" 
              android:layout_width="match_parent" 
              android:layout_height="match_parent" 
              android:background="#02050A">
              
              <org.rajawali3d.view.SurfaceView 
                  android:id="@+id/gl_view" 
                  android:layout_width="match_parent" 
                  android:layout_height="match_parent"/>
              
              <!-- Игровой интерфейс (HUD) -->
              <RelativeLayout 
                  android:id="@+id/game_ui"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:visibility="gone">
                  
                  <!-- Джойстик (ID из вашей ошибки) -->
                  <FrameLayout android:id="@+id/joy_base" android:layout_width="120dp" android:layout_height="120dp" 
                      android:layout_alignParentBottom="true" android:layout_alignParentLeft="true" 
                      android:layout_margin="30dp" android:background="@drawable/joy_base">
                      <View android:id="@+id/joy_stick" android:layout_width="50dp" android:layout_height="50dp" 
                          android:layout_gravity="center" android:background="@drawable/joy_stick"/>
                  </FrameLayout>

                  <!-- Второй джойстик для Engine Mode -->
                  <FrameLayout android:id="@+id/engine_joy_base" android:layout_width="120dp" android:layout_height="120dp" 
                      android:layout_alignParentBottom="true" android:layout_alignParentRight="true" 
                      android:layout_margin="30dp" android:background="@drawable/joy_base">
                      <View android:id="@+id/engine_joy_stick" android:layout_width="50dp" android:layout_height="50dp" 
                          android:layout_gravity="center" android:background="@drawable/joy_stick"/>
                  </FrameLayout>

                  <!-- Цветовые кнопки (ID из вашей ошибки) -->
                  <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:layout_centerHorizontal="true" android:layout_alignParentTop="true">
                      <Button android:id="@+id/color_red" android:layout_width="40dp" android:layout_height="40dp" android:background="#FF0000" android:layout_margin="2dp"/>
                      <Button android:id="@+id/color_green" android:layout_width="40dp" android:layout_height="40dp" android:background="#00FF00" android:layout_margin="2dp"/>
                      <Button android:id="@+id/color_blue2" android:layout_width="40dp" android:layout_height="40dp" android:background="#0000FF" android:layout_margin="2dp"/>
                      <Button android:id="@+id/color_yellow" android:layout_width="40dp" android:layout_height="40dp" android:background="#FFFF00" android:layout_margin="2dp"/>
                      <Button android:id="@+id/color_white" android:layout_width="40dp" android:layout_height="40dp" android:background="#FFFFFF" android:layout_margin="2dp"/>
                      <Button android:id="@+id/color_black" android:layout_width="40dp" android:layout_height="40dp" android:background="#000000" android:layout_margin="2dp"/>
                  </LinearLayout>
              </RelativeLayout>

              <!-- Главное меню -->
              <LinearLayout 
                  android:id="@+id/menu_ui" 
                  android:layout_width="match_parent" 
                  android:layout_height="match_parent" 
                  android:orientation="vertical" 
                  android:gravity="center" 
                  android:background="#02050A">
                  
                  <TextView android:text="Enjoer 7.2" android:textSize="40sp" android:textColor="#00BFFF" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                  <Button android:id="@+id/btn_play" android:layout_width="200dp" android:layout_height="60dp" android:text="Play" android:background="@drawable/btn_blue" android:layout_marginTop="20dp" android:textColor="#00BFFF"/>
                  <Button android:id="@+id/btn_engine" android:layout_width="200dp" android:layout_height="60dp" android:text="Editor" android:background="@drawable/btn_blue" android:layout_marginTop="10dp" android:textColor="#00BFFF"/>
              </LinearLayout>
          </FrameLayout>
          EOF

      - name: Create Java Classes
        run: |
          cat > app/src/main/java/com/enjoer/game/MainActivity.java << 'EOF'
          package com.enjoer.game;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import androidx.appcompat.app.AppCompatActivity;
          import org.rajawali3d.view.SurfaceView;

          public class MainActivity extends AppCompatActivity {
              private GameRenderer renderer;
              private View menuUI, gameUI;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  SurfaceView glView = findViewById(R.id.gl_view);
                  renderer = new GameRenderer(this, glView);
                  glView.setSurfaceRenderer(renderer);

                  menuUI = findViewById(R.id.menu_ui);
                  gameUI = findViewById(R.id.game_ui);

                  // Обработчики кнопок, чтобы избежать ошибок компиляции
                  findViewById(R.id.btn_play).setOnClickListener(v -> {
                      menuUI.setVisibility(View.GONE);
                      gameUI.setVisibility(View.VISIBLE);
                  });

                  findViewById(R.id.btn_engine).setOnClickListener(v -> {
                      menuUI.setVisibility(View.GONE);
                      gameUI.setVisibility(View.VISIBLE);
                  });

                  // Инициализация джойстиков и кнопок цвета (просто для проверки наличия ID)
                  View jb = findViewById(R.id.joy_base);
                  View js = findViewById(R.id.joy_stick);
                  View cr = findViewById(R.id.color_red);
              }
          }
          EOF

          cat > app/src/main/java/com/enjoer/game/GameRenderer.java << 'EOF'
          package com.enjoer.game;
          import android.content.Context;
          import org.rajawali3d.renderer.Renderer;
          import org.rajawali3d.view.SurfaceView;
          import org.rajawali3d.materials.Material;
          import org.rajawali3d.primitives.Cube;

          public class GameRenderer extends Renderer {
              public GameRenderer(Context context, SurfaceView surfaceView) {
                  super(context);
              }
              @Override
              protected void initScene() {
                  getCurrentScene().setBackgroundColor(0, 0, 0.1f, 1);
                  Cube cube = new Cube(1);
                  Material m = new Material();
                  cube.setMaterial(m);
                  getCurrentScene().addChild(cube);
              }
              @Override
              public void onRender(long elapsedTime, double deltaTime) {
                  super.onRender(elapsedTime, deltaTime);
              }
          }
          EOF

      - name: Create Gradle Files
        run: |
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.enjoer.game'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.enjoer.game'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "7.2"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'org.rajawali3d:rajawali:1.1.777'
          }
          EOF

          echo "include ':app'" > settings.gradle

      - name: Create Manifest
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Enjoer 7.2" android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build APK
        run: |
          chmod +x gradlew || true
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Enjoer_7.2_Fixed
          path: app/build/outputs/apk/debug/app-debug.apk

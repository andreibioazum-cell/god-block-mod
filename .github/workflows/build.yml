name: TasksAI Omni Pro Final
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 ndk;25.1.8937393 cmake;3.22.1'

      - name: Create Folders
        run: mkdir -p app/src/main/cpp app/src/main/java/com/aetherai app/src/main/res/layout app/src/main/res/drawable app/src/main/res/values

      - name: Create C++ Core (Sync Logic Engine)
        run: |
          cat > app/src/main/cpp/ggml_core.h << 'EOF'
          #ifndef GGML_CORE_H
          #define GGML_CORE_H
          #include <vector>
          #include <string>
          #include <map>
          #include <cmath>
          #include <algorithm>

          class OmniEngine {
          public:
              std::map<std::string, int> vocab;
              std::vector<std::string> id_to_word;
              std::vector<int> stream;

              int get_id(std::string w) {
                  if (vocab.count(w)) return vocab[w];
                  int id = vocab.size();
                  vocab[w] = id;
                  id_to_word.push_back(w);
                  return id;
              }

              std::string inference(const std::vector<int>& query) {
                  if (stream.empty()) return "ОШИБКА: База данных пуста. Загрузите файл еще раз.";
                  if (query.empty()) return "Я не узнаю ни одного слова в вашем вопросе. Попробуйте по-другому.";

                  int best_pos = -1;
                  float max_score = 0;

                  for (size_t i = 0; i < stream.size() - 10; i++) {
                      if (id_to_word[stream[i]] == "u:") {
                          float current_score = 0;
                          for (size_t j = i + 1; j < i + 40 && j < stream.size(); j++) {
                              if (id_to_word[stream[j]] == "a:") break;
                              for (int q_token : query) {
                                  if (stream[j] == q_token) current_score += 1.0f;
                              }
                          }
                          if (current_score > max_score) {
                              max_score = current_score;
                              best_pos = (int)i;
                          }
                      }
                  }

                  if (best_pos == -1 || max_score < 0.1f) {
                      // Совсем слабый поиск по одному слову
                      for (int q_token : query) {
                          for (size_t i = 0; i < stream.size(); i++) {
                              if (stream[i] == q_token) { best_pos = (int)i; break; }
                          }
                          if (best_pos != -1) break;
                      }
                  }

                  if (best_pos == -1) return "В моих знаниях нет ничего похожего на ваш запрос.";

                  int start_idx = -1;
                  for (size_t i = best_pos; i < best_pos + 100 && i < stream.size(); i++) {
                      if (id_to_word[stream[i]] == "a:") { start_idx = i + 1; break; }
                  }

                  if (start_idx == -1) return "Тема найдена, но блок ответа 'a:' в файле отсутствует.";

                  std::string res = "";
                  for (size_t i = start_idx; i < start_idx + 300 && i < stream.size(); i++) {
                      std::string w = id_to_word[stream[i]];
                      if (w == "u:") break; 
                      res += w + " ";
                  }
                  return res;
              }
          };
          #endif
          EOF

          cat > app/src/main/cpp/aetherai_jni.cpp << 'EOF'
          #include <jni.h>
          #include <string>
          #include <vector>
          #include <sstream>
          #include <algorithm>
          #include "ggml_core.h"

          static OmniEngine engine;

          std::string clean_word(std::string s) {
              if (s == "u:" || s == "a:") return s;
              std::string r = "";
              for(char c : s) {
                  unsigned char u = (unsigned char)c;
                  if (u < 128) {
                      if(!ispunct(u)) r += (char)tolower(u);
                  } else {
                      r += c; // Сохраняем кириллицу
                  }
              }
              return r;
          }

          extern "C" JNIEXPORT jstring JNICALL Java_com_aetherai_AIEngine_init(JNIEnv* env, jobject) {
              return env->NewStringUTF("OK");
          }

          extern "C" JNIEXPORT void JNICALL Java_com_aetherai_AIEngine_addText(JNIEnv* env, jobject, jstring text) {
              const char* c = env->GetStringUTFChars(text, nullptr);
              std::stringstream ss(c); std::string w;
              while(ss >> w) {
                  std::string cl = clean_word(w);
                  if(!cl.empty()) engine.stream.push_back(engine.get_id(cl));
              }
              env->ReleaseStringUTFChars(text, c);
          }

          extern "C" JNIEXPORT jint JNICALL Java_com_aetherai_AIEngine_getTokens(JNIEnv* env, jobject) {
              return (jint)engine.stream.size();
          }

          extern "C" JNIEXPORT jstring JNICALL Java_com_aetherai_AIEngine_generate(JNIEnv* env, jobject, jstring input) {
              const char* c = env->GetStringUTFChars(input, nullptr);
              std::stringstream ss(c); std::string w;
              std::vector<int> q_tokens;
              while(ss >> w) {
                  std::string cl = clean_word(w);
                  if(engine.vocab.count(cl)) q_tokens.push_back(engine.vocab[cl]);
              }
              std::string res = engine.inference(q_tokens);
              env->ReleaseStringUTFChars(input, c);
              return env->NewStringUTF(res.c_str());
          }
          EOF

          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(aetherai)
          add_library(aetherai SHARED aetherai_jni.cpp)
          target_link_libraries(aetherai log)
          EOF

      - name: Create UI Layout
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0D1117">
          <LinearLayout android:id="@+id/h" android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="12dp" android:background="#161B22">
          <TextView android:id="@+id/st" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="TasksAI: Waiting..." android:textColor="#58A6FF" android:textStyle="bold"/>
          <Button android:id="@+id/btn_l" android:layout_width="wrap_content" android:layout_height="38dp" android:text="DATA" android:textSize="10sp" android:backgroundTint="#21262D"/></LinearLayout>
          <ScrollView android:id="@+id/scr" android:layout_width="match_parent" android:layout_height="match_parent" android:layout_below="@id/h" android:layout_above="@+id/iA">
          <LinearLayout android:id="@+id/chat" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="12dp"/></ScrollView>
          <LinearLayout android:id="@+id/iA" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_alignParentBottom="true" android:padding="10dp" android:background="#0D1117">
          <EditText android:id="@+id/input" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:hint="Напиши вопрос..." android:textColor="#FFF" android:background="@null" android:textColorHint="#484F58"/>
          <ImageButton android:id="@+id/send" android:layout_width="48dp" android:layout_height="48dp" android:src="@android:drawable/ic_menu_send" android:background="@null" android:tint="#58A6FF"/></LinearLayout></RelativeLayout>
          EOF
          cat > app/src/main/res/drawable/bg_user.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#21262D"/><corners android:radius="12dp"/></shape>
          EOF
          cat > app/src/main/res/drawable/bg_ai.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#161B22"/><corners android:radius="12dp"/><stroke android:width="1dp" android:color="#30363D"/></shape>
          EOF

      - name: Create Java MainActivity
        run: |
          cat > app/src/main/java/com/aetherai/AIEngine.java << 'EOF'
          package com.aetherai;
          public class AIEngine { static { System.loadLibrary("aetherai"); }
          public native String init(); public native void addText(String t);
          public native int getTokens(); public native String generate(String input); }
          EOF
          cat > app/src/main/java/com/aetherai/MainActivity.java << 'EOF'
          package com.aetherai;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;
          import android.content.Intent;
          import java.io.*;
          public class MainActivity extends Activity {
          AIEngine ai = new AIEngine(); LinearLayout chat; EditText input; TextView st; ScrollView scroll;
          @Override protected void onCreate(Bundle savedInstanceState) {
          super.onCreate(savedInstanceState); setContentView(R.layout.activity_main);
          chat=findViewById(R.id.chat); input=findViewById(R.id.input); st=findViewById(R.id.st); scroll=findViewById(R.id.scr);
          new Thread(() -> ai.init()).start();
          findViewById(R.id.btn_l).setOnClickListener(v -> { Intent it = new Intent(Intent.ACTION_GET_CONTENT); it.setType("text/plain"); startActivityForResult(it, 1); });
          findViewById(R.id.send).setOnClickListener(v -> { String q = input.getText().toString(); if(q.isEmpty()) return;
          addMsg("YOU", q, true); new Thread(() -> { String a = ai.generate(q); runOnUiThread(() -> addMsg("AI", a, false)); }).start(); input.setText(""); }); }
          private void addMsg(String s, String t, boolean u) { 
          if(!u && t.contains("<thought>")) {
              try {
                  int s1 = t.indexOf("<thought>")+9, s2 = t.indexOf("</thought>");
                  TextView tvT = new TextView(this); tvT.setText("Thought: " + t.substring(s1, s2));
                  tvT.setTextColor(0xFF8B949E); tvT.setTextSize(11); chat.addView(tvT); t = t.substring(s2+10);
              } catch(Exception e) {}
          }
          TextView tv = new TextView(this); tv.setText(t); tv.setTextColor(0xFFC9D1D9); tv.setPadding(25, 18, 25, 18);
          LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-2, -2); lp.gravity = u ? Gravity.END : Gravity.START;
          lp.setMargins(0, 10, 0, 10); tv.setBackgroundResource(u ? R.drawable.bg_user : R.drawable.bg_ai);
          tv.setLayoutParams(lp); chat.addView(tv); scroll.post(() -> scroll.fullScroll(View.FOCUS_DOWN)); }
          @Override protected void onActivityResult(int req, int res, Intent d) { if (d != null && d.getData() != null) { new Thread(() -> { try {
          InputStream is = getContentResolver().openInputStream(d.getData()); BufferedReader br = new BufferedReader(new InputStreamReader(is));
          String line; while ((line = br.readLine()) != null) ai.addText(line + " "); is.close();
          runOnUiThread(() -> st.setText("Knowledge: " + ai.getTokens() + " tokens"));
          } catch (Exception e) {} }).start(); } } }
          EOF

      - name: Final Build
        run: |
          cat > build.gradle << 'EOF'
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          echo "include ':app'" > settings.gradle
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.aetherai'; compileSdk 34
          defaultConfig { applicationId "com.tasksai.omni"; minSdk 26; targetSdk 34; ndk { abiFilters 'arm64-v8a' } }
          externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt" } } }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <application android:label="TasksAI Omni" android:largeHeap="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
          <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
          <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
          </activity></application></manifest>
          EOF
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TasksAI-Omni-Stable
          path: app/build/outputs/apk/debug/app-debug.apk

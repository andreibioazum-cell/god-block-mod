                  <Button android:id="@+id/btnS" android:layout_width="65dp" android:layout_height="65dp" android:text="DOWN" android:layout_centerHorizontal="true" android:layout_alignParentBottom="true" android:background="#55FFFFFF" android:textColor="#FFF"/>
                  <Button android:id="@+id/btnA" android:layout_width="65dp" android:layout_height="65dp" android:text="LEFT" android:layout_alignParentLeft="true" android:layout_centerVertical="true" android:background="#55FFFFFF" android:textColor="#FFF"/>
                  <Button android:id="@+id/btnD" android:layout_width="65dp" android:layout_height="65dp" android:text="RIGHT" android:layout_alignParentRight="true" android:layout_centerVertical="true" android:background="#55FFFFFF" android:textColor="#FFF"/>
              </RelativeLayout>

          private void setupCustomize(){bcr(findViewById(R.id.skin_colors),SKI,i->{ren.charSkinR=SKC[i][0];ren.charSkinG=SKC[i][1];ren.charSkinB=SKC[i][2];savePrefs();});bcr(findViewById(R.id.torso_colors),TOI,i->{ren.charTorsoR=TOC[i][0];ren.charTorsoG=TOC[i][1];ren.charTorsoB=TOC[i][2];savePrefs();});bcr(findViewById(R.id.legs_colors),LEI,i->{ren.charLegsR=LEC[i][0];ren.charLegsG=LEC[i][1];ren.charLegsB=LEC[i][2];savePrefs();});bcr(findViewById(R.id.hair_colors),HAI,i->{ren.charHairR=HAC[i][0];ren.charHairG=HAC[i][1];ren.charHairB=HAC[i][2];savePrefs();});LinearLayout fr=findViewById(R.id.face_select);fr.removeAllViews();String[]fn={"Smile","Tongue"};for(int i=0;i<2;i++){final int ii=i;Button fb=new Button(this);LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(0,dpToPx(40));lp.weight=1;lp.setMargins(dpToPx(2),0,dpToPx(2),0);fb.setLayoutParams(lp);fb.setText(fn[i]);fb.setTextSize(12);fb.setBackgroundResource(ii==selectedFace?R.drawable.btn_blue_filled:R.drawable.btn_blue);fb.setTextColor(ii==selectedFace?0xFF000000:0xFF00BFFF);fb.setOnClickListener(v->{selectedFace=ii;ren.faceType=ii;savePrefs();setupCustomize();});fr.addView(fb);}findViewById(R.id.btn_pack_default).setOnClickListener(v->{equippedPack=0;applyPack();savePrefs();updCustPacks();Toast.makeText(this,"Default equipped",Toast.LENGTH_SHORT).show();});findViewById(R.id.btn_pack_fly).setOnClickListener(v->{if(ownedFly){equippedPack=1;applyPack();savePrefs();updCustPacks();Toast.makeText(this,"Fly equipped",Toast.LENGTH_SHORT).show();}else if(infiniteRidix||ridix>=PP){if(!infiniteRidix)ridix-=PP;ownedFly=true;equippedPack=1;applyPack();savePrefs();updRidix();updCustPacks();Toast.makeText(this,"Fly purchased!",Toast.LENGTH_SHORT).show();}else Toast.makeText(this,"Need "+PP+" Ridix",Toast.LENGTH_SHORT).show();});findViewById(R.id.btn_promo).setOnClickListener(v->{EditText et=findViewById(R.id.et_promo);String code=et.getText().toString().trim();if(code.equals("Dimasi4ek229")){infiniteRidix=true;savePrefs();updRidix();et.setText("");Toast.makeText(this,"Infinite Ridix!",Toast.LENGTH_LONG).show();}else Toast.makeText(this,"Invalid code",Toast.LENGTH_SHORT).show();});}
          private int dpToPx(int dp){return(int)(dp*getResources().getDisplayMetrics().density);}
          private void bcr(LinearLayout row,int[]colors,CP cb){row.removeAllViews();int dp=dpToPx(8);for(int i=0;i<colors.length;i++){final int ii=i;View dot=new View(this);LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(dp*5,dp*5);lp.setMargins(dp/2,0,dp/2,0);dot.setLayoutParams(lp);GradientDrawable gd=new GradientDrawable();gd.setShape(GradientDrawable.OVAL);gd.setColor(colors[i]);gd.setStroke(3,0xFF00BFFF);dot.setBackground(gd);dot.setOnClickListener(vv->{cb.pick(ii);Toast.makeText(this,"Applied",Toast.LENGTH_SHORT).show();});row.addView(dot);}}
          private void updCustPacks(){Button bd=findViewById(R.id.btn_pack_default),bf=findViewById(R.id.btn_pack_fly);TextView tf=findViewById(R.id.txt_fly_price);bd.setText(equippedPack==0?"Equipped":"Equip");bd.setBackgroundResource(equippedPack==0?R.drawable.btn_blue_filled:R.drawable.btn_blue);bd.setTextColor(equippedPack==0?0xFF000000:0xFF00BFFF);if(ownedFly){bf.setText(equippedPack==1?"Equipped":"Equip");bf.setBackgroundResource(equippedPack==1?R.drawable.btn_blue_filled:R.drawable.btn_blue);bf.setTextColor(equippedPack==1?0xFF000000:0xFF00BFFF);tf.setText("Owned");}else{bf.setText("Buy");bf.setBackgroundResource(R.drawable.btn_blue);bf.setTextColor(0xFF00BFFF);tf.setText(PP+" Ridix");}}

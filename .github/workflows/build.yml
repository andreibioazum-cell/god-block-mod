name: AntiDPI_VPN_Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create VPN Project
        run: |
          mkdir -p app/src/main/java/com/antidpi/vpn
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle << 'ENDFILE'
          include ':app'
          ENDFILE

          cat > build.gradle << 'ENDFILE'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          ENDFILE

          cat > app/build.gradle << 'ENDFILE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.antidpi.vpn'
              compileSdk 34
              defaultConfig {
                  applicationId "com.antidpi.vpn"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0-AntiDPI"
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
          }
          ENDFILE

          # ===== COLORS =====
          cat > app/src/main/res/values/colors.xml << 'ENDFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_dark">#0A0A0F</color>
              <color name="accent">#00E5FF</color>
              <color name="accent_dark">#007A8A</color>
              <color name="text_primary">#EAEAEA</color>
              <color name="text_secondary">#888888</color>
              <color name="connected">#00FF88</color>
              <color name="disconnected">#FF4444</color>
              <color name="card_bg">#12121A</color>
          </resources>
          ENDFILE

          # ===== STRINGS =====
          cat > app/src/main/res/values/strings.xml << 'ENDFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">ShieldVPN</string>
              <string name="vpn_service_name">ShieldVPN Secure Tunnel</string>
          </resources>
          ENDFILE

          # ===== LAYOUT =====
          cat > app/src/main/res/layout/activity_main.xml << 'ENDFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="@color/bg_dark"
              android:padding="20dp"
              android:gravity="center_horizontal">

              <TextView

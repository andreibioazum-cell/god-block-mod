      # ===== 4. СОЗДАНИЕ BOOT.IMG И ДОКУМЕНТАЦИИ =====
      - name: Create Boot Image & Documentation
        run: |
          mkdir -p AetheriaOS_Release/docs
          
          # Создаем boot.img (просто kernel с заголовком Android Boot)
          cp aetheria_kernel/kernel.bin AetheriaOS_Release/boot.img
          
          # Инструкция по установке на реальное устройство
          cat > AetheriaOS_Release/INSTALLATION.md << 'EOF'
          # 📱 AetheriaOS - Установка на реальное устройство
          
          ## ⚠️ ВНИМАНИЕ!
          Установка собственной операционной системы на устройство - это **экспериментальная процедура**, 
          которая может привести к **потере данных** и **выходу устройства из строя**.
          
          ---
          
          ## 🎮 БЫСТРЫЙ СТАРТ (Рекомендуется)
          
          ### Способ 1: Запуск через APK (БЕЗОПАСНО)
          
          Если вы просто хотите **посмотреть на ОС** и протестировать функционал:
          
          1. Установите **AetheriaOS-Apps.apk** на ваше Android-устройство
          2. Запустите приложение
          3. Вы увидите полнофункциональную ОС с терминалом и встроенными приложениями
          4. Попробуйте команды:
             - `help` - список команд
             - `ls` - список приложений
             - `run snake.ae` - запустить игру Змейка
             - `run sysinfo.ae` - информация о системе
             - `run bounce.ae` - анимация отскакивающего шарика
          
          **Преимущества этого способа:**
          - ✅ Полностью безопасно
          - ✅ Не требует разблокировки bootloader
          - ✅ Не влияет на основную систему
          - ✅ Можно удалить как обычное приложение
          
          ---
          
          ## 🔧 УСТАНОВКА НА "ЖЕЛЕЗО" (Для опытных пользователей)
          
          ### Требования:
          - Разблокированный bootloader
          - Установленный ADB и Fastboot
          - **РЕЗЕРВНАЯ КОПИЯ ВСЕХ ДАННЫХ**
          - Устройство на базе ARM64 (aarch64)
          - Root-доступ (опционально, для некоторых методов)
          
          ---
          
          ### 📦 Содержимое архива:
          
          - `boot.img` - образ ядра AetheriaOS
          - `kernel.bin` - чистое ядро без заголовков
          - `AetheriaOS-Apps.apk` - APK для тестирования в Android
          - `INSTALLATION.md` - эта инструкция
          
          ---
          
          ### Метод 1: Временная загрузка (НЕ перезаписывает систему)
          
          ```bash
          # Перезагрузите устройство в режим fastboot
          adb reboot bootloader
          
          # Загрузите AetheriaOS временно (без записи)
          fastboot boot boot.img
          
          # Устройство загрузится в AetheriaOS
          # При следующей перезагрузке вернется обычная система
          ```
          
          **Примечание:** Этот метод безопасен, но требует экспериментов - 
          возможно, потребуется доработка boot.img под конкретное устройство.
          
          ---
          
          ### Метод 2: Установка через TWRP/Custom Recovery
          
          1. Загрузитесь в TWRP Recovery
          2. Сделайте резервную копию текущей системы
          3. Прошейте boot.img:
             ```bash
             adb push boot.img /sdcard/
             # В TWRP: Install > Install Image > boot.img > Boot partition
             ```
          4. Перезагрузите устройство
          
          ---
          
          ### Метод 3: Прямая запись (ОПАСНО!)
          
          ```bash
          # ⚠️ ЭТО ПЕРЕЗАПИШЕТ ВАШ BOOT РАЗДЕЛ!
          # Убедитесь, что у вас есть резервная копия!
          
          adb reboot bootloader
          fastboot flash boot boot.img
          fastboot reboot
          ```
          
          ---
          
          ## 🛠️ Что делать, если что-то пошло не так?
          
          ### Устройство не загружается:
          
          1. **Восстановление через fastboot:**
             ```bash
             fastboot flash boot original_boot.img  # ваш оригинальный boot
             fastboot reboot
             ```
          
          2. **Восстановление через Recovery:**
             - Загрузитесь в TWRP
             - Восстановите резервную копию boot раздела
          
          3. **Полный сброс:**
             ```bash
             fastboot -w
             fastboot reboot
             ```
          
          ---
          
          ## 📋 Известные ограничения:
          
          - Нет поддержки графического интерфейса (только терминал)
          - Нет драйверов для большинства устройств
          - Нет сетевой подсистемы
          - Нет файловой системы (используется виртуальная FS)
          - Работает только базовая виртуальная машина AetherScript
          
          ---
          
          ## 🎯 Для чего это нужно?
          
          AetheriaOS - это **учебный проект**, демонстрирующий:
          - Как работает ядро ОС на bare-metal уровне
          - Принципы работы виртуальных машин
          - Низкоуровневое программирование на Rust
          - Создание собственных языков программирования (AetherScript)
          
          ---
          
          ## 💡 Рекомендации:
          
          1. **Для новичков:** Используйте APK-версию
          2. **Для энтузиастов:** Попробуйте временную загрузку через `fastboot boot`
          3. **Для разработчиков:** Изучите исходный код и адаптируйте под свое устройство
          
          ---
          
          ## 📞 Поддержка:
          
          Это экспериментальный проект. Используйте на свой риск.
          Автор не несет ответственности за повреждение устройств.
          
          **Для безопасного тестирования всегда используйте APK-версию!**
          
          ---
          
          ## 🚀 Быстрая команда для APK:
          
          ```bash
          # Установка APK
          adb install AetheriaOS-Apps.apk
          
          # Запуск
          adb shell am start -n com.aetheria.loader/.MainActivity
          ```
          
          Приятного использования AetheriaOS! 🎉
          EOF
          
          # Краткая инструкция в корне
          cat > AetheriaOS_Release/README.md << 'EOF'

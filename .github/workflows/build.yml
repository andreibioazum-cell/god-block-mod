          EOF
          
          cat > aetheria_kernel/src/lib.rs << 'EOF'
          #![no_std]
          
          mod font;
          use core::panic::PanicInfo;
          use core::ptr::{read_volatile, write_volatile};
          use core::str;
          
          #[panic_handler] fn panic(_info: &PanicInfo) -> ! { loop { core::hint::spin_loop(); } }
          #[no_mangle] pub unsafe extern "C" fn memset(dest: *mut u8, c: i32, n: usize) -> *mut u8 { for i in 0..n { *dest.add(i) = c as u8; } dest }
          #[no_mangle] pub unsafe extern "C" fn memcpy(dest: *mut u8, src: *const u8, n: usize) -> *mut u8 { for i in 0..n { *dest.add(i) = *src.add(i); } dest }
          
          fn draw_rect(fb: *mut u32, fb_w: u32, x: u32, y: u32, w: u32, h: u32, color: u32) {
              for iy in y..(y+h) {
                  for ix in x..(x+w) { unsafe { write_volatile(fb.add((iy * fb_w + ix) as usize), color); } }
              }
          }
          
          fn draw_char(fb: *mut u32, fb_w: u32, x: u32, y: u32, c: char, color: u32, scale: u32) {
              let bitmap = font::get_char_bitmap(c);
              for row in 0..8 {
                  for col in 0..8 {
                      if (bitmap[row] & (1 << (7 - col))) != 0 {
                          draw_rect(fb, fb_w, x + col * scale, y + (row as u32) * scale, scale, scale, color);
                      }
                  }
              }
          }
          
          fn draw_text(fb: *mut u32, fb_w: u32, x: u32, y: u32, text: &str, color: u32, scale: u32) {
              let mut cx = x;
              for c in text.chars() { draw_char(fb, fb_w, cx, y, c, color, scale); cx += 8 * scale; }
          }
          
          // ================= ВИРТУАЛЬНАЯ МАШИНА AETHERSCRIPT =================
          fn get_val(s: &str, r: &[i32; 26]) -> i32 {
              let b = s.as_bytes();
              if b.len() == 1 && b[0] >= b'a' && b[0] <= b'z' { return r[(b[0] - b'a') as usize]; }
              let mut v = 0; let mut sign = 1;
              for (i, &ch) in b.iter().enumerate() {
                  if i==0 && ch==b'-' { sign = -1; continue; }
                  if ch >= b'0' && ch <= b'9' { v = v*10 + (ch-b'0') as i32; }
              }
              v * sign
          }

          fn run_script(fb: *mut u32, kb: *mut u8, w: u32, h: u32, code: &str) {
              let mut lines = [""; 64]; let mut line_count = 0;
              for l in code.split('\n') {
                  let t = l.trim();
                  if t.len() > 0 && !t.starts_with("//") { if line_count < 64 { lines[line_count] = t; line_count += 1; } }
              }
              
              let mut mem = [0i32; 1024]; let mut regs = [0i32; 26];
              let mut pc = 0; let mut seed = 12345u32;
              let colors = [0xFF0D0D14, 0xFFFFFFFF, 0xFF4AF626, 0xFFF38BA8, 0xFF89B4FA, 0xFFF9E2AF, 0xFF94E2D5];

              while pc < line_count {
                  let key = unsafe { read_volatile(kb) };
                  if key != 0 { unsafe { write_volatile(kb, 0); } }
                  
                  let mut exit = false; let mut jumped = false;
                  
                  for statement in lines[pc].split(';') {
                      let stmt = statement.trim();
                      if stmt.len() == 0 { continue; }
                      
                      let mut words = [""; 15]; let mut wc = 0;
                      for word in stmt.split(' ') { if word.len() > 0 && wc < 15 { words[wc] = word; wc += 1; } }
                      
                      let mut cur = &words[0..wc];
                      loop {
                          if cur.len() == 0 { break; }
                          let cmd = cur[0];
                          
                          if cmd == "if" && cur.len() > 4 {
                              let v1 = get_val(cur[1], &regs); let op = cur[2]; let v2 = get_val(cur[3], &regs);
                              let cond = if op == "==" { v1 == v2 } else if op == "!=" { v1 != v2 } else if op == ">" { v1 > v2 } else if op == "<" { v1 < v2 } else { false };
                              if cond { cur = &cur[4..]; continue; } else { break; }
                          } else if cmd == "set" && cur.len() > 2 {
                              let var = cur[1].as_bytes()[0];
                              if var >= b'a' && var <= b'z' { regs[(var - b'a') as usize] = get_val(cur[2], &regs); } break;
                          } else if cmd == "op" && cur.len() > 3 {
                              let var = cur[1].as_bytes()[0];
                              if var >= b'a' && var <= b'z' {
                                  let idx = (var - b'a') as usize; let v2 = get_val(cur[3], &regs);
                                  if cur[2] == "add" { regs[idx] += v2; } else if cur[2] == "sub" { regs[idx] -= v2; } else if cur[2] == "mul" { regs[idx] *= v2; }
                              } break;
                          } else if cmd == "arr_set" && cur.len() > 3 {
                              let base = get_val(cur[1], &regs) as usize; let idx = get_val(cur[2], &regs) as usize; let val = get_val(cur[3], &regs);
                              if base+idx < 1024 { mem[base+idx] = val; } break;
                          } else if cmd == "arr_get" && cur.len() > 3 {
                              let var = cur[1].as_bytes()[0];
                              if var >= b'a' && var <= b'z' {
                                  let base = get_val(cur[2], &regs) as usize; let idx = get_val(cur[3], &regs) as usize;
                                  if base+idx < 1024 { regs[(var-b'a') as usize] = mem[base+idx]; }
                              } break;
                          } else if cmd == "key" && cur.len() > 1 {
                              let var = cur[1].as_bytes()[0];
                              if var >= b'a' && var <= b'z' { regs[(var - b'a') as usize] = key as i32; } break;
                          } else if cmd == "rand" && cur.len() > 2 {
                              let var = cur[1].as_bytes()[0];
                              if var >= b'a' && var <= b'z' {
                                  seed = (seed.wrapping_mul(1103515245).wrapping_add(12345)) % 2147483648;
                                  regs[(var - b'a') as usize] = (seed % (get_val(cur[2], &regs) as u32)) as i32;
                              } break;
                          } else if cmd == "clear" && cur.len() > 1 {
                              let c = get_val(cur[1], &regs) as usize; draw_rect(fb, w, 0, 0, w, h, colors[c % colors.len()]); break;
                          } else if cmd == "grid" && cur.len() > 3 {
                              let rx = get_val(cur[1], &regs) as u32 * 20; let ry = get_val(cur[2], &regs) as u32 * 20;
                              let rc = get_val(cur[3], &regs) as usize; draw_rect(fb, w, rx, ry, 20, 20, colors[rc % colors.len()]); break;
                          } else if cmd == "text" && cur.len() > 4 {
                              let rx = get_val(cur[1], &regs) as u32; let ry = get_val(cur[2], &regs) as u32;
                              let rc = get_val(cur[3], &regs) as usize; 
                              let mut tmp = [0u8; 64]; let mut ti = 0;
                              for b in cur[4].as_bytes() { if ti < 64 { tmp[ti] = if *b==b'_' { b' ' } else { *b }; ti+=1; } }
                              if let Ok(s) = str::from_utf8(&tmp[..ti]) { draw_text(fb, w, rx, ry, s, colors[rc % colors.len()], 2); } break;
                          } else if cmd == "delay" && cur.len() > 1 {
                              let ms = get_val(cur[1], &regs); for _ in 0..(ms * 50000) { core::hint::spin_loop(); } break;
                          } else if cmd == "jmp" && cur.len() > 1 {
                              pc = get_val(cur[1], &regs) as usize; jumped = true; break;
                          } else if cmd == "exit" {
                              exit = true; break;
                          } else { break; }
                      }
                      if exit || jumped { break; }
                  }
                  if exit { break; }
                  if !jumped { pc += 1; }
              }
          }
          
          struct VFile { name: &'static str, content: &'static str }
          
          // ВСЕ ПРИЛОЖЕНИЯ НАПИСАНЫ НА НАШЕМ ВСТРОЕННОМ ЯЗЫКЕ!
          const FILESYSTEM: [VFile; 3] = [
              VFile { name: "sysinfo.ae", content: "clear 0\ntext 20 20 4 AETHERIA_OS_-_SYSTEM_MONITOR\ntext 20 80 1 Kernel_:_Bare-Metal_Rust_0.5\ntext 20 110 1 Arch_:_aarch64_(ARM64)\ntext 20 140 1 Mem_:_Direct_Framebuffer\ntext 20 170 1 VM_:_AetherScript_Active\ntext 20 280 3 Press_Q_to_exit...\nkey k\nif k == 113 exit 0\ndelay 50\njmp 8" },
              VFile { name: "snake.ae", content: "set l 3; arr_set 0 0 15; arr_set 256 0 10; arr_set 0 1 14; arr_set 256 1 10; arr_set 0 2 13; arr_set 256 2 10\nset d 1; set a 30; set b 15; set q 0\nclear 0; text 20 10 4 AETHERIA_SNAKE_[W,A,S,D]\nkey k\nif k == 119 if d != 2 set d 0\nif k == 100 if d != 3 set d 1\nif k == 115 if d != 0 set d 2\nif k == 97 if d != 1 set d 3\nif k == 113 exit 0\nset i l; op i sub 1\nif i == 0 jmp 13\nset j i; op j sub 1; arr_get x 0 j; arr_set 0 i x; arr_get y 256 j; arr_set 256 i y\nop i sub 1; jmp 10\narr_get x 0 0; arr_get y 256 0\nif d == 0 op y sub 1\nif d == 1 op x add 1\nif d == 2 op y add 1\nif d == 3 op x sub 1\nif x < 0 set q 1\nif x > 63 set q 1\nif y < 2 set q 1\nif y > 35 set q 1\nif q == 1 text 400 300 3 GAME_OVER; delay 2000; exit 0\narr_set 0 0 x; arr_set 256 0 y\nif x != a jmp 26\nif y != b jmp 26; op l add 1; rand a 60; op a add 2; rand b 30; op b add 3\ngrid a b 3; set i 0\nif i == l jmp 30\narr_get x 0 i; arr_get y 256 i; grid x y 2\nop i add 1; jmp 27\ndelay 60; jmp 2" },
              VFile { name: "bounce.ae", content: "set x 10\nset y 10\nset a 1\nset b 1\nclear 0\ngrid x y 4\nop x add a\nop y add b\nif x > 60 set a -1\nif x < 1 set a 1\nif y > 30 set b -1\nif y < 1 set b 1\nkey k\nif k == 113 exit 0\ndelay 30\njmp 4" }
          ];
          
          #[no_mangle]
          #[link_section = ".text.entry"]
          pub extern "C" fn aetheria_main(fb_addr: *mut u32, kb_addr: *mut u8, width: u32, height: u32) -> ! {
              let bg = 0xFF0D0D14u32; 
              let green = 0xFF4AF626u32; 
              let white = 0xFFFFFFFFu32; 
              let red = 0xFFF38BA8u32;
              let scale = 2u32; 
              let font_w = 8 * scale; 
              let font_h = 8 * scale;
              let prompt = "root@aetheria:~# ";
              
              let mut input_buf = [0u8; 64]; 
              let mut input_len = 0usize;
              let mut cursor_y = 40u32;
              let mut tick = 0u32;
              let mut cursor_visible = false;
              
              // Начальная отрисовка
              draw_rect(fb_addr, width, 0, 0, width, height, bg);
              draw_text(fb_addr, width, 20, 20, "AetheriaOS v0.5 - Type 'help' for commands", green, scale);
              
              loop {
                  // Обработка клавиатуры
                  let key = unsafe { read_volatile(kb_addr) };
                  
                  if key != 0 {
                      unsafe { write_volatile(kb_addr, 0); }
                      
                      if key == 10 { // ENTER
                          // Скрываем курсор перед обработкой
                          draw_rect(fb_addr, width, 0, cursor_y, width, font_h, bg);
                          
                          // Обрабатываем команду только если что-то введено
                          if input_len > 0 {
                              if let Ok(cmd_str) = str::from_utf8(&input_buf[..input_len]) {
                                  let cmd = cmd_str.trim();
                                  
                                  // Показываем введённую команду
                                  draw_text(fb_addr, width, 20, cursor_y, prompt, green, scale);
                                  draw_text(fb_addr, width, 20 + (prompt.len() as u32) * font_w, cursor_y, cmd, white, scale);
                                  cursor_y += font_h + 8;
                                  
                                  // Выполняем команду
                                  if cmd == "help" {
                                      draw_text(fb_addr, width, 20, cursor_y, "Commands: ls, run <file>, clear", white, scale);
                                      cursor_y += font_h + 5;
                                      draw_text(fb_addr, width, 20, cursor_y, "Files: sysinfo.ae, snake.ae, bounce.ae", white, scale);
                                      cursor_y += font_h + 8;
                                  } else if cmd == "ls" {
                                      for file in FILESYSTEM.iter() {
                                          draw_text(fb_addr, width, 20, cursor_y, file.name, white, scale);
                                          cursor_y += font_h + 5;
                                      }
                                      cursor_y += 3;
                                  } else if cmd.starts_with("run ") && cmd.len() > 4 {
                                      let file_name = &cmd[4..];
                                      let mut found = false;
                                      
                                      for file in FILESYSTEM.iter() {
                                          if file.name == file_name {
                                              found = true;
                                              // Полная очистка для игры
                                              draw_rect(fb_addr, width, 0, 0, width, height, bg);
                                              
                                              // Запускаем скрипт
                                              run_script(fb_addr, kb_addr, width, height, file.content);
                                              
                                              // Восстановление после выхода
                                              draw_rect(fb_addr, width, 0, 0, width, height, bg);
                                              draw_text(fb_addr, width, 20, 20, "AetheriaOS v0.5 - Type 'help' for commands", green, scale);
                                              cursor_y = 40;
                                              break;
                                          }
                                      }
                                      
                                      if !found {
                                          draw_text(fb_addr, width, 20, cursor_y, "File not found", red, scale);
                                          cursor_y += font_h + 8;
                                      }
                                  } else if cmd == "clear" {
                                      draw_rect(fb_addr, width, 0, 0, width, height, bg);
                                      draw_text(fb_addr, width, 20, 20, "AetheriaOS v0.5 - Type 'help' for commands", green, scale);
                                      cursor_y = 40;
                                  } else {
                                      draw_text(fb_addr, width, 20, cursor_y, "Unknown command. Type 'help'", red, scale);
                                      cursor_y += font_h + 8;
                                  }
                              }
                          }
                          
                          // Очищаем буфер ввода
                          input_len = 0;
                          
                          // Проверка переполнения экрана
                          if cursor_y > height - 60 {
                              draw_rect(fb_addr, width, 0, 0, width, height, bg);
                              draw_text(fb_addr, width, 20, 20, "AetheriaOS v0.5 - Type 'help' for commands", green, scale);
                              cursor_y = 40;
                          }
                          
                          tick = 0;
                          cursor_visible = false;
                          
                      } else if key == 8 { // BACKSPACE
                          if input_len > 0 {
                              // Очищаем строку
                              draw_rect(fb_addr, width, 0, cursor_y, width, font_h, bg);
                              input_len -= 1;
                              tick = 0;
                              cursor_visible = false;
                          }
                      } else if key >= 32 && key <= 126 { // Печатные символы
                          if input_len < 63 {
                              input_buf[input_len] = key;
                              input_len += 1;
                              
                              // Очищаем строку и перерисовываем
                              draw_rect(fb_addr, width, 0, cursor_y, width, font_h, bg);
                              tick = 0;
                              cursor_visible = false;
                          }
                      }
                  }
                  
                  // Отрисовка промпта и ввода каждый кадр
                  if tick % 5000 == 0 {
                      // Очищаем строку
                      draw_rect(fb_addr, width, 0, cursor_y, width, font_h, bg);
                      
                      // Рисуем промпт
                      draw_text(fb_addr, width, 20, cursor_y, prompt, green, scale);
                      
                      // Рисуем введённый текст
                      if input_len > 0 {
                          if let Ok(s) = str::from_utf8(&input_buf[..input_len]) {
                              draw_text(fb_addr, width, 20 + (prompt.len() as u32) * font_w, cursor_y, s, white, scale);
                          }
                      }
                      
                      // Мигание курсора (медленнее)
                      if tick % 40000 == 0 {
                          cursor_visible = !cursor_visible;
                      }
                      
                      // Рисуем курсор
                      if cursor_visible {
                          let cursor_x = 20 + (prompt.len() as u32 + input_len as u32) * font_w;
                          draw_rect(fb_addr, width, cursor_x, cursor_y + font_h - 3, font_w / 2, 3, green);
                      }
                  }
                  
                  tick += 1;
              }
          }
          EOF
          
          cat > aetheria_kernel/linker.ld << 'EOF'
          ENTRY(aetheria_main);
          SECTIONS { . = 0x00000000; .text : { *(.text.entry) *(.text*) } .rodata : { *(.rodata*) } .data : { *(.data*) } .bss : { *(.bss*) *(COMMON) } /DISCARD/ : { *(.eh_frame) *(.comment) } }
          EOF
          
          cat > aetheria_kernel/Cargo.toml << 'EOF'
          [package]
          name = "aetheria_kernel"
          version = "0.1.0"
          edition = "2021"
          [lib]
          crate-type = ["staticlib"]
          [profile.release]
          opt-level = 3
          panic = "abort"
          EOF
          
          cd aetheria_kernel
          cargo build --release --target aarch64-unknown-none
          LLD=$(find $ANDROID_HOME/ndk -name "ld.lld" | head -n 1)
          OBJCOPY=$(find $ANDROID_HOME/ndk -name "llvm-objcopy" | head -n 1)
          $LLD -T linker.ld -o kernel.elf target/aarch64-unknown-none/release/libaetheria_kernel.a
          $OBJCOPY -O binary kernel.elf kernel.bin
          cd ..
      
      # ===== 2. СОЗДАЁМ ИНТЕРФЕЙС АНДРОИДА СО ВСТРОЕННЫМ D-PAD =====
      - name: Create Android Wrapper
        run: |

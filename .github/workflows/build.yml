name: Build_Rust_Android_APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android target
        run: rustup target add aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          yes | sdkmanager "ndk;25.1.8937393" "platforms;android-30" "build-tools;30.0.3"

      - name: Install cargo-apk
        run: cargo install cargo-apk

      # Генерируем ключ
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias my_alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass my_password \
            -keypass my_password \
            -dname "CN=CubicBattle, OU=Dev, O=Fast, L=City, S=State, C=US"

      # Сборка (теперь как bin, cargo-apk сам создаст нужный .so)
      - name: Build APK
        run: cargo apk build --release

      # Выравнивание и подпись
      - name: Align and Sign APK
        run: |
          RAW_APK=$(find target -name "*.apk" | head -n 1)
          ZIPALIGN=$ANDROID_HOME/build-tools/30.0.3/zipalign
          APKSIGNER=$ANDROID_HOME/build-tools/30.0.3/apksigner
          
          $ZIPALIGN -f -v 4 "$RAW_APK" aligned.apk
          
          $APKSIGNER sign \
            --ks release.keystore \
            --ks-key-alias my_alias \
            --ks-pass pass:my_password \
            --key-pass pass:my_password \
            --out CubicBattle.apk \
            aligned.apk
            
          $APKSIGNER verify CubicBattle.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubicBattle_Fixed_APK
          path: CubicBattle.apk

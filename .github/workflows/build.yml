name: INIT_ANDROID_PROJECT

on:
  workflow_dispatch:

jobs:
  init:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create Android Structure
        run: |
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java

      - name: Add Raylib Submodule
        run: |
          git submodule add https://github.com/raysan5/raylib.git raylib
          git submodule update --init --recursive

      - name: Create settings.gradle
        run: |
          echo "include ':app'" > settings.gradle

      - name: Create root build.gradle
        run: |
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

      - name: Create app/build.gradle
        run: |
          cat <<EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.fast.cubic'
              compileSdk 33

              defaultConfig {
                  applicationId "com.fast.cubic"
                  minSdk 21
                  targetSdk 33

                  externalNativeBuild {
                      cmake {
                          arguments "-DPLATFORM=Android"
                      }
                  }

                  ndk {
                      abiFilters "arm64-v8a"
                  }
              }

              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                  }
              }
          }
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="CubicBattle" android:hasCode="false">
                  <activity android:name="android.app.NativeActivity"
                      android:configChanges="orientation|keyboardHidden|screenSize"
                      android:exported="true">
                      <meta-data
                          android:name="android.app.lib_name"
                          android:value="CubicBattle" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create strings.xml
        run: |
          echo '<resources><string name="app_name">CubicBattle</string></resources>' > app/src/main/res/values/strings.xml

      - name: Create CMakeLists.txt
        run: |
          cat <<EOF > app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.10)
          project(CubicBattle)

          set(PLATFORM Android)
          set(GRAPHICS GRAPHICS_API_OPENGL_ES2)

          add_subdirectory(\${CMAKE_SOURCE_DIR}/raylib)

          add_library(CubicBattle SHARED main.c)

          target_link_libraries(CubicBattle
              raylib
              android
              log
              EGL
              GLESv2
              m
          )
          EOF

      - name: Create main.c
        run: |
          cat <<EOF > app/src/main/cpp/main.c
          #include "raylib.h"
          #include <math.h>

          int main(void)
          {
              InitWindow(0, 0, "Cubic Battle");

              Camera3D camera = { 0 };
              camera.position = (Vector3){ 10.0f, 10.0f, 10.0f };
              camera.target   = (Vector3){ 0.0f, 0.0f, 0.0f };
              camera.up       = (Vector3){ 0.0f, 1.0f, 0.0f };
              camera.fovy     = 45.0f;
              camera.projection = CAMERA_PERSPECTIVE;

              SetTargetFPS(60);

              while (!WindowShouldClose())
              {
                  float t = GetTime();
                  camera.position.x = 12.0f * cosf(t);
                  camera.position.z = 12.0f * sinf(t);

                  BeginDrawing();
                      ClearBackground(SKYBLUE);
                      BeginMode3D(camera);
                          DrawGrid(20, 1.0f);
                          DrawCube((Vector3){0,1,0}, 2,2,2, RED);
                          DrawCubeWires((Vector3){0,1,0}, 2,2,2, MAROON);
                      EndMode3D();
                      DrawText("Cubic Battle", 20, 20, 30, BLACK);
                      DrawFPS(20, 60);
                  EndDrawing();
              }

              CloseWindow();
              return 0;
          }
          EOF

      - name: Commit Project
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto generated Android Raylib project"
          git push

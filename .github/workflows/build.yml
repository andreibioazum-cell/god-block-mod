name: Real TinyOS VM APK
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Build x86 Shell Kernel
        run: |
          cat > kernel.asm << 'EOF'
          [bits 16]
          [org 0x7c00]
          start:
              mov ax, 0x0003
              int 0x10
              mov si, msg_boot
              call print
          shell:
              mov si, msg_prompt
              call print
              mov di, buffer
              call get_string
              mov si, buffer
              mov di, cmd_help
              call strcmp
              jz .help
              mov si, buffer
              mov di, cmd_matrix
              call strcmp
              jz .matrix
              mov si, msg_err
              call print
              jmp shell
          .help:
              mov si, msg_help
              call print
              jmp shell
          .matrix:
              mov cx, 500
          .ml: mov al, '1'
              mov ah, 0x0E
              int 0x10
              loop .ml
              jmp shell
          strcmp:
          .l: mov al, [si]
              mov bl, [di]
              cmp al, bl
              jne .ne
              or al, al
              jz .e
              inc si
              inc di
              jmp .l
          .e: mov al, 1
              ret
          .ne: mov al, 0
              ret
          get_string:
              xor cx, cx
          .l: mov ah, 0x00
              int 0x16
              cmp al, 13
              je .d
              mov [di], al
              inc di
              mov ah, 0x0E
              int 0x10
              jmp .l
          .d: mov byte [di], 0
              mov al, 13
              int 0x10
              mov al, 10
              int 0x10
              ret
          print:
              lodsb
              or al, al
              jz .d
              mov ah, 0x0E
              int 0x10
              jmp print
          .d: ret
          msg_boot   db 'DimOS v12.1 Optimized', 13, 10, 0
          msg_prompt  db '> ', 0
          msg_help    db 'help, matrix, cls', 13, 10, 0
          msg_err     db '?', 13, 10, 0
          cmd_help    db 'help', 0
          cmd_matrix  db 'matrix', 0
          buffer      times 16 db 0
          times 510-($-$$) db 0
          dw 0xAA55
          EOF
          nasm -f bin kernel.asm -o kernel.bin

      - name: Create Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/tinyos/vm app/src/main/res/layout app/src/main/res/values app/src/main/assets
          cp kernel.bin app/src/main/assets/kernel.bin

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000">
              <SurfaceView android:id="@+id/s" android:layout_width="match_parent" android:layout_height="match_parent" />
              <EditText android:id="@+id/e" android:layout_width="0dp" android:layout_height="0dp" android:inputType="textNoSuggestions" />
          </RelativeLayout>
          EOF

          cat > app/src/main/java/com/tinyos/vm/MainActivity.java << 'EOF'
          package com.tinyos.vm;
          import android.os.*;
          import android.graphics.*;
          import android.view.*;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.EditText;
          import androidx.appcompat.app.AppCompatActivity;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {
              X86Emulator emu;
              Queue<Character> keys = new LinkedList<>();
              Bitmap vScreen;
              Canvas vCanvas;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
                  vScreen = Bitmap.createBitmap(320, 240, Bitmap.Config.RGB_565);
                  vCanvas = new Canvas(vScreen);
                  emu = new X86Emulator();
                  EditText et = findViewById(R.id.e);
                  SurfaceView sv = findViewById(R.id.s);
                  sv.setOnClickListener(v -> {
                      et.requestFocus();
                      ((InputMethodManager)getSystemService(INPUT_METHOD_SERVICE)).showSoftInput(et, 0);
                  });
                  et.setOnKeyListener((v, k, ev) -> {
                      if(ev.getAction()==KeyEvent.ACTION_DOWN) {
                          char c = (char)ev.getUnicodeChar();
                          if(k==KeyEvent.KEYCODE_ENTER) c = 13;
                          if(c != 0) keys.add(c);
                      }
                      return false;
                  });
                  sv.getHolder().addCallback(new SurfaceHolder.Callback() {
                      public void surfaceCreated(SurfaceHolder h) {
                          new Thread(() -> {
                              while(true) {
                                  for(int i=0; i<5000; i++) emu.step();
                                  Canvas c = h.lockCanvas();
                                  if(c!=null) {
                                      vCanvas.drawColor(Color.BLACK);
                                      Paint p = new Paint(); p.setColor(Color.GREEN); p.setTextSize(14); p.setTypeface(Typeface.MONOSPACE);
                                      for(int i=0; i<emu.lines.size(); i++) 
                                          vCanvas.drawText(emu.lines.get(i) + (i==emu.lines.size()-1?"_":""), 10, 20+i*15, p);
                                      c.drawBitmap(vScreen, null, new Rect(0,0,c.getWidth(),c.getHeight()), null);
                                      h.unlockCanvasAndPost(c);
                                  }
                                  try { Thread.sleep(16); } catch(Exception ex) {}
                              }
                          }).start();
                      }
                      public void surfaceChanged(SurfaceHolder h, int f, int w, int h1) {}
                      public void surfaceDestroyed(SurfaceHolder h) {}
                  });
              }

              class X86Emulator {
                  byte[] m = new byte[65536];
                  int ax, si, di, ip=0x7C00, sp=0x9000, cx;
                  boolean zf = false;
                  List<String> lines = new ArrayList<>(Arrays.asList(""));
                  X86Emulator() { try { getAssets().open("kernel.bin").read(m, 0x7C00, 512); } catch(Exception e){} }
                  
                  void step() {
                      int op = m[ip] & 0xFF;
                      switch(op) {
                          case 0xB8: ax=(m[ip+1]&0xFF)|((m[ip+2]&0xFF)<<8); ip+=3; break;
                          case 0xB4: ax=(ax & 0xFF)|((m[ip+1]&0xFF)<<8); ip+=2; break;
                          case 0xB0: ax=(ax & 0xFF00)|(m[ip+1]&0xFF); ip+=2; break;
                          case 0xB9: cx=(m[ip+1]&0xFF)|((m[ip+2]&0xFF)<<8); ip+=3; break;
                          case 0xBE: si=(m[ip+1]&0xFF)|((m[ip+2]&0xFF)<<8); ip+=3; break;
                          case 0xBF: di=(m[ip+1]&0xFF)|((m[ip+2]&0xFF)<<8); ip+=3; break;
                          case 0xAC: ax=(ax&0xFF00)|(m[si]&0xFF); si++; ip++; break;
                          case 0xE2: cx--; if(cx>0) ip+=(byte)m[ip+1]+2; else ip+=2; break;
                          case 0xE8: int rel=(m[ip+1]&0xFF)|((m[ip+2]&0xFF)<<8); m[--sp]=(byte)((ip+3)>>8); m[--sp]=(byte)(ip+3); ip+=3+rel; break;
                          case 0xC3: ip=(m[sp++]&0xFF)|((m[sp++]&0xFF)<<8); break;
                          case 0x3C: zf=(ax&0xFF)==(m[ip+1]&0xFF); ip+=2; break;
                          case 0x74: if(zf) ip+=(byte)m[ip+1]+2; else ip+=2; break;
                          case 0xCD: handleInt(m[ip+1]&0xFF); ip+=2; break;
                          default: ip++; break;
                      }
                  }
                  void handleInt(int n) {
                      if(n==0x10) {
                          if(((ax>>8)&0xFF)==0x0E) {
                              char c=(char)(ax&0xFF);
                              if(c==13) lines.add(""); else if(c>=32) lines.set(lines.size()-1, lines.get(lines.size()-1)+c);
                              if(lines.size()>14) lines.remove(0);
                          } else { lines.clear(); lines.add(""); }
                      } else if(n==0x16) {
                          if(!keys.isEmpty()) { ax=(ax&0xFF00)|keys.poll(); }
                          else ip-=2;
                      }
                  }
              }
          }
          EOF

          echo "android.useAndroidX=true" > gradle.properties
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'EOF'
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.tinyos.vm'; compileSdk 34; defaultConfig { applicationId "com.tinyos.vm"; minSdk 24; targetSdk 34 } }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: DimOS-v12-Final
          path: app/build/outputs/apk/debug/app-debug.apk

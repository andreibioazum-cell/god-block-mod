          cat > app/src/main/res/layout/item_media.xml << 'EOF'
          <androidx.cardview.widget.CardView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent" android:layout_height="wrap_content" 
              android:layout_margin="4dp" app:cardBackgroundColor="#1A1A1A" 
              app:cardCornerRadius="8dp" app:cardElevation="4dp">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" 
                  android:orientation="vertical">
                  <ImageView android:id="@+id/thumbnail" android:layout_width="match_parent" 
                      android:layout_height="150dp" android:scaleType="centerCrop"/>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" 
                      android:orientation="vertical" android:padding="8dp">
                      <TextView android:id="@+id/fileName" android:textColor="#FFF" 
                          android:textSize="14sp" android:maxLines="1" android:ellipsize="end"/>
                      <TextView android:id="@+id/fileInfo" android:textColor="#777" 
                          android:textSize="11sp"/>

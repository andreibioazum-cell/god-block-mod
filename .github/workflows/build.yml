          private void ab(int id,float dx,float dy,float dz){findViewById(id).setOnTouchListener((v,e)->{if(e.getAction()==MotionEvent.ACTION_DOWN||e.getAction()==MotionEvent.ACTION_MOVE){float step=ren.gridEnabled?ren.gridSize:0.5f;ren.ms(dx*step,dy*step,dz*step);}return true;});}
          private void updAxis(){runOnUiThread(()->{boolean sel=ren.selectedIndex>=0;axisPanel.setVisibility(sel?View.VISIBLE:View.GONE);btnDeselect.setVisibility(sel?View.VISIBLE:View.GONE);btnHide.setVisibility(sel?View.VISIBLE:View.GONE);btnDelete.setVisibility(sel?View.VISIBLE:View.GONE);if(sel&&ren.selectedType==0&&ren.selectedIndex<ren.blocks.size()){Block b=ren.blocks.get(ren.selectedIndex);btnHide.setText(b.hidden?"Show":"Hide");}});}
          private void updSizeInfo(){runOnUiThread(()->txtSizeInfo.setText(String.format(java.util.Locale.US,"%.1f x %.1f x %.1f",ren.blockSX,ren.blockSY,ren.blockSZ)));}
          private void updGridBtn(){runOnUiThread(()->{btnGrid.setText(ren.gridEnabled?"Grid: On":"Grid: Off");btnGrid.setBackgroundResource(ren.gridEnabled?R.drawable.btn_blue_filled:R.drawable.btn_blue);btnGrid.setTextColor(ren.gridEnabled?0xFF000000:0xFF00BFFF);});}
          private void sj(View base,View stick){base.setOnTouchListener((v,e)->{float cx=v.getWidth()/2f,cy=v.getHeight()/2f;if(e.getAction()==MotionEvent.ACTION_MOVE||e.getAction()==MotionEvent.ACTION_DOWN){float dx=e.getX()-cx,dy=e.getY()-cy,d=(float)Math.sqrt(dx*dx+dy*dy),lim=cx-stick.getWidth()/2f;if(d>lim){dx*=lim/d;dy*=lim/d;}stick.setTranslationX(dx);stick.setTranslationY(dy);ren.jX=dx/lim;ren.jY=dy/lim;}else{stick.setTranslationX(0);stick.setTranslationY(0);ren.jX=0;ren.jY=0;}return true;});}
          private void updBG(Button[]btns,int sel){for(int i=0;i<btns.length;i++){btns[i].setBackgroundResource(i==sel?R.drawable.btn_blue_filled:R.drawable.btn_blue);btns[i].setTextColor(i==sel?0xFF000000:0xFF00BFFF);}}
          private void updCS(int sel){for(int i=0;i<colorBtn.length;i++){try{GradientDrawable bg=(GradientDrawable)colorBtn[i].getBackground();bg.setStroke(i==sel?6:2,i==sel?0xFFFFFFFF:0xFF00BFFF);}catch(Exception ignored){}}}
          }

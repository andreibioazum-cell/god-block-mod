          cat > app/src/main/res/layout/activity_media_viewer.xml << 'EOF'
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent" 
              android:background="#000">
              <ImageView android:id="@+id/imageView" android:layout_width="match_parent" 
                  android:layout_height="match_parent" android:scaleType="fitCenter"/>
              <VideoView android:id="@+id/videoView" android:layout_width="match_parent" 
                  android:layout_height="match_parent" android:visibility="gone"/>
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" 
                  android:orientation="horizontal" android:padding="12dp" 
                  android:background="#CC000000" android:layout_alignParentBottom="true">
                  <Button android:id="@+id/btnExport" android:layout_width="0dp" 
                      android:layout_height="wrap_content" android:layout_weight="1" 

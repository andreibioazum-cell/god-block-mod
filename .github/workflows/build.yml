name: Auto-Build Enjoer Engine APK
on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Освобождение памяти на сервере
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Генерация кода игры
        run: |
          mkdir enjoer_engine
          cd enjoer_engine
          
          # Генерируем ключ
          keytool -genkey -v -keystore release.keystore -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Enjoer,O=Enjoer,C=US"
          
          cat << 'EOF' > Cargo.toml
          [package]
          name = "enjoer_engine"
          version = "7.0.0"
          edition = "2021"

          [lib]
          name = "enjoer_engine"
          path = "src/lib.rs"
          crate-type = ["cdylib"]

          [dependencies]
          bevy = "0.14.0"
          bevy_egui = "0.28.0"

          [package.metadata.android]
          apk_name = "EnjoerEngine"
          build_targets = ["aarch64-linux-android"]
          min_sdk_version = 24
          target_sdk_version = 33
          strip = "strip"
          fullscreen = true

          # === ВОТ ЭТО ДЕЛАЕТ ИГРУ ГОРИЗОНТАЛЬНОЙ ===
          [package.metadata.android.activity_attributes]
          "android:screenOrientation" = "sensorLandscape"

          [package.metadata.android.signing.release]
          path = "release.keystore"
          keystore_password = "password"
          key_alias = "mykey"
          key_password = "password"

          [profile.release]
          opt-level = 's'
          lto = false
          codegen-units = 16
          EOF
          
          mkdir src
          cat << 'EOF' > src/lib.rs
          use bevy::prelude::*;
          use bevy::window::PrimaryWindow;
          use bevy_egui::{egui, EguiContexts, EguiPlugin};

          #[derive(States, Debug, Clone, Copy, Eq, PartialEq, Hash, Default)]
          enum GameState { #[default] MainMenu, Customize, Playtest }

          #[derive(Component)] struct Player;
          #[derive(Component)] struct PlayerBodyPart;

          #[derive(Resource)]
          struct PlayerProfile {
              ridix: u32,
              inf_ridix: bool,
              owns_fly: bool,
              skin_col: [f32; 3],
              torso_col: [f32; 3],
              legs_col: [f32; 3],
              hair_col: [f32; 3],
              promo_input: String,
          }

          impl Default for PlayerProfile {
              fn default() -> Self {
                  Self {
                      ridix: 150, inf_ridix: false, owns_fly: false,
                      skin_col: [1.0, 0.82, 0.6], torso_col: [0.1, 0.4, 1.0],
                      legs_col: [0.1, 0.8, 0.2], hair_col: [0.2, 0.15, 0.1],
                      promo_input: "".to_string(),
                  }
              }
          }

          #[derive(Resource, Default)]
          struct MobileControls {
              move_dir: Vec2,
              look_delta: Vec2,
              jump_pressed: bool,
          }

          #[bevy_main]
          fn main() {
              App::new()
                  .add_plugins(DefaultPlugins.set(WindowPlugin {
                      primary_window: Some(Window { title: "Enjoer 7.0".to_string(), fit_canvas_to_parent: true, ..default() }),
                      ..default()
                  }))
                  .add_plugins(EguiPlugin)
                  .init_state::<GameState>()
                  .init_resource::<PlayerProfile>()
                  .init_resource::<MobileControls>()
                  .add_systems(Startup, setup_world)
                  .add_systems(Update, apply_ui_style)
                  .add_systems(Update, ui_system)
                  .add_systems(Update, touch_input_system.run_if(in_state(GameState::Playtest)))
                  .add_systems(Update, (player_movement, update_player_colors).run_if(in_state(GameState::Playtest)))
                  .run();
          }

          fn setup_world(mut commands: Commands, mut meshes: ResMut<Assets<Mesh>>, mut materials: ResMut<Assets<StandardMaterial>>) {
              commands.spawn(PointLightBundle { transform: Transform::from_xyz(-5.0, 8.0, -8.0), ..default() });
              commands.insert_resource(AmbientLight { color: Color::srgb(0.8, 0.9, 1.0), brightness: 250.0 });
              
              commands.spawn(PbrBundle {
                  mesh: meshes.add(Plane3d::default().mesh().size(100.0, 100.0)),
                  material: materials.add(StandardMaterial { base_color: Color::srgb(0.07, 0.12, 0.2), ..default() }),
                  ..default()
              });

              commands.spawn(PbrBundle {
                  mesh: meshes.add(Cuboid::new(8.0, 4.0, 8.0)),
                  material: materials.add(Color::srgb(0.9, 0.2, 0.2)),
                  transform: Transform::from_xyz(0.0, 2.0, -10.0),
                  ..default()
              });

              commands.spawn((
                  SpatialBundle { transform: Transform::from_xyz(0.0, 4.0, 0.0), ..default() },
                  Player,
              )).with_children(|parent| {
                  parent.spawn((PbrBundle {
                      mesh: meshes.add(Cuboid::new(0.8, 1.6, 0.4)),
                      material: materials.add(Color::WHITE),
                      transform: Transform::from_xyz(0.0, -0.8, 0.0),
                      ..default()
                  }, PlayerBodyPart));
                  
                  parent.spawn((PbrBundle {
                      mesh: meshes.add(Cuboid::new(1.0, 1.6, 0.5)),
                      material: materials.add(Color::WHITE),
                      transform: Transform::from_xyz(0.0, 0.8, 0.0),
                      ..default()
                  }, PlayerBodyPart));
                  
                  parent.spawn((PbrBundle {
                      mesh: meshes.add(Cuboid::new(0.9, 0.9, 0.9)),
                      material: materials.add(Color::WHITE),
                      transform: Transform::from_xyz(0.0, 2.1, 0.0),
                      ..default()
                  }, PlayerBodyPart));

                  parent.spawn(Camera3dBundle {
                      transform: Transform::from_xyz(0.0, 3.5, 8.0).looking_at(Vec3::new(0.0, 1.5, 0.0), Vec3::Y),
                      ..default()
                  });
              });
          }

          fn apply_ui_style(mut contexts: EguiContexts) {
              let ctx = contexts.ctx_mut();
              let mut visuals = egui::Visuals::dark();
              visuals.window_fill = egui::Color32::from_rgb(2, 5, 10);
              visuals.panel_fill = egui::Color32::from_rgb(2, 5, 10);
              visuals.widgets.noninteractive.bg_fill = egui::Color32::from_rgb(2, 5, 10);
              visuals.widgets.inactive.bg_fill = egui::Color32::from_rgb(0, 60, 100);
              visuals.widgets.hovered.bg_fill = egui::Color32::from_rgb(0, 100, 150);
              visuals.widgets.active.bg_fill = egui::Color32::from_rgb(0, 150, 200);
              ctx.set_visuals(visuals);
          }

          fn ui_system(mut contexts: EguiContexts, state: Res<State<GameState>>, mut next_state: ResMut<NextState<GameState>>, mut profile: ResMut<PlayerProfile>, mut controls: ResMut<MobileControls>) {
              let ctx = contexts.ctx_mut();
              controls.jump_pressed = false;

              let blue_text = egui::Color32::from_rgb(0, 191, 255);
              let gold_text = egui::Color32::from_rgb(255, 215, 0);

              match state.get() {
                  GameState::MainMenu => {
                      egui::CentralPanel::default().show(ctx, |ui| {
                          ui.vertical_centered(|ui| {
                              ui.add_space(30.0);
                              ui.heading(egui::RichText::new("Enjoer").size(52.0).color(blue_text).strong());
                              ui.heading(egui::RichText::new("Engine 7.0").size(18.0).color(egui::Color32::from_rgb(0, 136, 204)));
                              
                              ui.add_space(20.0);
                              let ridix_str = if profile.inf_ridix { "∞".into() } else { profile.ridix.to_string() };
                              ui.label(egui::RichText::new(format!("Ridix: {}", ridix_str)).size(20.0).color(gold_text));

                              ui.add_space(20.0);
                              ui.horizontal(|ui| {
                                  ui.with_layout(egui::Layout::top_down(egui::Align::Center), |ui| {
                                      if ui.add_sized([240.0, 60.0], egui::Button::new(egui::RichText::new("Play").size(20.0).color(blue_text))).clicked() { next_state.set(GameState::Playtest); }
                                      ui.add_space(15.0);
                                      if ui.add_sized([240.0, 60.0], egui::Button::new(egui::RichText::new("Customize").size(20.0).color(blue_text))).clicked() { next_state.set(GameState::Customize); }
                                  });
                              });
                          });
                      });
                  }
                  GameState::Customize => {
                      egui::CentralPanel::default().show(ctx, |ui| {
                          egui::ScrollArea::vertical().show(ui, |ui| {
                              ui.vertical_centered(|ui| {
                                  ui.heading(egui::RichText::new("Customize").size(26.0).color(blue_text));
                                  let ridix_str = if profile.inf_ridix { "∞".into() } else { profile.ridix.to_string() };
                                  ui.label(egui::RichText::new(format!("Ridix: {}", ridix_str)).color(gold_text));
                              });

                              ui.separator();
                              ui.horizontal(|ui| {
                                  ui.label(egui::RichText::new("Promo code:").color(egui::Color32::WHITE).strong());
                                  ui.text_edit_singleline(&mut profile.promo_input);
                                  if ui.button("Apply").clicked() {
                                      if profile.promo_input == "Dimasi4ek229" { profile.inf_ridix = true; }
                                      profile.promo_input.clear();
                                  }
                              });

                              ui.separator();
                              ui.label(egui::RichText::new("Character colors").color(egui::Color32::WHITE).strong());
                              ui.horizontal(|ui| {
                                  ui.label("Skin"); ui.color_edit_button_rgb(&mut profile.skin_col);
                                  ui.label("Torso"); ui.color_edit_button_rgb(&mut profile.torso_col);
                                  ui.label("Legs"); ui.color_edit_button_rgb(&mut profile.legs_col);
                                  ui.label("Hair"); ui.color_edit_button_rgb(&mut profile.hair_col);
                              });

                              ui.separator();
                              ui.horizontal(|ui| {
                                  ui.label(egui::RichText::new("Animation packs: Fly pack").color(egui::Color32::WHITE).strong());
                                  if profile.owns_fly { ui.label(egui::RichText::new("Owned").color(egui::Color32::GREEN)); } 
                                  else {
                                      if ui.button("Buy (50 Ridix)").clicked() && (profile.inf_ridix || profile.ridix >= 50) {
                                          if !profile.inf_ridix { profile.ridix -= 50; }
                                          profile.owns_fly = true;
                                      }
                                  }
                              });

                              ui.add_space(20.0);
                              ui.vertical_centered(|ui| {
                                  if ui.add_sized([200.0, 50.0], egui::Button::new(egui::RichText::new("Back").size(18.0).color(blue_text))).clicked() { next_state.set(GameState::MainMenu); }
                              });
                          });
                      });
                  }
                  GameState::Playtest => {
                      // Прозрачные панели, чтобы игра была на весь экран
                      let frame = egui::Frame::none();
                      egui::TopBottomPanel::top("pt_top").frame(frame).show(ctx, |ui| { 
                          ui.horizontal(|ui| {
                              ui.add_space(20.0);
                              if ui.add_sized([80.0, 40.0], egui::Button::new(egui::RichText::new("Stop").color(egui::Color32::RED))).clicked() { next_state.set(GameState::MainMenu); } 
                          });
                      });
                      
                      egui::TopBottomPanel::bottom("pt_bot").frame(frame).show(ctx, |ui| {
                          ui.with_layout(egui::Layout::right_to_left(egui::Align::Center), |ui| { 
                              ui.add_space(40.0);
                              if ui.add_sized([110.0, 90.0], egui::Button::new(egui::RichText::new("JUMP").size(20.0).strong())).clicked() { controls.jump_pressed = true; } 
                          });
                          ui.add_space(20.0);
                      });
                  }
              }
          }

          fn update_player_colors(profile: Res<PlayerProfile>, q_parts: Query<(&mut Handle<StandardMaterial>, &Transform), With<PlayerBodyPart>>, mut materials: ResMut<Assets<StandardMaterial>>) {
              for (mat_handle, transform) in q_parts.iter() {
                  if let Some(mat) = materials.get_mut(mat_handle) {
                      if transform.translation.y > 2.0 { mat.base_color = Color::srgb(profile.skin_col[0], profile.skin_col[1], profile.skin_col[2]); }
                      else if transform.translation.y > 0.0 { mat.base_color = Color::srgb(profile.torso_col[0], profile.torso_col[1], profile.torso_col[2]); }
                      else { mat.base_color = Color::srgb(profile.legs_col[0], profile.legs_col[1], profile.legs_col[2]); }
                  }
              }
          }

          fn touch_input_system(touches: Res<Touches>, q_windows: Query<&Window, With<PrimaryWindow>>, mut controls: ResMut<MobileControls>) {
              controls.move_dir = Vec2::ZERO; controls.look_delta = Vec2::ZERO;
              if let Ok(window) = q_windows.get_single() {
                  let w = window.width();
                  for touch in touches.iter() {
                      // В горизонтальном режиме экран делится ровно пополам (ширина экрана)
                      if touch.position().x < w / 2.0 {
                          let delta = touch.position() - touch.start_position();
                          controls.move_dir = (delta / 80.0).clamp_length_max(1.0);
                          controls.move_dir.y = -controls.move_dir.y;
                      } else { controls.look_delta = touch.delta(); }
                  }
              }
          }

          fn player_movement(time: Res<Time>, controls: Res<MobileControls>, mut q_player: Query<&mut Transform, With<Player>>) {
              for mut transform in q_player.iter_mut() {
                  if controls.look_delta.x != 0.0 {
                      let yaw = -controls.look_delta.x * 0.01;
                      transform.rotate_y(yaw);
                  }
                  let forward = transform.forward(); let right = transform.right();
                  let mut direction = forward * controls.move_dir.y + right * controls.move_dir.x;
                  direction.y = 0.0; if direction.length_squared() > 0.0 { direction = direction.normalize(); }
                  transform.translation += direction * 10.0 * time.delta_seconds();
              }
          }
          EOF

      - name: Установка Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установка Android NDK и SDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" "platforms;android-30" "platforms;android-33" "build-tools;33.0.2" "build-tools;30.0.3"

      - name: Установка Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Кеширование зависимостей
        uses: Swatinem/rust-cache@v2
        with:
          work-dir: enjoer_engine

      - name: Установка сборщика APK
        run: cargo install cargo-apk

      - name: Сборка APK файла
        run: |
          cd enjoer_engine
          export ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/25.2.9519653
          export ANDROID_SDK_ROOT=${ANDROID_HOME}
          cargo apk build --release

      - name: Выдача APK для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: Enjoer-Engine-APK
          path: enjoer_engine/target/release/apk/*.apk

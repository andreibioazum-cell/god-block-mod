name: TinyOS v16 Hardware Edition

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Build OS Image
        run: |
          cat > kernel.asm << 'EOF'
          [bits 16]
          [org 0x7c00]
          
          ; Загрузчик (Stage 1)
          start:
              mov ax, 0x0013   ; ПЕРЕКЛЮЧАЕМСЯ В ГРАФИЧЕСКИЙ РЕЖИМ VGA (320x200, 256 цветов)
              int 0x10         ; Теперь всё "по-настоящему"
              
              ; Рисуем синий квадрат прямо в видеопамять (0xA000)
              mov ax, 0xA000
              mov es, ax
              mov di, 0
              mov cx, 2000     ; Закрасим кусок экрана
              mov al, 1        ; Синий цвет
              rep stosb        ; Прямая запись в "железо"

              mov si, msg_boot
              call print_gfx

          shell:
              ; Тут твоя ОС может работать дальше...
              jmp $

          print_gfx: ; Упрощенная печать для граф. режима
              lodsb
              or al, al
              jz .done
              mov ah, 0x0E
              int 0x10
              jmp print_gfx
          .done: ret

          msg_boot db 'VGA GRAPHICS MODE ACTIVE', 0

          times 510-($-$$) db 0
          dw 0xAA55
          EOF
          nasm -f bin kernel.asm -o kernel.img

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android Project
        run: |
          mkdir -p app/src/main/java/com/tinyos/vm app/src/main/res/layout app/src/main/res/values app/src/main/assets
          cp kernel.img app/src/main/assets/kernel.img

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000">
              <SurfaceView android:id="@+id/s" android:layout_width="match_parent" android:layout_height="match_parent" />
          </RelativeLayout>
          EOF

          cat > app/src/main/java/com/tinyos/vm/MainActivity.java << 'EOF'
          package com.tinyos.vm;
          import android.os.*;
          import android.graphics.*;
          import android.view.*;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              X86Emulator emu;
              Bitmap screenBitmap = Bitmap.createBitmap(320, 200, Bitmap.Config.ARGB_8888);
              int[] pixels = new int[320 * 200];

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
                  emu = new X86Emulator();
                  SurfaceView sv = findViewById(R.id.s);
                  sv.getHolder().addCallback(new SurfaceHolder.Callback() {
                      public void surfaceCreated(SurfaceHolder h) {
                          new Thread(() -> {
                              while(true) {
                                  for(int i=0; i<10000; i++) emu.step();
                                  updateGraphics();
                                  Canvas c = h.lockCanvas();
                                  if(c!=null) {
                                      c.drawBitmap(screenBitmap, null, new Rect(0,0,c.getWidth(),c.getHeight()), null);
                                      h.unlockCanvasAndPost(c);
                                  }
                                  try { Thread.sleep(16); } catch(Exception ex) {}
                              }
                          }).start();
                      }
                      public void surfaceChanged(SurfaceHolder h, int f, int w, int h1) {}
                      public void surfaceDestroyed(SurfaceHolder h) {}
                  });
              }

              void updateGraphics() {
                  // ПРЯМАЯ ЭМУЛЯЦИЯ ВИДЕОПАМЯТИ VGA 0xA0000
                  for (int i = 0; i < 320 * 200; i++) {
                      int colorIdx = emu.mem[0xA0000 + i] & 0xFF;
                      // Палитра (упрощенно)
                      if(colorIdx == 0) pixels[i] = Color.BLACK;
                      else if(colorIdx == 1) pixels[i] = Color.BLUE;
                      else if(colorIdx == 15) pixels[i] = Color.WHITE;
                      else pixels[i] = Color.GREEN;
                  }
                  screenBitmap.setPixels(pixels, 0, 320, 0, 0, 320, 200);
              }

              class X86Emulator {
                  byte[] mem = new byte[1024 * 1024]; // 1MB RAM
                  int ax, si, ip=0x7C00, cs=0;
                  X86Emulator() {
                      try { getAssets().open("kernel.img").read(mem, 0x7C00, 512); } catch(Exception e){}
                  }
                  void step() {
                      int op = mem[ip] & 0xFF;
                      switch(op) {
                          case 0xB8: ax=(mem[ip+1]&0xFF)|((mem[ip+2]&0xFF)<<8); ip+=3; break;
                          case 0xB0: ax=(ax&0xFF00)|(mem[ip+1]&0xFF); ip+=2; break;
                          case 0xBE: si=(mem[ip+1]&0xFF)|((mem[ip+2]&0xFF)<<8); ip+=3; break;
                          case 0xAC: ax=(ax&0xFF00)|(mem[si]&0xFF); si++; ip++; break;
                          case 0xAA: // STOSB - запись AL в ES:DI (видеопамять!)
                              mem[0xA0000 + ax] = (byte)(ax & 0xFF); ip++; break; 
                          case 0xCD: 
                              if((mem[ip+1]&0xFF) == 0x10) { /* Просто заглушка для режима */ }
                              ip+=2; break;
                          default: ip++; break;
                      }
                  }
              }
          }
          EOF

          echo "android.useAndroidX=true" > gradle.properties
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'EOF'
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'APP'
          plugins { id 'com.android.application' }
          android { namespace 'com.tinyos.vm'; compileSdk 34; defaultConfig { applicationId "com.tinyos.vm"; minSdk 24; targetSdk 34 } }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          APP

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip && unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle wrapper --gradle-version 8.5 && ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TinyOS-Hardware-v16
          path: app/build/outputs/apk/debug/app-debug.apk

          public class MediaAdapter extends RecyclerView.Adapter<MediaAdapter.VH> {
              List<VaultFile> files;
              OnItemClick listener;
              public interface OnItemClick { void onClick(VaultFile file); }
              public MediaAdapter(List<VaultFile> f, OnItemClick l) { files = f; listener = l; }
              
              @Override public VH onCreateViewHolder(ViewGroup p, int t) {
                  return new VH(LayoutInflater.from(p.getContext()).inflate(R.layout.item_media, p, false));
              }
              
              @Override public void onBindViewHolder(VH h, int p) {
                  VaultFile f = files.get(p);
                  h.fileName.setText(f.originalName);
                  h.fileInfo.setText(f.type.equals("image") ? "📷 " : "🎬 " + (f.size / 1024) + " KB");
                  
                  VaultManager vm = new VaultManager(h.itemView.getContext());
                  File thumb = vm.decryptFile(f.encryptedPath);
                  if (f.type.equals("image") && thumb != null) {
                      h.thumbnail.setImageBitmap(BitmapFactory.decodeFile(thumb.getAbsolutePath()));
                  }
                  vm.cleanupTemp();
                  h.itemView.setOnClickListener(v -> listener.onClick(f));
              }
              
              @Override public int getItemCount() { return files.size(); }
              
              static class VH extends RecyclerView.ViewHolder {
                  ImageView thumbnail;
                  TextView fileName, fileInfo;

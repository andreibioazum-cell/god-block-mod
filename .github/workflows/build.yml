name: Build_ByeDPI_APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone ByeDPIAndroid
        run: |
          git clone --recursive https://github.com/dovecoteescapee/ByeDPIAndroid.git byedpi
          cd byedpi
          echo "=== Latest commit ==="
          git log -1 --oneline
          echo ""
          echo "=== Submodules ==="
          git submodule status
          echo ""
          echo "=== Files ==="
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          NDK_VER="26.1.10909125"
          echo "Installing NDK $NDK_VER..."
          yes | sdkmanager --install "ndk;$NDK_VER" 2>&1 | tail -5
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
          echo "NDK installed at: $ANDROID_HOME/ndk/$NDK_VER"
          ls $ANDROID_HOME/ndk/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        working-directory: byedpi
        run: |
          chmod +x gradlew
          echo "=== Starting build ==="
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -200

      - name: Find APK files
        if: always()
        run: |
          echo "=== APK files ==="
          find byedpi -name "*.apk" -type f 2>/dev/null
          echo ""
          echo "=== Build outputs ==="
          ls -laR byedpi/app/build/outputs/ 2>/dev/null || echo "no outputs"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ByeDPI_APK
          path: |
            byedpi/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30

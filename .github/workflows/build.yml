name: Auto-Build Enjoer Engine APK
on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Установка Java для Android
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установка Android NDK и SDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" "platforms;android-33" "build-tools;33.0.2"

      - name: Установка Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Установка сборщика APK (cargo-apk)
        run: cargo install cargo-apk

      - name: Генерация кода игры
        run: |
          mkdir enjoer_engine
          cd enjoer_engine
          
          cat << 'EOF' > Cargo.toml
          [package]
          name = "enjoer_engine"
          version = "7.0.0"
          edition = "2021"

          [lib]
          name = "enjoer_engine"
          path = "src/main.rs"
          crate-type = ["cdylib", "rlib"]

          [dependencies]
          bevy = "0.14.0"
          bevy_egui = "0.28.0"

          [package.metadata.android]
          apk_name = "EnjoerEngine"
          build_targets = ["aarch64-linux-android"]
          min_sdk_version = 24
          target_sdk_version = 33
          strip = "strip"
          EOF
          
          mkdir src
          cat << 'EOF' > src/main.rs
          use bevy::prelude::*;
          use bevy::window::PrimaryWindow;
          use bevy_egui::{egui, EguiContexts, EguiPlugin};

          #[derive(States, Debug, Clone, Copy, Eq, PartialEq, Hash, Default)]
          enum GameState { #[default] MainMenu, Editor, Playtest }

          #[derive(Component)] struct Player { velocity: f32, is_grounded: bool }
          #[derive(Component)] struct GameBlock { size: Vec3, color: Color }

          #[derive(Resource, Default)]
          struct MobileControls {
              move_dir: Vec2,
              look_delta: Vec2,
              jump_pressed: bool,
              place_pressed: bool,
          }

          #[derive(Resource)]
          struct EditorSettings {
              block_size: Vec3, block_color: Color, place_distance: f32,
          }

          impl Default for EditorSettings {
              fn default() -> Self {
                  Self { block_size: Vec3::splat(4.0), block_color: Color::srgb(0.3, 0.6, 1.0), place_distance: 12.0 }
              }
          }

          #[bevy_main]
          fn main() {
              App::new()
                  .add_plugins(DefaultPlugins.set(WindowPlugin {
                      primary_window: Some(Window { title: "Enjoer Engine 7.0".to_string(), fit_canvas_to_parent: true, ..default() }),
                      ..default()
                  }))
                  .add_plugins(EguiPlugin)
                  .init_state::<GameState>()
                  .init_resource::<EditorSettings>()
                  .init_resource::<MobileControls>()
                  .add_systems(Startup, setup_world)
                  .add_systems(Update, touch_input_system)
                  .add_systems(Update, ui_system)
                  .add_systems(Update, (player_movement, camera_look).run_if(not(in_state(GameState::MainMenu))))
                  .add_systems(Update, editor_placement.run_if(in_state(GameState::Editor)))
                  .run();
          }

          fn setup_world(mut commands: Commands, mut meshes: ResMut<Assets<Mesh>>, mut materials: ResMut<Assets<StandardMaterial>>) {
              commands.spawn(PointLightBundle { transform: Transform::from_xyz(-5.0, 8.0, -8.0), ..default() });
              commands.insert_resource(AmbientLight { color: Color::srgb(0.8, 0.9, 1.0), brightness: 150.0 });
              commands.spawn(PbrBundle {
                  mesh: meshes.add(Plane3d::default().mesh().size(800.0, 800.0)),
                  material: materials.add(StandardMaterial { base_color: Color::srgb(0.07, 0.12, 0.2), ..default() }),
                  ..default()
              });
              commands.spawn((
                  Camera3dBundle { transform: Transform::from_xyz(0.0, 6.0, 15.0).looking_at(Vec3::ZERO, Vec3::Y), ..default() },
                  Player { velocity: 0.0, is_grounded: false },
              ));
          }

          fn touch_input_system(touches: Res<Touches>, q_windows: Query<&Window, With<PrimaryWindow>>, mut controls: ResMut<MobileControls>) {
              controls.move_dir = Vec2::ZERO; controls.look_delta = Vec2::ZERO;
              if let Ok(window) = q_windows.get_single() {
                  let w = window.width();
                  for touch in touches.iter() {
                      if touch.position().x < w / 2.0 {
                          let delta = touch.position() - touch.start_position();
                          controls.move_dir = (delta / 80.0).clamp_length_max(1.0);
                          controls.move_dir.y = -controls.move_dir.y;
                      } else { controls.look_delta = touch.delta(); }
                  }
              }
          }

          fn ui_system(mut contexts: EguiContexts, state: Res<State<GameState>>, mut next_state: ResMut<NextState<GameState>>, mut editor: ResMut<EditorSettings>, mut controls: ResMut<MobileControls>) {
              let ctx = contexts.ctx_mut();
              controls.jump_pressed = false; controls.place_pressed = false;

              match state.get() {
                  GameState::MainMenu => {
                      egui::CentralPanel::default().show(ctx, |ui| {
                          ui.vertical_centered(|ui| {
                              ui.heading("Enjoer Engine 7.0 (Rust Edition)");
                              ui.add_space(50.0);
                              if ui.add_sized([200.0, 60.0], egui::Button::new("Playtest")).clicked() { next_state.set(GameState::Playtest); }
                              ui.add_space(20.0);
                              if ui.add_sized([200.0, 60.0], egui::Button::new("Editor")).clicked() { next_state.set(GameState::Editor); }
                          });
                      });
                  }
                  GameState::Editor => {
                      egui::TopBottomPanel::top("editor_top").show(ctx, |ui| {
                          ui.horizontal(|ui| {
                              if ui.button("Menu").clicked() { next_state.set(GameState::MainMenu); }
                              if ui.button("Play").clicked() { next_state.set(GameState::Playtest); }
                          });
                      });
                      egui::TopBottomPanel::bottom("editor_bottom").show(ctx, |ui| {
                          ui.vertical_centered(|ui| { if ui.add_sized([150.0, 60.0], egui::Button::new("PLACE BLOCK")).clicked() { controls.place_pressed = true; } });
                      });
                  }
                  GameState::Playtest => {
                      egui::TopBottomPanel::top("pt_top").show(ctx, |ui| { if ui.button("Stop").clicked() { next_state.set(GameState::Editor); } });
                      egui::TopBottomPanel::bottom("pt_bot").show(ctx, |ui| {
                          ui.with_layout(egui::Layout::right_to_left(egui::Align::Center), |ui| { if ui.add_sized([100.0, 80.0], egui::Button::new("JUMP")).clicked() { controls.jump_pressed = true; } });
                      });
                  }
              }
          }

          fn camera_look(mut q_camera: Query<&mut Transform, With<Camera>>, controls: Res<MobileControls>) {
              if controls.look_delta != Vec2::ZERO {
                  let mut transform = q_camera.single_mut();
                  let (mut yaw, mut pitch, _) = transform.rotation.to_euler(EulerRot::YXZ);
                  yaw -= controls.look_delta.x * 0.005; pitch -= controls.look_delta.y * 0.005; pitch = pitch.clamp(-1.5, 1.5);
                  transform.rotation = Quat::from_euler(EulerRot::YXZ, yaw, pitch, 0.0);
              }
          }

          fn player_movement(time: Res<Time>, controls: Res<MobileControls>, mut q_player: Query<(&mut Transform, &mut Player)>) {
              for (mut transform, mut player) in q_player.iter_mut() {
                  let forward = transform.forward(); let right = transform.right();
                  let mut direction = forward * controls.move_dir.y + right * controls.move_dir.x;
                  direction.y = 0.0; if direction.length_squared() > 0.0 { direction = direction.normalize(); }
                  if transform.translation.y <= 2.0 { transform.translation.y = 2.0; player.is_grounded = true; player.velocity = 0.0;
                  } else { player.is_grounded = false; player.velocity -= 15.0 * time.delta_seconds(); }
                  if controls.jump_pressed && player.is_grounded { player.velocity = 8.0; }
                  transform.translation += direction * 10.0 * time.delta_seconds(); transform.translation.y += player.velocity * time.delta_seconds();
              }
          }

          fn editor_placement(controls: Res<MobileControls>, editor: Res<EditorSettings>, q_camera: Query<&Transform, With<Camera>>, mut commands: Commands, mut meshes: ResMut<Assets<Mesh>>, mut materials: ResMut<Assets<StandardMaterial>>) {
              if controls.place_pressed {
                  if let Ok(cam_transform) = q_camera.get_single() {
                      let forward = cam_transform.forward();
                      let mut p = cam_transform.translation + forward * editor.place_distance;
                      if p.y - (editor.block_size.y / 2.0) < 0.0 { p.y = editor.block_size.y / 2.0; }
                      commands.spawn((
                          PbrBundle { mesh: meshes.add(Cuboid::new(editor.block_size.x, editor.block_size.y, editor.block_size.z)), material: materials.add(editor.block_color), transform: Transform::from_translation(p), ..default() },
                          GameBlock { size: editor.block_size, color: editor.block_color },
                      ));
                  }
              }
          }
          EOF

      - name: Сборка APK файла
        run: |
          cd enjoer_engine
          export ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/25.2.9519653
          export ANDROID_SDK_ROOT=${ANDROID_HOME}
          cargo apk build --release

      - name: Выдача APK для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: Enjoer-Engine-APK
          path: enjoer_engine/target/release/apk/*.apk

name: TinyOS v22 FileSystem

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

# ==============================
# СБОРКА ОБРАЗА ДИСКА (BOOT + KERNEL)
# ==============================
      - name: Build OS Image
        run: |
          cat > kernel.asm << 'EOF'
          [bits 16]
          [org 0x7c00]
          ; --- BOOTLOADER ---
          jmp 0:boot_start
          boot_start:
              mov ax, 0x1000
              mov es, ax
              xor bx, bx
              mov ah, 0x02
              mov al, 20
              mov ch, 0
              mov cl, 2
              mov dh, 0
              int 0x13
              jmp 0x1000:0000

          times 510-($-$$) db 0
          dw 0xAA55

          ; --- KERNEL ---
          kernel_entry:
              push cs
              pop ds
              mov si, msg_welcome
              call print
          shell:
              mov si, msg_prompt
              call print
              mov di, buffer
              call get_string
              
              ; ПРОВЕРКА КОМАНД
              mov si, buffer
              mov di, cmd_ls
              call strcmp_fixed
              jz do_ls

              mov si, buffer
              mov di, cmd_touch
              call strcmp_prefix
              jz do_touch

              mov si, buffer
              mov di, cmd_rm
              call strcmp_prefix
              jz do_rm

              mov si, buffer
              mov di, cmd_start
              call strcmp_prefix
              jz do_start

              mov si, buffer
              mov di, cmd_cls
              call strcmp_fixed
              jz 0x7C00

              mov si, msg_err
              call print
              jmp shell

          ; --- ФАЙЛОВЫЕ ОПЕРАЦИИ ---
          do_ls:
              mov si, file_list_header
              call print
              mov bx, file_table
          .loop:
              mov al, [bx]
              or al, al
              jz .next
              mov si, bx
              call print
              mov si, msg_space
              call print
          .next:
              add bx, 16
              cmp bx, file_table + 80
              jl .loop
              mov si, msg_nl
              call print
              jmp shell

          do_touch:
              mov si, buffer + 6 ; Пропустить "touch "
              mov bx, file_table
          .find_slot:
              mov al, [bx]
              or al, al
              jz .found
              add bx, 16
              cmp bx, file_table + 80
              jge .full
              jmp .find_slot
          .found:
              mov di, bx
          .copy:
              lodsb
              stosb
              or al, al
              jnz .copy
              mov si, msg_done
              call print
              jmp shell
          .full:
              mov si, msg_full
              call print
              jmp shell

          do_rm:
              mov si, buffer + 3 ; Пропустить "rm "
              call find_file
              jc .not_found
              mov byte [bx], 0 ; Удалить (обнулить первый байт имени)
              mov si, msg_done
              call print
              jmp shell
          .not_found:
              mov si, msg_err
              call print
              jmp shell

          do_start:
              mov si, buffer + 6 ; Пропустить "start "
              call find_file
              jc .not_found
              mov si, msg_starting
              call print
              ; Тут мы могли бы прыгнуть на код файла
              ; Но пока просто имитируем запуск
              jmp shell
          .not_found:
              mov si, msg_err
              call print
              jmp shell

          find_file:
              mov bx, file_table
          .loop:
              push si
              mov di, bx
              call strcmp_fixed
              pop si
              jz .found
              add bx, 16
              cmp bx, file_table + 80
              jl .loop
              stc ; Не найден
              ret
          .found:
              clc ; Найден, адрес в BX
              ret

          ; --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ---
          strcmp_fixed:
          .l: mov al, [si]
              mov bl, [di]
              cmp al, bl
              jne .ne
              or al, al
              jz .e
              inc si
              inc di
              jmp .l
          .e: ret
          .ne: add sp, 2
              ret

          strcmp_prefix: ; Проверка начала строки
          .l: mov al, [di]
              or al, al
              jz .e
              mov bl, [si]
              cmp al, bl
              jne .ne
              inc si
              inc di
              jmp .l
          .e: ret
          .ne: add sp, 2
              ret

          get_string:
              xor cx, cx
          .l: mov ah, 0x00
              int 0x16
              cmp al, 13
              je .d
              mov [di], al
              inc di
              mov ah, 0x0E
              int 0x10
              jmp .l
          .d: mov byte [di], 0
              mov al, 13
              int 0x10
              mov al, 10
              int 0x10
              ret

          print:
              lodsb
              or al, al
              jz .d
              mov ah, 0x0E
              int 0x10
              jmp print
          .d: ret

          msg_welcome db 'DimOS Termux v22.0 - Virtual FS', 13, 10, 'Usage: touch [name], ls, rm [name]', 13, 10, 0
          msg_prompt  db '~ $ ', 0
          file_list_header db 'Files in /home:', 13, 10, 0
          msg_space   db '  ', 0
          msg_nl      db 13, 10, 0
          msg_done    db 'OK', 13, 10, 0
          msg_full    db 'Error: Disk full', 13, 10, 0
          msg_starting db 'Executing program...', 13, 10, 0
          msg_err     db 'Error: Not found', 13, 10, 0
          cmd_ls      db 'ls', 0
          cmd_touch   db 'touch ', 0
          cmd_rm      db 'rm ', 0
          cmd_start   db 'start ', 0
          cmd_cls      db 'cls', 0
          
          file_table: times 80 db 0 ; 5 слотов по 16 байт
          buffer     times 32 db 0
          
          times 8192-($-$$) db 0
          EOF
          nasm -f bin kernel.asm -o kernel.img

# ==============================
# СОЗДАНИЕ ANDROID ПРОЕКТА
# ==============================
      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/tinyos/vm app/src/main/res/layout app/src/main/res/values app/src/main/assets
          cp kernel.img app/src/main/assets/kernel.img

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.tinyos.vm">
              <application android:label="TinyOS" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000">
              <SurfaceView android:id="@+id/s" android:layout_width="match_parent" android:layout_height="match_parent" />
              <EditText android:id="@+id/e" android:layout_width="1dp" android:layout_height="1dp" android:alpha="0" android:focusable="true" android:focusableInTouchMode="true" android:inputType="textNoSuggestions" android:imeOptions="flagNoExtractUi" />
          </RelativeLayout>
          EOF

          cat > app/src/main/java/com/tinyos/vm/MainActivity.java << 'EOF'
          package com.tinyos.vm;
          import android.os.*;
          import android.graphics.*;
          import android.view.*;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import java.util.*;
          import java.io.*;

          public class MainActivity extends AppCompatActivity {
              X86Emulator emu;
              Queue<Character> keys = new LinkedList<>();

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
                  emu = new X86Emulator();
                  EditText et = findViewById(R.id.e);
                  SurfaceView sv = findViewById(R.id.s);
                  
                  sv.setOnClickListener(v -> {
                      et.requestFocus();
                      ((InputMethodManager)getSystemService(INPUT_METHOD_SERVICE)).showSoftInput(et, InputMethodManager.SHOW_IMPLICIT);
                  });

                  et.setOnKeyListener((v, k, event) -> {
                      if(event.getAction()==KeyEvent.ACTION_DOWN) {
                          int unicode = event.getUnicodeChar();
                          if (unicode != 0) keys.add((char)unicode);
                          else if (k == KeyEvent.KEYCODE_ENTER) keys.add((char)13);
                      }
                      return true;
                  });

                  sv.getHolder().addCallback(new SurfaceHolder.Callback() {
                      public void surfaceCreated(SurfaceHolder h) {
                          new Thread(() -> {
                              while(true) {
                                  for(int i=0; i<3000; i++) emu.step();
                                  Canvas c = h.lockCanvas();
                                  if(c!=null) { emu.draw(c); h.unlockCanvasAndPost(c); }
                                  try { Thread.sleep(16); } catch(Exception ex) {}
                              }
                          }).start();
                      }
                      public void surfaceChanged(SurfaceHolder h, int f, int w, int h1) {}
                      public void surfaceDestroyed(SurfaceHolder h) {}
                  });
              }

              class X86Emulator {
                  byte[] m = new byte[128 * 1024];
                  int ax, bx, cx, dx, si, di, ip=0x7C00, sp=0x9000, cs=0, es=0;
                  boolean zf = false;
                  List<String> lines = new ArrayList<>(Arrays.asList(""));

                  X86Emulator() {
                      try {
                          InputStream is = getAssets().open("kernel.img");
                          is.read(m, 0x7C00, is.available());
                      } catch(Exception e){}
                  }
                  
                  void step() {
                      int absIp = (cs << 4) + ip;
                      int op = m[absIp] & 0xFF;
                      switch(op) {
                          case 0xB8: ax=(m[absIp+1]&0xFF)|((m[absIp+2]&0xFF)<<8); ip+=3; break;
                          case 0xB4: ax=(ax&0xFF)|((m[absIp+1]&0xFF)<<8); ip+=2; break;
                          case 0xB0: ax=(ax&0xFF00)|(m[absIp+1]&0xFF); ip+=2; break;
                          case 0xBB: bx=(m[absIp+1]&0xFF)|((m[absIp+2]&0xFF)<<8); ip+=3; break;
                          case 0xB9: cx=(m[absIp+1]&0xFF)|((m[absIp+2]&0xFF)<<8); ip+=3; break;
                          case 0xBE: si=(m[absIp+1]&0xFF)|((m[absIp+2]&0xFF)<<8); ip+=3; break;
                          case 0xBF: di=(m[absIp+1]&0xFF)|((m[absIp+2]&0xFF)<<8); ip+=3; break;
                          case 0xAC: ax=(ax&0xFF00)|(m[(cs<<4)+si]&0xFF); si++; ip++; break;
                          case 0xAA: m[(es<<4)+di]=(byte)(ax&0xFF); di++; ip++; break;
                          case 0xE8: int r=ip+3; m[--sp]=(byte)(r>>8); m[--sp]=(byte)r; ip+=3+((m[absIp+1]&0xFF)|((m[absIp+2]&0xFF)<<8)); break;
                          case 0xC3: ip=(m[sp++]&0xFF)|((m[sp++]&0xFF)<<8); break;
                          case 0x3C: zf=(ax&0xFF)==(m[absIp+1]&0xFF); ip+=2; break; 
                          case 0x74: if(zf) ip+=(byte)m[absIp+1]+2; else ip+=2; break;
                          case 0x81: if(m[absIp+1]==(byte)0xFB) { bx+=(m[absIp+2]&0xFF)|((m[absIp+3]&0xFF)<<8); ip+=4; } else ip++; break; // add bx, imm16
                          case 0x83: if(m[absIp+1]==(byte)0xC3) { bx+=(m[absIp+2]); ip+=3; } else ip++; break; // add bx, imm8
                          case 0xCD: handleInt(m[absIp+1]&0xFF); ip+=2; break;
                          case 0xEA: ip=(m[absIp+1]&0xFF)|((m[absIp+2]&0xFF)<<8); cs=(m[absIp+3]&0xFF)|((m[absIp+4]&0xFF)<<8); break;
                          case 0x8A: ax=(ax&0xFF00)|(m[(cs<<4)+si]&0xFF); ip+=2; break; // mov al, [si]
                          case 0x38: zf=(ax&0xFF)==(bx&0xFF); ip+=2; break; // cmp al, bl
                          case 0x46: si++; ip++; break;
                          case 0x47: di++; ip++; break;
                          default: ip++; break;
                      }
                  }

                  void handleInt(int n) {
                      if(n==0x10) {
                          if(((ax>>8)&0xFF)==0x0E) {
                              char c=(char)(ax&0xFF);
                              if(c==13) lines.add(""); else if(c>=32) lines.set(lines.size()-1, lines.get(lines.size()-1)+c);
                              if(lines.size()>30) lines.remove(0);
                          } else { lines.clear(); lines.add(""); }
                      } else if(n==0x16) {
                          if(!keys.isEmpty()) ax=(ax&0xFF00)|keys.poll(); else ip-=2;
                      } else if(n==0x13) {
                          int count = ax & 0xFF;
                          int sector = (m[ip-1] & 0xFF);
                          // Имитируем чтение диска в память
                          System.arraycopy(m, 0, m, 0x10000, count*512);
                      }
                  }

                  void draw(Canvas c) {
                      c.drawColor(Color.BLACK);
                      Paint p = new Paint(); p.setColor(Color.WHITE); p.setTextSize(22);
                      p.setTypeface(Typeface.MONOSPACE); p.setAntiAlias(true);
                      for(int i=0; i<lines.size(); i++) c.drawText(lines.get(i) + (i==lines.size()-1?"█":""), 15, 40+i*32, p);
                  }
              }
          }
          JAVA

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip && unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle wrapper --gradle-version 8.5 && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TinyOS-v22-FileSystem
          path: app/build/outputs/apk/debug/app-debug.apk

name: Secure_Vault_Dimon
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Project Structure
        run: |
          mkdir -p app/src/main/java/com/wordgame/{game,vault,security}
          mkdir -p app/src/main/res/{layout,values,drawable,raw,xml}

          # 1. Настройки проекта
          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ':app'
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3072m
          android.enableR8.fullMode=true
          EOF

          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.wordgame'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.wordgame'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.security:security-crypto:1.1.0-alpha06'
              implementation 'androidx.cardview:cardview:1.0.0'
          }
          EOF

          # 2. Манифест и ресурсы
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <application android:label="Word Puzzle" android:theme="@style/GameTheme" android:icon="@drawable/ic_launcher">
                  <activity android:name=".game.GameActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".game.SettingsActivity" />
                  <activity android:name=".vault.VaultActivity" android:theme="@style/VaultTheme" />
                  <activity android:name=".vault.MediaViewerActivity" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen" />
                  <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths"/>
                  </provider>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="GameTheme" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="colorPrimary">#FF9800</item>
                  <item name="android:windowBackground">#FFFFFF</item>
              </style>
              <style name="VaultTheme" parent="Theme.MaterialComponents.NoActionBar">
                  <item name="colorPrimary">#1976D2</item>
                  <item name="android:windowBackground">#000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/xml/file_paths.xml << 'EOF'
          <paths><files-path name="vault" path="vault/"/></paths>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48"><path android:fillColor="#FF9800" android:pathData="M0,0h48v48h-48z"/></vector>
          EOF

          # 3. Layouts (исправленные)
          cat > app/src/main/res/layout/activity_game.xml << 'EOF'
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent">
              <Button android:id="@+id/btnSettings" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Settings" android:layout_centerInParent="true"/>
              <Button android:id="@+id/btnRetry" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Retry" android:layout_below="@id/btnSettings" android:layout_centerHorizontal="true" android:layout_marginTop="20dp"/>
              <ProgressBar android:id="@+id/progressBar" android:layout_width="wrap_content" android:layout_height="wrap_content" android:visibility="gone" android:layout_centerInParent="true"/>
          </RelativeLayout>
          EOF

          cat > app/src/main/res/layout/activity_settings.xml << 'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:padding="20dp">
              <Button android:id="@+id/btnBack" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Back"/>
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Difficulty" android:layout_marginTop="20dp"/>
              <SeekBar android:id="@+id/difficultyBar" android:layout_width="match_parent" android:layout_height="wrap_content" android:max="100"/>
          </LinearLayout>
          EOF

          cat > app/src/main/res/layout/activity_vault.xml << 'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:padding="20dp" android:background="#000">
              <LinearLayout android:id="@+id/authLayout" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center">
                  <EditText android:id="@+id/passwordInput" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Password" android:textColor="#FFF" android:inputType="textPassword"/>
                  <Button android:id="@+id/btnUnlock" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Unlock"/>
              </LinearLayout>
              <LinearLayout android:id="@+id/vaultLayout" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:visibility="gone">
                  <Button android:id="@+id/btnAdd" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Add Media"/>
                  <androidx.recyclerview.widget.RecyclerView android:id="@+id/recyclerMedia" android:layout_width="match_parent" android:layout_height="match_parent"/>
              </LinearLayout>
          </LinearLayout>
          EOF

          cat > app/src/main/res/layout/activity_media_viewer.xml << 'EOF'
          <ImageView xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/imageView" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000" android:scaleType="fitCenter"/>
          EOF
          
          cat > app/src/main/res/layout/item_media.xml << 'EOF'
          <TextView xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/fileName" android:layout_width="match_parent" android:layout_height="100dp" android:gravity="center" android:textColor="#FFF" android:background="#333" android:layout_margin="5dp"/>
          EOF

          # 4. Java Код (AppCompatActivity исправляет вылет!)
          cat > app/src/main/java/com/wordgame/game/GameActivity.java << 'EOF'
          package com.wordgame.game;
          import android.content.Intent; import android.os.Bundle; import android.view.View;
          import androidx.appcompat.app.AppCompatActivity; import com.wordgame.R;
          public class GameActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_game);
                  findViewById(R.id.btnSettings).setOnClickListener(v -> startActivity(new Intent(this, SettingsActivity.class)));
              }
          }
          EOF

          cat > app/src/main/java/com/wordgame/game/SettingsActivity.java << 'EOF'
          package com.wordgame.game;
          import android.content.Intent; import android.os.Bundle; import android.widget.SeekBar;
          import androidx.appcompat.app.AppCompatActivity; import com.wordgame.R; import com.wordgame.vault.VaultActivity;
          public class SettingsActivity extends AppCompatActivity {
              int taps = 0;
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_settings);
                  findViewById(R.id.btnBack).setOnClickListener(v -> finish());
                  ((SeekBar)findViewById(R.id.difficultyBar)).setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar b, int p, boolean f) {
                          if (p == 100) { taps++; if (taps >= 3) { startActivity(new Intent(SettingsActivity.this, VaultActivity.class)); finish(); } }
                      }
                      @Override public void onStartTrackingTouch(SeekBar b) {}
                      @Override public void onStopTrackingTouch(SeekBar b) {}
                  });
              }
          }
          EOF

          cat > app/src/main/java/com/wordgame/vault/VaultActivity.java << 'EOF'
          package com.wordgame.vault;
          import android.content.Intent; import android.os.Bundle; import android.view.View; import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity; import androidx.recyclerview.widget.*;
          import com.wordgame.R; import com.wordgame.security.VaultManager;
          public class VaultActivity extends AppCompatActivity {
              VaultManager vm;
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_vault);
                  vm = new VaultManager(this);
                  findViewById(R.id.btnUnlock).setOnClickListener(v -> {
                      String pass = ((EditText)findViewById(R.id.passwordInput)).getText().toString();
                      if (vm.authenticate(pass)) {
                          findViewById(R.id.authLayout).setVisibility(View.GONE);
                          findViewById(R.id.vaultLayout).setVisibility(View.VISIBLE);
                          updateList();
                      }
                  });
                  findViewById(R.id.btnAdd).setOnClickListener(v -> {
                      Intent i = new Intent(Intent.ACTION_PICK); i.setType("image/*"); startActivityForResult(i, 1);
                  });
              }
              void updateList() {
                  RecyclerView rv = findViewById(R.id.recyclerMedia);
                  rv.setLayoutManager(new GridLayoutManager(this, 2));
                  rv.setAdapter(new MediaAdapter(vm.getFiles(), f -> {
                      Intent i = new Intent(this, MediaViewerActivity.class);
                      i.putExtra("file", f.encryptedPath); startActivity(i);
                  }));
              }
              @Override protected void onActivityResult(int q, int r, Intent d) {
                  super.onActivityResult(q, r, d);
                  if (r == RESULT_OK && d.getData() != null) { vm.importFile(d.getData()); updateList(); }
              }
          }
          EOF

          cat > app/src/main/java/com/wordgame/vault/VaultFile.java << 'EOF'
          package com.wordgame.vault;
          public class VaultFile {
              public String originalName, encryptedPath, type;
              public VaultFile(String n, String p, String t) { originalName=n; encryptedPath=p; type=t; }
          }
          EOF

          cat > app/src/main/java/com/wordgame/vault/MediaAdapter.java << 'EOF'
          package com.wordgame.vault;
          import android.view.*; import android.widget.TextView; import androidx.recyclerview.widget.RecyclerView;
          import com.wordgame.R; import java.util.List;
          public class MediaAdapter extends RecyclerView.Adapter<MediaAdapter.VH> {
              List<VaultFile> list; OnClick click;
              public interface OnClick { void onClick(VaultFile f); }
              public MediaAdapter(List<VaultFile> l, OnClick c) { list=l; click=c; }
              @Override public VH onCreateViewHolder(ViewGroup p, int t) { return new VH(LayoutInflater.from(p.getContext()).inflate(R.layout.item_media, p, false)); }
              @Override public void onBindViewHolder(VH h, int p) { h.t.setText(list.get(p).originalName); h.itemView.setOnClickListener(v -> click.onClick(list.get(p))); }
              @Override public int getItemCount() { return list.size(); }
              class VH extends RecyclerView.ViewHolder { TextView t; VH(View v) { super(v); t=v.findViewById(R.id.fileName); } }
          }
          EOF

          cat > app/src/main/java/com/wordgame/vault/MediaViewerActivity.java << 'EOF'
          package com.wordgame.vault;
          import android.graphics.BitmapFactory; import android.os.Bundle; import android.widget.ImageView;
          import androidx.appcompat.app.AppCompatActivity; import com.wordgame.R; import com.wordgame.security.VaultManager;
          import java.io.File;
          public class MediaViewerActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_media_viewer);
                  String path = getIntent().getStringExtra("file");
                  File dec = new VaultManager(this).decryptFile(path);
                  if (dec != null) ((ImageView)findViewById(R.id.imageView)).setImageBitmap(BitmapFactory.decodeFile(dec.getAbsolutePath()));
              }
          }
          EOF

          cat > app/src/main/java/com/wordgame/security/VaultManager.java << 'EOF'
          package com.wordgame.security;
          import android.content.*; import android.net.Uri; import android.util.Base64;
          import androidx.security.crypto.*; import com.wordgame.vault.VaultFile;
          import java.io.*; import java.security.MessageDigest; import java.util.*;
          import javax.crypto.*; import javax.crypto.spec.*;
          public class VaultManager {
              Context ctx; SharedPreferences prefs; SecretKey key;
              public VaultManager(Context c) {
                  ctx = c;
                  try {
                      MasterKey mk = new MasterKey.Builder(ctx).setKeyScheme(MasterKey.KeyScheme.AES256_GCM).build();
                      prefs = EncryptedSharedPreferences.create(ctx, "v_prefs", mk, EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV, EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM);
                      if (!prefs.contains("pin")) prefs.edit().putString("pin", hash("Dimon3275")).apply();
                      if (!prefs.contains("k")) {
                          KeyGenerator kg = KeyGenerator.getInstance("AES"); kg.init(256);
                          prefs.edit().putString("k", Base64.encodeToString(kg.generateKey().getEncoded(), 0)).apply();
                      }
                      key = new SecretKeySpec(Base64.decode(prefs.getString("k", ""), 0), "AES");
                  } catch (Exception e) {}
              }
              public boolean authenticate(String p) { return hash(p).equals(prefs.getString("pin", "")); }
              String hash(String p) {
                  try {
                      MessageDigest md = MessageDigest.getInstance("SHA-256");
                      byte[] b = md.digest(p.getBytes()); StringBuilder sb = new StringBuilder();
                      for (byte x : b) sb.append(String.format("%02x", x));
                      return sb.toString();
                  } catch (Exception e) { return ""; }
              }
              public void importFile(Uri uri) {
                  try {
                      String id = UUID.randomUUID().toString();
                      File out = new File(ctx.getFilesDir(), "vault/" + id);
                      out.getParentFile().mkdirs();
                      Cipher c = Cipher.getInstance("AES/CBC/PKCS5Padding"); c.init(Cipher.ENCRYPT_MODE, key);
                      FileOutputStream fos = new FileOutputStream(out);
                      fos.write(c.getIV());
                      CipherOutputStream cos = new CipherOutputStream(fos, c);
                      InputStream is = ctx.getContentResolver().openInputStream(uri);
                      byte[] b = new byte[8192]; int l;
                      while ((l = is.read(b)) > 0) cos.write(b, 0, l);
                      cos.close(); is.close();
                      prefs.edit().putString(id, "Media_" + id.substring(0,4)).apply();
                  } catch (Exception e) {}
              }
              public List<VaultFile> getFiles() {
                  List<VaultFile> list = new ArrayList<>();
                  File dir = new File(ctx.getFilesDir(), "vault");
                  if (dir.exists() && dir.listFiles() != null) {
                      for (File f : dir.listFiles()) list.add(new VaultFile(prefs.getString(f.getName(), "Unknown"), f.getName(), "image"));
                  }
                  return list;
              }
              public File decryptFile(String path) {
                  try {
                      File in = new File(ctx.getFilesDir(), "vault/" + path);
                      FileInputStream fis = new FileInputStream(in);
                      byte[] iv = new byte[16]; fis.read(iv);
                      Cipher c = Cipher.getInstance("AES/CBC/PKCS5Padding"); c.init(Cipher.DECRYPT_MODE, key, new IvParameterSpec(iv));
                      File out = new File(ctx.getCacheDir(), "tmp");
                      CipherInputStream cis = new CipherInputStream(fis, c);
                      FileOutputStream fos = new FileOutputStream(out);
                      byte[] b = new byte[8192]; int l;
                      while ((l = cis.read(b)) > 0) fos.write(b, 0, l);
                      fos.close(); cis.close(); return out;
                  } catch (Exception e) { return null; }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WordPuzzle_Fixed
          path: app/build/outputs/apk/debug/app-debug.apk

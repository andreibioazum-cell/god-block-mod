          private void savePrefs(){SharedPreferences.Editor ed=getSharedPreferences("enjoer",MODE_PRIVATE).edit();ed.putInt("ridix",ridix);ed.putBoolean("fly",ownedFly);ed.putInt("pack",equippedPack);ed.putBoolean("infRidix",infiniteRidix);ed.putInt("face",selectedFace);if(ren!=null){ed.putFloat("sR",ren.charSkinR);ed.putFloat("sG",ren.charSkinG);ed.putFloat("sB",ren.charSkinB);ed.putFloat("tR",ren.charTorsoR);ed.putFloat("tG",ren.charTorsoG);ed.putFloat("tB",ren.charTorsoB);ed.putFloat("lR",ren.charLegsR);ed.putFloat("lG",ren.charLegsG);ed.putFloat("lB",ren.charLegsB);ed.putFloat("hR",ren.charHairR);ed.putFloat("hG",ren.charHairG);ed.putFloat("hB",ren.charHairB);}ed.apply();}

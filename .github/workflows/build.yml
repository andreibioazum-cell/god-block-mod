name: TasksAI Neural UI (Java + C++ Eigen)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Android Project Structure
        run: |
          # БЕЗОПАСНАЯ ОЧИСТКА (сохраняем .git и .github)
          find . -maxdepth 1 ! -name '.github' ! -name '.git' ! -name '.' -exec rm -rf {} +
          
          # Создание структуры
          mkdir -p app/src/main/java/com/tasksai/neural
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

      - name: Download Eigen (AI Library)
        run: |
          wget -q https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz
          tar -xzf eigen-3.4.0.tar.gz
          mv eigen-3.4.0 app/src/main/cpp/eigen
          rm eigen-3.4.0.tar.gz

      - name: Create C++ Neural Core
        run: |
          cat > app/src/main/cpp/native-lib.cpp << 'EOF'
          #include <jni.h>
          #include <string>
          #include <Eigen/Dense>

          using namespace Eigen;

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_tasksai_neural_MainActivity_processWithAI(JNIEnv* env, jobject, jfloat val) {
              // Реальный матричный расчет нейроном
              MatrixXf weights = MatrixXf::Random(1, 1);
              MatrixXf input(1, 1);
              input(0, 0) = val;
              MatrixXf output = input * weights;
              
              std::string res = "AI Output: " + std::to_string(output(0,0));
              return env->NewStringUTF(res.c_str());
          }
          EOF

          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(neural_core)
          include_directories(eigen)
          add_library(native-lib SHARED native-lib.cpp)
          target_link_libraries(native-lib log)
          EOF

      - name: Create Java UI (MainActivity)
        run: |
          cat > app/src/main/java/com/tasksai/neural/MainActivity.java << 'EOF'
          package com.tasksai.neural;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.*;
          import android.graphics.Color;

          public class MainActivity extends Activity {
              static { System.loadLibrary("native-lib"); }
              public native String processWithAI(float val);

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(60, 100, 60, 60);
                  root.setBackgroundColor(0xFF0D1117);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);

                  TextView tv = new TextView(this);
                  tv.setText("TasksAI Smart Guess");
                  tv.setTextColor(0xFF58A6FF);
                  tv.setTextSize(28);
                  root.addView(tv);

                  EditText ed = new EditText(this);
                  ed.setHint("Input value...");
                  ed.setHintTextColor(0xFF484F58);
                  ed.setTextColor(Color.WHITE);
                  root.addView(ed);

                  Button btn = new Button(this);
                  btn.setText("THINK WITH NEURAL CORE");
                  btn.setPadding(0, 40, 0, 40);
                  root.addView(btn);

                  TextView out = new TextView(this);
                  out.setTextColor(0xFFC9D1D9);
                  out.setPadding(0, 50, 0, 0);
                  root.addView(out);

                  btn.setOnClickListener(v -> {
                      try {
                          float vIn = Float.parseFloat(ed.getText().toString());
                          out.setText(processWithAI(vIn));
                      } catch(Exception e) { out.setText("Enter valid number"); }
                  });

                  setContentView(root);
              }
          }
          EOF

      - name: Configure Gradle
        run: |
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'EOF'
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.tasksai.neural'
              compileSdk 34
              defaultConfig {
                  applicationId "com.tasksai.neural"
                  minSdk 26
                  targetSdk 34
                  externalNativeBuild { cmake { cppFlags "" } }
              }
              externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt" } }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="TasksAI Neural" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name="com.tasksai.neural.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Commit and Push Files
        run: |
          git config --global user.name "TasksAIBot"
          git config --global user.email "bot@tasksai.com"
          git add .
          git commit -m "Fix: Full Neural Project with Java UI" || echo "No changes"
          git push origin main --force

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TasksAI-Final-Hybrid
          path: app/build/outputs/apk/debug/*.apk
